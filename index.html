<div class=\"ln\" style=\"--in:0\">PPP (?)。（パブリック・プライベート・パートナーシップ、<ruby>官民<rt>かんみん<\/rt><\/ruby>連携のことか）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>NPM が答えようとした問いは今も有効で、答え方を変える必要がある、という整理。第5章のモデル比較はすべてこの5つの問いへの別々の答え。<\/p>"]},"5-2 第一世代改革の成果":{"id":"5-2 第一世代改革の成果","h":"5-2 第一世代改革の成果","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-2 1980・90年代の改革の成果<\/b>（p.37）<\/div><div class=\"ln\">1980・1990年代の第一世代の改革：効率性、政府支出の削減、市場メカニズム、競争の重視<\/div><div class=\"ln\">⇓<\/div><div class=\"ln\">(1)<ruby>内在<rt>ないざい<\/rt><\/ruby>する本質的な問題を十分考慮せずに、マネジメントの手法を取り入れようとした<\/div><div class=\"ln\">(2)憲法の<ruby>枠組<rt>わくぐ<\/rt><\/ruby>みで政府が活動することを認識することについて誤った<\/div><div class=\"ln\">(3)パブリック・マネジメントは単に効率性だけではなく、深いガバナンスの価値を考慮すべき<\/div><div class=\"ln\">OECD (2002)<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>(2)がわかりにくいが、政府は企業と違い、憲法上の権限配分、議会への責任、法の支配の中で動く存在なので、企業のように自由に組織をいじれない、という意味。<\/p>"]},"第一世代改革の評価":{"id":"第一世代改革の評価","h":"第一世代改革の評価","part":"重要概念展开","sect":"ガバナンス論","blocks":["<p>OECD（2002）は、1980・90年代の第一世代の改革（効率性、支出削減、市場メカニズム、競争の重視）について、①<ruby>内在<rt>ないざい<\/rt><\/ruby>する本質的な問題を十分考えずにマネジメント手法を取り入れた ②憲法の<ruby>枠組<rt>わくぐ<\/rt><\/ruby>みの中で政府が活動することを見誤った ③パブリック・マネジメントは効率性だけでなく、より深いガバナンスの価値を考慮すべき、と総括した。ここから「NPM に代わる仕組み」としてガバナンス論が台頭する。<\/p>"]},"5-3 3つのガバナンス・モデル":{"id":"5-3 3つのガバナンス・モデル","h":"5-3 3つのガバナンス・モデル","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-3 3つのガバナンス・モデル<\/b>（p.38）<\/div><div class=\"ln\">&nbsp;<\/div><div class=\"ln\">| | 伝統型 | NPM | ネットワーク型 |<\/div><div class=\"ln\">|---|---|---|---|<\/div><div class=\"ln\">| 国民 | 投票者 | 受身的な消費者 | 積極的な参加者 |<\/div><div class=\"ln\">| 政治家 | 代表 | 購入者 | 共同の意思決定者 |<\/div><div class=\"ln\">| 官僚 | 行政官 | 政策助言・マネージャー | 政策助言（マネージャー） |<\/div><div class=\"ln\">| 目標 | 平等の維持 | 効率性と質の向上 | アントレプレナーシップの開発 |<\/div><div class=\"ln\">| 形態 | プロセス、インプット、ヒエラルキー | 顧客志向、<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化 | 参加、ボトムアップ |<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">network（ネットワーク型）：<ruby>協働<rt>きょうどう<\/rt><\/ruby>、民間中心。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>縦に読むと各モデルの全体像、横に読むと「国民がどう扱われるか」の変化がわかる。投票者 → 消費者 → 参加者。<\/p>"]},"3つのガバナンス・モデル":{"id":"3つのガバナンス・モデル","h":"3つのガバナンス・モデル","part":"重要概念展开","sect":"ガバナンス論","blocks":["<div class=\"tbl\"><table><tr><th><\/th><th>伝統型<\/th><th>NPM<\/th><th>ネットワーク型<\/th><\/tr><tr><td>国民<\/td><td>投票者<\/td><td>受身的な消費者<\/td><td>積極的な参加者<\/td><\/tr><tr><td>政治家<\/td><td>代表<\/td><td>購入者<\/td><td>共同の意思決定者<\/td><\/tr><tr><td>官僚<\/td><td>行政官<\/td><td>政策助言・マネージャー<\/td><td>政策助言（マネージャー）<\/td><\/tr><tr><td>目標<\/td><td>平等の維持<\/td><td>効率性と質の向上<\/td><td>アントレプレナーシップの開発<\/td><\/tr><tr><td>形態<\/td><td>プロセス、インプット、ヒエラルキー<\/td><td>顧客志向、{分権<\/td><td>ぶんけん}化<\/td><td>参加、ボトムアップ<\/td><\/tr><\/table><\/div>"]},"ネットワークと協働":{"id":"ネットワークと協働","h":"ネットワークと協働","part":"重要概念展开","sect":"ガバナンス論","blocks":["<p>ネットワーク・ガバナンスでは、政府はヒエラルキーの頂点から命令する存在から、企業・NPO・市民とのネットワークを調整する存在になる。鍵になるのが<b><ruby>協働<rt>きょうどう<\/rt><\/ruby><\/b>で、市民がサービスの設計や評価に参加し、共同でサービスを生み出す（co-production）。PPP（Public-Private Partnership、<ruby>官民<rt>かんみん<\/rt><\/ruby>連携）は、PFI、指定管理者、<ruby>包括<rt>ほうかつ<\/rt><\/ruby>委託、SIB などを含む広い概念。<\/p>"]},"5-4 Osborneの3モデル":{"id":"5-4 Osborneの3モデル","h":"5-4 Osborneの3モデル","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-4 Osborne (2010)の3つのモデル<\/b>（p.39）<\/div><div class=\"ln\">&nbsp;<\/div><div class=\"ln\">| パラダイム | Public Administration | New Public Management | New Public Service |<\/div><div class=\"ln\">|---|---|---|---|<\/div><div class=\"ln\">| 理論的根拠 | 政治学と公共政策 | 公共選択論、経営学 | 制度的・ネットワーク的理論 |<\/div><div class=\"ln\">| 国の性質 | 単一的 | 規制的 | 多元的 |<\/div><div class=\"ln\">| 焦点 | 政治システム | 組織 | 環境の中における組織 |<\/div><div class=\"ln\">| 強調 | 政策立案と実施 | 資源の管理と業績 | 価値の交渉、<ruby>文脈<rt>ぶんみゃく<\/rt><\/ruby>、相互関係 |<\/div><div class=\"ln\">| 資源配分のメカニズム | ヒエラルキー | 市場と新古典派的な契約 | ネットワークと合理的な契約 |<\/div><div class=\"ln\">| サービスシステムの性質 | 閉鎖的 | 開放的で合理的 | 開放的で閉鎖 |<\/div><div class=\"ln\">| 価値の基盤 | 公的部門の<ruby>規範<rt>きはん<\/rt><\/ruby> | 競争の有効性と市場 | 分散と競争 |<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\"> → オズボーン（Osborne）のことか (?)<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>スライドの3列目は \"New Public Service\" と書かれているが、オズボーン自身の用語は <b>New Public Governance(NPG)<\/b>。「合理的な契約」は原典では relational contracts（関係的な契約）で、長期的な信頼関係に基づく契約のこと。<\/p>"]},"NPG":{"id":"NPG","h":"NPG","part":"重要概念展开","sect":"ガバナンス論","blocks":["<p>スティーブン・オズボーン（2010）は、行政のパラダイムを <b>PA<\/b>（Public Administration）→ <b>NPM<\/b> → <b>NPG<\/b>（New Public Governance）の3段階で整理した。PA の理論的根拠は政治学と公共政策、国家は<ruby>単一<rt>たんいつ<\/rt><\/ruby>的、焦点は政治システム、資源配分はヒエラルキー。NPM は公共選択論と経営学、規制的な国家、焦点は組織、資源配分は市場と契約。NPG は制度論・ネットワーク理論、<b><ruby>多元<rt>たげん<\/rt><\/ruby>的な国家<\/b>、焦点は環境の中における組織、資源配分は<b>ネットワークと関係的な契約<\/b>で、価値の交渉や相互関係が重視される。サービスは政府だけでなく、企業・NPO・市民とのネットワークで<b>共同生産<\/b>される。<\/p>"]},"5-5 Denhardtの3モデル":{"id":"5-5 Denhardtの3モデル","h":"5-5 Denhardtの3モデル","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-5 Denhardt&amp;Denhardt (2003)の3つのモデル<\/b>（p.40）<\/div><div class=\"ln\">&nbsp;<\/div><div class=\"ln\">| | Old Public Administration | New Public Management | New Public Service |<\/div><div class=\"ln\">|---|---|---|---|<\/div><div class=\"ln\">| 理論的基盤 | 政治理論 | 経済理論 | 民主制理論 |<\/div><div class=\"ln\">| 合理性・人間行動 | 「行政人」 | 「経済人」、利己的 | 戦略的、正統的な合理性 |<\/div><div class=\"ln\">| 公益の概念 | 公益は政治的に定義され、法に規定 | 公益は個人の利益の総和 | 公益は共有された価値についての対話の結果 |<\/div><div class=\"ln\">| 公共サービスの応答 | 顧客、選挙区 | 消費者 | 市民 |<\/div><div class=\"ln\">| 政府の役割 | <ruby>漕<rt>こ<\/rt><\/ruby>ぐ（政策の設計と実施） | 舵とり（市場が機能するように<ruby>媒介<rt>ばいかい<\/rt><\/ruby>） | 奉仕（市民の間で仲介、共有価値創造） |<\/div><div class=\"ln\">| 政策目的達成 | 政府機関によるプログラムの管理 | 企業や非営利が活動するよう<ruby>誘因<rt>ゆういん<\/rt><\/ruby>を付与 | 相互に合意したニーズを満たすため公共、非営利、民間が<ruby>協働<rt>きょうどう<\/rt><\/ruby> |<\/div><div class=\"ln\">| アカウンタビリティ | ヒエラルキー、政治家に応答する行政官 | 市場原理（個人の利益の追求が市民全体の望ましい結果となる） | 多角的（<ruby>公務<rt>こうむ<\/rt><\/ruby>員は法律、政治的価値、専門性、市民の利益等に従う） |<\/div><div class=\"ln\">| 行政的な<ruby>裁量<rt>さいりょう<\/rt><\/ruby> | 限定的な<ruby>裁量<rt>さいりょう<\/rt><\/ruby> | 起業的な目的達成のため大きな<ruby>裁量<rt>さいりょう<\/rt><\/ruby> | <ruby>裁量<rt>さいりょう<\/rt><\/ruby>は必要だが、抑制的 |<\/div><div class=\"ln\">| 組織の構造 | 官僚的、トップダウン | 一定の指示の下<ruby>分権<rt>ぶんけん<\/rt><\/ruby>的 | 指導性の下で<ruby>協働<rt>きょうどう<\/rt><\/ruby>的 |<\/div><div class=\"ln\">| <ruby>公務<rt>こうむ<\/rt><\/ruby>員の動機 | 給与・恩典・身分保障 | 起業家的精神、政府の規模削減の追求 | 公共サービス、社会への貢献 |<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>「政府の役割」の行が一番覚えやすい。<ruby>漕<rt>こ<\/rt><\/ruby>ぐ → 舵をとる → 奉仕する。<\/p>"]},"NPS":{"id":"NPS","h":"NPS","part":"重要概念展开","sect":"ガバナンス論","blocks":["<p>デンハート夫妻（2003）の <b>NPS<\/b>（New Public Service）は、NPM の「顧客」観への批判から生まれたモデル。OPA では政府の役割は「<ruby>漕<rt>こ<\/rt><\/ruby>ぐ」（政策の設計と実施）、NPM では「舵を取る」（市場が機能するよう誘導）、NPS では「<b>奉仕する<\/b>」（市民の間で仲介し、共有価値を<ruby>創出<rt>そうしゅつ<\/rt><\/ruby>する）。公益は、OPA では政治的に定義され法に規定されるもの、NPM では個人の利益の総和、NPS では<b>共有された価値についての対話の結果<\/b>とされる。<ruby>公務<rt>こうむ<\/rt><\/ruby>員の動機も、OPA は給与・<ruby>恩典<rt>おんてん<\/rt><\/ruby>・身分保障、NPM は起業家精神と政府の規模縮小、NPS は公共サービスと社会への貢献。<\/p>"]},"5-6 Considine&Lewis":{"id":"5-6 Considine&Lewis","h":"5-6 Considine&amp;Lewis","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-6 Considine&amp;Lewis (2003)のガバナンス<\/b>（p.41）<\/div><div class=\"ln\">&nbsp;<\/div><div class=\"ln\">| | 手続きのガバナンス | 企業のガバナンス | 市場のガバナンス | ネットワークのガバナンス |<\/div><div class=\"ln\">|---|---|---|---|---|<\/div><div class=\"ln\">| 合理性の根拠 | 法律 | マネジメント | 競争 | 文化 |<\/div><div class=\"ln\">| コントロールの形態 | ルール | 計画 | 契約 | <ruby>協働<rt>きょうどう<\/rt><\/ruby> |<\/div><div class=\"ln\">| 重要な長所 | 信頼できる扱い | 目標志向 | コスト志向 | 弾力的 |<\/div><div class=\"ln\">| サービス提供の焦点 | 普遍的 | 目標化されたグループ | 価格 | 依頼人 |<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>NPM を「企業型」と「市場型」の2つに分けているのが特徴。同じ NPM でも、目標で管理する（企業型）のと、競争させる（市場型）のは別物。<\/p>"]},"4つのガバナンス類型":{"id":"4つのガバナンス類型","h":"4つのガバナンス類型","part":"重要概念展开","sect":"ガバナンス論","blocks":["<p>コンシダインとルイス（2003）は、ガバナンスを4類型に分けた。<b>手続きのガバナンス<\/b>（根拠は法律、統制はルール、長所は信頼できる扱い、サービスは<ruby>普遍<rt>ふへん<\/rt><\/ruby>的）、<b>企業のガバナンス<\/b>（マネジメント、計画、目標志向、ターゲット化されたグループ）、<b>市場のガバナンス<\/b>（競争、契約、コスト志向、価格）、<b>ネットワークのガバナンス<\/b>（文化、<ruby>協働<rt>きょうどう<\/rt><\/ruby>、弾力的、依頼人）。<\/p>"]},"5-7 Petersの4モデル":{"id":"5-7 Petersの4モデル","h":"5-7 Petersの4モデル","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-7 Peters(2001)のガバメント<\/b>（p.42）<\/div><div class=\"ln\">&nbsp;<\/div><div class=\"ln\">| | Market Government | Participative Government | Flexible Government | Deregulated Government |<\/div><div class=\"ln\">|---|---|---|---|---|<\/div><div class=\"ln\">| 問題認識 | 独占 | ヒエラルキー | <ruby>永続<rt>えいぞく<\/rt><\/ruby> | 内部規制 |<\/div><div class=\"ln\">| 構造 | <ruby>分権<rt>ぶんけん<\/rt><\/ruby>化 | 水平的な組織 | バーチャルな組織 | 特に推奨モデルはない |<\/div><div class=\"ln\">| マネジメント | 業績給与、民間の経営手法 | TQM、チーム | 非常勤職員の管理 | 経営上の大きな<ruby>裁量<rt>さいりょう<\/rt><\/ruby> |<\/div><div class=\"ln\">| 政策立案 | 内部市場、市場のインセンティヴ | コンサルテーション、交渉 | 実験 | 起業家的な政府 |<\/div><div class=\"ln\">| 公共の関心 | 低コスト | 関与、コンサルテーション | 低コスト、協調 | 創造性、改革 |<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>「伝統的な政府の何が問題か」（問題認識）の行から読むとわかりやすい。独占が問題なら市場型、ヒエラルキーが問題なら参加型、組織の<ruby>永続<rt>えいぞく<\/rt><\/ruby>性が問題なら柔軟型、内部の規制が問題なら規制緩和型。<\/p>"]},"ピーターズの4モデル":{"id":"ピーターズの4モデル","h":"ピーターズの4モデル","part":"重要概念展开","sect":"ガバナンス論","blocks":["<p>B・ガイ・ピーターズ（2001）は、伝統的な政府に代わる4つのモデルを示した。<b>市場型政府<\/b>（問題は独占、処方は<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化・業績給・内部市場、公共の関心は低コスト）、<b>参加型政府<\/b>（問題はヒエラルキー、処方は水平的組織・TQM・協議、公共の関心は関与）、<b>柔軟型政府<\/b>（問題は<ruby>永続<rt>えいぞく<\/rt><\/ruby>性、処方はバーチャルな組織・非常勤職員・実験）、<b>規制緩和型政府<\/b>（問題は内部規制、処方は管理上の大きな<ruby>裁量<rt>さいりょう<\/rt><\/ruby>・起業家的な政府）。<\/p>"]},"5-8 NWS・NPM・NPG":{"id":"5-8 NWS・NPM・NPG","h":"5-8 NWS・NPM・NPG","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-8 NWS, NPM and NPG<\/b>（p.43）<\/div><div class=\"ln\">Neo-Weberian State model：国家（公共部門・ヒエラルキー）が中心<\/div><div class=\"ln\">New Public Management model：ビジネス（民間部門・市場）が中心<\/div><div class=\"ln\">New Public Governance model：市民社会（非営利・ネットワーク）が中心<\/div><div class=\"ln\">※三者（国家／ビジネス／市民社会）のうち、黄色で強調された部分が各モデルの軸<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>3つのモデルの違いを「誰が中心か」だけで表した図。日本や独仏のように官僚制を維持しつつ近代化する道は NWS に近い。<\/p>"]},"NWS・NPM・NPG":{"id":"NWS・NPM・NPG","h":"NWS・NPM・NPG","part":"重要概念展开","sect":"ガバナンス論","blocks":["<p>国家（公共部門・ヒエラルキー）、ビジネス（民間部門・市場）、市民社会（非営利・ネットワーク）の三者のうち、どこを中心に<ruby>据<rt>す<\/rt><\/ruby>えるかで3つのモデルを対比した図。<b>NWS<\/b>（Neo-Weberian State、新ウェーバー型国家、Pollitt &amp; Bouckaert が大陸<ruby>欧州<rt>おうしゅう<\/rt><\/ruby>の改革を説明するために<ruby>提唱<rt>ていしょう<\/rt><\/ruby>）は国家が中心で、官僚制を近代化しつつ維持する。<b>NPM<\/b> は市場が中心、<b>NPG<\/b> は市民社会・ネットワークが中心。独・仏の改革は NWS 型と言われ、日本の位置づけを考えるうえでも参考になる。<\/p>"]},"6-1 ポストNPMの模索":{"id":"6-1 ポストNPMの模索","h":"6-1 ポストNPMの模索","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-1 ポストNPMの模索<\/b>（p.44）<\/div><div class=\"ln\">民間の経営手法の導入といった単純な「NPM的改革」からの脱却<\/div><div class=\"ln\">⇓<\/div><div class=\"ln\">政府のキャパシティを改善する重要な論点 by OECD(2002)<\/div><div class=\"ln\">(1)<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度、リーダーシップ、グッド・ガバナンスについての深い理解<\/div><div class=\"ln\">(2)行動や態度の変化についてのより実証的な研究とデータ<\/div><div class=\"ln\">(3)改善された介入の方法と変革のストラテジー<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>「キャパシティ」は政府そのものの能力。NPM が外部化・市場化で効率を上げようとしたのに対し、ポストNPM は政府の中身（人材・リーダーシップ）を<ruby>鍛<rt>きた<\/rt><\/ruby>え直す方向に戻ってきた。<\/p>"]},"ポストNPMの模索":{"id":"ポストNPMの模索","h":"ポストNPMの模索","part":"重要概念展开","sect":"ポストNPM","blocks":["<p>「民間の経営手法を導入すればよい」という単純な NPM 的改革からの脱却。OECD（2002）は政府の<b>キャパシティ<\/b>（能力）を改善するための論点として、①<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度、リーダーシップ、グッド・ガバナンスについての深い理解 ②行動や態度の変化についてのより実証的な研究とデータ ③改善された介入の方法と変革のストラテジー、を挙げた。<ruby>英国<rt>えいこく<\/rt><\/ruby>ブレア政権の改革（事例参照）は、ポストNPMの代表例とされる <b>Joined-up Government<\/b>（省庁横断の連携政府）の流れに位置づけられる。<\/p>"]},"6-2 ブレアの宣言":{"id":"6-2 ブレアの宣言","h":"6-2 ブレアの宣言","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-2 英ブレア首相の宣言<\/b>（p.45）<\/div><div class=\"ln\">The Government has a mission to modernise – renewing our country for the new millennium. We are modernising our schools, our hospitals, our economy and our criminal justice system. We are modernising our democratic framework.（略）<\/div><div class=\"ln\">But modernisation must go further. It must engage with how government itself works.（略）The old arguments about government are now outdated – big government against small government, interventionism against laissez-faire.（略）<\/div><div class=\"ln\">Modernising Government is a significant step forward in what is a long-term programme of reform. It puts in place a number of important initiatives, and sets out an agenda for the future.（略）, it is modernising for a purpose: modernising government to get better government – for a better Britain.<\/div><div class=\"ln\">by the Prime Minister, Tony Blair \"Modernising Government\" 1999<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>要点は「大きな政府か小さな政府か、介入か自由放任か、という古い対立はもう時代遅れ」という一文。サッチャー以来の「政府を小さくする」NPM 路線を引き継ぎつつ、政府の働き方そのものを変える（第三の道）と宣言している。<\/p>"]},"英国（サッチャーからブレアへ）":{"id":"英国（サッチャーからブレアへ）","h":"英国（サッチャーからブレアへ）","part":"事例展开","sect":"","blocks":["<p><b>サッチャー政権<\/b>（1979-90）は、国営企業の民営化（BT、ブリティッシュ・ガスなど）、強制競争入札（CCT）、そして1988年の「<b>ネクスト・ステップス<\/b>」報告に基づくエージェンシー化を進めた。省庁の実施部門を切り出し、長官に経営の<ruby>裁量<rt>さいりょう<\/rt><\/ruby>を与える一方で、<ruby>枠組<rt>わくぐ<\/rt><\/ruby>み文書で目標を明示した。<\/p>","<p><b>ブレア政権<\/b>（1997-2007）は NPM の効率重視を引き継ぎつつ、「近代化」を掲げてその限界を補おうとした。1999年の白書 \"<b>Modernising Government<\/b>\" は、政府近代化の3つの目的（関係機関の連携を強化した戦略的な政策決定、供給者の都合ではなく<b>利用者の視点<\/b>の重視、質の高い効率的な公共サービス）と5つのコミットメント（将来を見通した政策立案、市民のニーズに応える公共サービス、質の基準と監視、情報技術の活用、<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度の近代化）を掲げた。改善の基準として \"Challenge, Compare, Consult, Compete, Collaborate\" の5C、ベスト・バリューの達成（Audit Commission による監視の強化、顧客志向＋成果志向）も示された。<\/p>","<p>2000年の「省庁連携白書」（\"Wiring It Up\"）は、縦割りを超えた政策課題に対応するため、大臣・幹部<ruby>公務<rt>こうむ<\/rt><\/ruby>員のリーダーシップ、省際問題を処理できる政策形成・執行の仕組み、スキルのある職員の育成、予算使用の柔軟性、監査機関の活用、<b>政府<ruby>中枢<rt>ちゅうすう<\/rt><\/ruby>のリーダーシップ<\/b>を提言した。これが <b>Joined-up Government<\/b> と呼ばれるポストNPM の代表的な潮流である。<\/p>"]},"6-3 Modernising Government":{"id":"6-3 Modernising Government","h":"6-3 Modernising Government","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-3 英 \"Modernising Government\" (1999)<\/b>（p.46）<\/div><div class=\"ln\">「政府近代化」の3つの目的<\/div><div class=\"ln\">①政策立案において、関係機関による連携を強化し、戦略的な政策決定<\/div><div class=\"ln\">②公共サービスの利用者の視点を重視する（供給者ではなく）<\/div><div class=\"ln\">③質が高く効率的な公共サービスを提供する<\/div><div class=\"ln\">政府は5つのコミットメント<\/div><div class=\"ln\">①政策立案：成果をもたらすための政策を検討するよう将来を見通す<\/div><div class=\"ln\">②応答的な公共サービス：供給者のためではなく、市民のニーズを満たす<\/div><div class=\"ln\">③質の高い公共サービス：サービスの質や有効性の基準を設定し、監視<\/div><div class=\"ln\">④情報化時代の政府：情報技術を活用し、市民や企業のニーズに応答<\/div><div class=\"ln\">⑤<ruby>公務<rt>こうむ<\/rt><\/ruby>員：<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度を近代化し、業績マネジメントを見直す<\/div><div class=\"ln\">政策立案とサービス提供における改善の基準<\/div><div class=\"ln\">1．Challenge, 2. Compare, 3. Consult, 4. Compete, 5. Collaborate<\/div><div class=\"ln\">ベスト・バリューの達成<\/div><div class=\"ln\">①行政に対する監視体制の強化（Audit Commission）②顧客志向＋成果志向<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>5つの C のうち、NPM 的なのは Compete（競争）だけで、Consult（相談）と Collaborate（<ruby>協働<rt>きょうどう<\/rt><\/ruby>）が加わっている点がポストNPMらしさ。④に情報技術が入っていて、これが 6-12 の GDS につながっていく。<\/p>"]},"6-4 省庁連携白書":{"id":"6-4 省庁連携白書","h":"6-4 省庁連携白書","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-4 英「省庁連携白書」(2000)<\/b>（p.47）<\/div><div class=\"ln\">1．大臣・幹部<ruby>公務<rt>こうむ<\/rt><\/ruby>員のリーダーシップ<\/div><div class=\"ln\">2．省際の問題を適切に処理できるような政策形成・執行のメカニズム<\/div><div class=\"ln\">3．スキルや能力を持つ職員の育成<\/div><div class=\"ln\">4．適切に処理できるような予算使用の柔軟性<\/div><div class=\"ln\">5．監査機関の活用<\/div><div class=\"ln\">6．政府<ruby>中枢<rt>ちゅうすう<\/rt><\/ruby>のリーダーシップの発揮<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>原題は \"Wiring It Up\"。4-5 で指摘された「エージェンシーによる断片化」への処方箋で、バラバラになった組織を「配線し直す」という意味。いわゆる Joined-up Government（連携政府）。<\/p>"]},"6-5 NPM後の行政改革":{"id":"6-5 NPM後の行政改革","h":"6-5 NPM後の行政改革","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-5 NPM後の行政改革<\/b>（p.48）<\/div><div class=\"ln\">OECD(2011), \"Public Administration after NPM\"<\/div><div class=\"ln\"><ruby>豪州<rt>ごうしゅう<\/rt><\/ruby>、カナダ、デンマーク、フィンランド、アイルランド、NZ、スウェーデン、<ruby>英国<rt>えいこく<\/rt><\/ruby>における近年の行政改革を検証<\/div><div class=\"ln\">1．シェアード・サービスの発達（<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化→<ruby>集権<rt>しゅうけん<\/rt><\/ruby>化）<\/div><div class=\"ln\">2．エージェンシーの管理の改善（NPM的な管理の限界）<\/div><div class=\"ln\">3．予算編成過程における支出レビュー<\/div><div class=\"ln\">4．生産性向上による自動的な予算効率化・削減<\/div><div class=\"ln\">※<ruby>英国<rt>えいこく<\/rt><\/ruby>等では、現在、NPMという言葉はあまり使われていない。<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>1 の「<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化→<ruby>集権<rt>しゅうけん<\/rt><\/ruby>化」が 4-8 の「NPMの本質は<ruby>集権<rt>しゅうけん<\/rt><\/ruby>」と呼応している。NPM で分けた組織を、共通業務の集約という形でまた束ね直している。<\/p>"]},"NPM後の行政改革":{"id":"NPM後の行政改革","h":"NPM後の行政改革","part":"重要概念展开","sect":"ポストNPM","blocks":["<p>OECD（2011）\"Public Administration after NPM\" は、豪・加・デンマーク・フィンランド・アイルランド・NZ・スウェーデン・英の改革を検証し、4つの傾向を見出した。①<b>シェアード・サービス<\/b>の発達（人事・会計など共通業務を集約。<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化から<b><ruby>集権<rt>しゅうけん<\/rt><\/ruby>化<\/b>への<ruby>揺<rt>ゆ<\/rt><\/ruby>り戻し）②エージェンシー管理の改善（NPM 的管理の限界）③予算編成過程における<b>支出レビュー<\/b> ④生産性向上による自動的な予算効率化・削減。<ruby>英国<rt>えいこく<\/rt><\/ruby>などでは、現在は NPM という言葉自体あまり使われていない。<\/p>"]},"6-6 OECD VFMレポート":{"id":"6-6 OECD VFMレポート","h":"6-6 OECD VFMレポート","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-6 OECD VFM レポート<\/b><\/div><div class=\"ln\">&nbsp;<\/div><div class=\"ln\">| | 政府の見直し 1980-90 | NPM 1990-2005 | 基本的な政府 2005- |<\/div><div class=\"ln\">|---|---|---|---|<\/div><div class=\"ln\">| キーワード | 政府は解決手段ではなく問題の根源 | マネージャーへの<ruby>委任<rt>いにん<\/rt><\/ruby> | より現場重視 |<\/div><div class=\"ln\">| 特徴 | 規制緩和、民営化、<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化、財政再建 | 政策と執行の分離、アウトプットによる管理、外部委託、競争 | 戦略業務に特化した中心省庁、政策立案における統合調整、シェアードサービス、非政治家と専門家による<ruby>舵取<rt>かじと<\/rt><\/ruby>り |<\/div><div class=\"ln\">| 開始した国 | <ruby>米国<rt>べいこく<\/rt><\/ruby>、<ruby>英国<rt>えいこく<\/rt><\/ruby> | オーストラリア、ニュージーランド | 相違はあるが、多くの国 |<\/div><div class=\"ln\">| 理論的基盤 | 供給重視の経済学、公共選択理論 | 経営学 | 制度派経済学、行政学 |<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>1980年代の民営化・財政再建と、1990年代の NPM を区別しているのがポイント。講義冒頭の JR・NTT の民営化は、厳密には第1期「政府の見直し」にあたる。<\/p>"]},"VFMの3段階":{"id":"VFMの3段階","h":"VFMの3段階","part":"重要概念展开","sect":"ポストNPM","blocks":["<p>OECD の VFM（Value for Money）レポートは、改革を3期に分ける。<\/p>","<div class=\"tbl\"><table><tr><th><\/th><th>政府の見直し（1980-90）<\/th><th>NPM（1990-2005）<\/th><th>基本的な政府（2005-）<\/th><\/tr><tr><td>キーワード<\/td><td>政府は解決手段ではなく問題の根源<\/td><td>マネージャーへの{委任<\/td><td>いにん}<\/td><td>より現場重視<\/td><\/tr><tr><td>特徴<\/td><td>規制緩和、民営化、{分権<\/td><td>ぶんけん}化、財政再建<\/td><td>政策と執行の分離、アウトプットによる管理、外部委託、競争<\/td><td>戦略業務に特化した中心省庁、政策立案の統合調整、シェアードサービス、非政治家と専門家による{舵取<\/td><td>かじと}り<\/td><\/tr><tr><td>開始した国<\/td><td><ruby>米国<rt>べいこく<\/rt><\/ruby>、<ruby>英国<rt>えいこく<\/rt><\/ruby><\/td><td><ruby>豪州<rt>ごうしゅう<\/rt><\/ruby>、NZ<\/td><td>相違はあるが多くの国<\/td><\/tr><tr><td>理論的基盤<\/td><td>供給重視の経済学、公共選択理論<\/td><td>経営学<\/td><td>制度派経済学、行政学<\/td><\/tr><\/table><\/div>","<p>「政府は解決手段ではなく問題の根源」は、レーガン大統領の就任演説（1981）の有名な一節。<\/p>"]},"6-9 協働の具体例":{"id":"6-9 協働の具体例","h":"6-9 協働の具体例","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-9 <ruby>協働<rt>きょうどう<\/rt><\/ruby>の具体例(OECDの報告書)<\/b><\/div><div class=\"ln\">[サンフランシスコにおける近隣公園の<ruby>協働<rt>きょうどう<\/rt><\/ruby>監視（ParkScan）、アメリカ]<\/div><div class=\"ln\">地域住民が、近隣の公園の状況を監視・格付けし、その情報をウェブで公開する。当局はそれを利用し、公園の環境改善を図る。市民個人も、コメントを書き込む。<\/div><div class=\"ln\">[利用者が設計する社会的ケアサービス、イギリス]<\/div><div class=\"ln\">障害者等の利用者がそのニーズを自己評価し、その評価を専門家が確認して、予算が割り当てられる。利用者は自らのケアプランを管理し、サービスの commissioner となり、政府の専門家は、利用者の選択を助ける役割を担う。<\/div><div class=\"ln\">[住民による公共サービス評価、イタリア]<\/div><div class=\"ln\">公共サービスを評価するに当たり、行政機関と市民が<ruby>協働<rt>きょうどう<\/rt><\/ruby>することを促進することを目的とする。市民は、行政と市民組織とパートナーとなり、<ruby>協働<rt>きょうどう<\/rt><\/ruby>して評価を行うことに関与する。学校、納税、各種住民サービス、都市の環境などを評価。<\/div><div class=\"ln\">[一般家庭によるケアハウス提供、フランス]<\/div><div class=\"ln\">一般家庭（特に地方）が、空き部屋を日々の生活で支援が必要な高齢者に貸し出し、通常の生活は家主家族と共有する。政府は、高齢者に対して、財政的な支援を行うとともに、家族によって提供されるサービスの質の管理や規制を行う。<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>4つとも、市民が「サービスを受ける側」から「作る・評価する・提供する側」に回っている。5-3 の「国民＝積極的な参加者」の具体像。<\/p>"]},"協働の具体例":{"id":"協働の具体例","h":"協働の具体例","part":"事例展开","sect":"","blocks":["<p>OECD の報告書が紹介した<ruby>協働<rt>きょうどう<\/rt><\/ruby>の事例。サンフランシスコの <b>ParkScan<\/b> では、住民が近隣の公園の状況を監視・格付けしてウェブで公開し、当局がそれを使って公園の環境を改善する。<ruby>英国<rt>えいこく<\/rt><\/ruby>では、障害者などの利用者が自らのニーズを自己評価し、専門家の確認を経て予算が割り当てられ、利用者自身がケアプランを管理する（<b>パーソナル・バジェット<\/b>）。イタリアでは、市民が行政や市民組織とパートナーになって、学校、納税、住民サービス、都市環境などの公共サービスを評価する。フランスでは、一般家庭（特に地方）が空き部屋を支援の必要な高齢者に貸し、日常生活を家族と共有し、政府は高齢者に財政支援をしつつサービスの質を管理・規制する。<\/p>"]},"6-10 ソーシャル・インパクト・ボンド":{"id":"6-10 ソーシャル・インパクト・ボンド","h":"6-10 ソーシャル・インパクト・ボンド","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-10 ソーシャル・インパクト・ボンド<\/b><\/div><div class=\"ln\">1．SIBとは、2010年に<ruby>英国<rt>えいこく<\/rt><\/ruby>で始まった民間資金を活用した<ruby>官民<rt>かんみん<\/rt><\/ruby>連携による社会問題解決の仕組み<\/div><div class=\"ln\">2．ポイントは、<ruby>官民<rt>かんみん<\/rt><\/ruby>連携で公共サービスの提供を行なうこと、成果指標を開発し、事業の成果を<ruby>可視<rt>かし<\/rt><\/ruby>化すること、成果志向の資金の流れを生むこと。<\/div><div class=\"ln\">3．日本でも、「日本<ruby>再興<rt>さいこう<\/rt><\/ruby>戦略2016」（2016年6月2日閣議決定）等を受けて、モデル事業の実施や本格導入の検討が開始。例えば、虐待防止、認知症予防、糖尿病重症化予防、がん検診率向上、起業支援など<\/div><div class=\"ln\">図：行政 ⇄ 中間支援組織（SIB組成＆成果報酬契約）／資金提供者 → 事業資金を提供／中間支援組織 → 調達＆全体管理 → サービス提供者 → サービス対象者／評価アドバイザ → 進捗＆成果管理／第三者評価機関 → 社会的成果の評価・成果報告<\/div><div class=\"ln\">日本財団(2017)「新たな<ruby>官民<rt>かんみん<\/rt><\/ruby>連携の仕組み：ソーシャル・インパクト・ボンドについて」<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\"><ruby>八王子<rt>はちおうじ<\/rt><\/ruby>市でも実施。<\/div><div class=\"ln\" style=\"--in:0\"><ruby>中枢<rt>ちゅうすう<\/rt><\/ruby>例：NZ。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>図のポイントは、行政がお金を払うのは<b>成果が出たときだけ<\/b>ということ。先にお金を出してリスクを負うのは資金提供者。口頭で<ruby>八王子<rt>はちおうじ<\/rt><\/ruby>市の例が出た（大腸がん検診の受診<ruby>勧奨<rt>かんしょう<\/rt><\/ruby>）。<\/p>"]},"SIBと八王子市":{"id":"SIBと八王子市","h":"SIBと八王子市","part":"事例展开","sect":"","blocks":["<p><b>ソーシャル・インパクト・ボンド(SIB)<\/b>は、2010年に<ruby>英国<rt>えいこく<\/rt><\/ruby>のピーターバラ刑務所で始まった<ruby>官民<rt>かんみん<\/rt><\/ruby>連携の仕組み。民間の資金提供者が事業資金を出し、サービス提供者（NPO など）が事業を行い、第三者評価機関が社会的成果を評価する。成果目標を達成した場合にのみ、行政が資金提供者に成果報酬を支払う。行政は成果が出なければ支払わなくてよく、事業の成果が<ruby>可視<rt>かし<\/rt><\/ruby>化され、成果志向の資金の流れが生まれる。<\/p>","<p>日本では「日本<ruby>再興<rt>さいこう<\/rt><\/ruby>戦略2016」を受けてモデル事業が始まり、<b><ruby>八王子<rt>はちおうじ<\/rt><\/ruby>市<\/b>が2017年度から、<ruby>神戸<rt>こうべ<\/rt><\/ruby>市とともに日本で最初期の本格的な SIB を導入した ⚠。<ruby>八王子<rt>はちおうじ<\/rt><\/ruby>市の事業は<b>大腸がん検診の受診<ruby>勧奨<rt>かんしょう<\/rt><\/ruby><\/b>で、過去の受診データを分析して、受診しそうにない人に個別化したメッセージを送り、受診率と精密検査受診率の向上を成果指標にした。ほかにも虐待防止、認知症予防、糖尿病重症化予防、起業支援などの分野で実施されている。<\/p>"]},"6-11 ポストNPMの課題":{"id":"6-11 ポストNPMの課題","h":"6-11 ポストNPMの課題","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-11 ガバナンスに関するポストNPMの課題<\/b><\/div><div class=\"ln\">1．政府は政策立案における独占から自由になったかもしれないが、それは多くのうちの1つに過ぎない。<\/div><div class=\"ln\">2．サービス提供において、NPMは関連性がある。それは、情報の非対称性、PA理論、取引費用、細分化、市場化、インセンティブ付与がカギとなる。<\/div><div class=\"ln\">3．政府はサービス提供における独占から開放されてはいない。政府が、サービスをより効率的・効果的に提供し続けるためには、様々な仕組みや制度を活用する必要がある。<\/div><div class=\"ln\">4．それは、意図した、あるいは意図せざる結果（良いもの、悪いもの）をもたらす。<\/div><div class=\"ln\">⇓<\/div><div class=\"ln\">こうしたリスクを管理し公共部門のパフォーマンスを改善するため<\/div><div class=\"ln\">①公共部門の基準や倫理についての価値の再認識<\/div><div class=\"ln\">②政府の<ruby>中枢<rt>ちゅうすう<\/rt><\/ruby>部門の役割の強化<\/div><div class=\"ln\">③良いコーポレート・ガバナンスの原則の適用<\/div><div class=\"ln\">Gambhir Bhatta, \"Post-NPM Themes in Public Sector Governance\"<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>NPM を捨てるのではなく、サービス提供の場面では今も NPM の道具（PA理論・取引費用など）が有効だと認めた上で、そのリスクを倫理と<ruby>中枢<rt>ちゅうすう<\/rt><\/ruby>の強化で管理する、という折衷的な立場。<\/p>"]},"ポストNPMの課題":{"id":"ポストNPMの課題","h":"ポストNPMの課題","part":"重要概念展开","sect":"ポストNPM","blocks":["<p>ガンビール・バッタ（Gambhir Bhatta）は、ポストNPMの課題を次のように整理した。①政府は政策立案の独占から自由になったかもしれないが、それは多くの主体のうちの一つに過ぎなくなったということ ②サービス提供では NPM は依然として有効で、情報の非対称性、PA 理論、取引費用、細分化、市場化、インセンティブ付与が鍵になる ③政府はサービス提供の責任から解放されてはおらず、効率的・効果的に提供し続けるために様々な仕組みを活用する必要がある ④それは意図した、あるいは意図せざる結果（良いもの、悪いもの）をもたらす。こうしたリスクを管理するため、公共部門の基準や倫理についての価値の再認識、<b>政府<ruby>中枢<rt>ちゅうすう<\/rt><\/ruby>部門の役割の強化<\/b>、良いコーポレート・ガバナンスの原則の適用が求められる。<\/p>"]},"6-12 英GDS":{"id":"6-12 英GDS","h":"6-12 英GDS","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-12 英のデジタルサービス改革<\/b>（p.55）<\/div><div class=\"ln\">2011年、<ruby>英国<rt>えいこく<\/rt><\/ruby>政府は、内閣府にGDS(Government Digital Service)という組織を設置。<\/div><div class=\"ln\">2012年に策定された「政府デジタル戦略」では、各政府機関が各種サービスを「デジタル・バイ・デフォルト」で提供するとともに、市民向けの政策形成、市民とのコミュニケーションを見直すことが示された。<\/div><div class=\"ln\">　※議会への電子請願、選挙登録、失業手当、土地登記、確定申告、パスポート、自動車のナンバープレートなど、26の主要サービスをデジタル化<\/div><div class=\"ln\">2014年、GDSの中に、<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度改革の一環として、政策形成過程をよりオープンにするために、ポリシー・ラボ(Policy Lab)が設置。<\/div><div class=\"ln\">　※ポリシー・ラボは、9人の専門家で構成される小さなチーム。彼らは、デザイナー、研究者、政策立案者であり、様々な外部の専門家とも協力しながら、各省庁にける政策分野の担当者が、よりオープンで、データに基づき、デジタルかつ利用者の視点に立った方法で政策をつくることを支援する<\/div><div class=\"ln\">⇓<\/div><div class=\"ln\"><b>キーワードは「デザイン思考」「サービスデザイン」<\/b><\/div><div class=\"ln\">「デジタルサービスデザイン原則」：①ニーズからスタートする、②余計なことをしない、③データに基づきデザインする、④シンプルにする、⑤試行錯誤、⑥誰でも使えるようにする、⑦ユーザーを取り巻く状況を理解する、⑧ウェブサイトではなくデジタルサービスを提供する、⑨画一ではなく首尾一貫、⑩オープンにする<\/div><div class=\"ln\">ポリシーラボは、住宅、医療、雇用、育児などの分野で20を超えるプロジェクトを実施<\/div><div class=\"ln\">※<ruby>武山<rt>たけやま<\/rt><\/ruby><ruby>政直<rt>まさなお<\/rt><\/ruby>(2017)「サービスデザインによる公共サービスのデザインとイノベーション」『行政＆情報システム』(2月号)、松岡<ruby>清志<rt>きよし<\/rt><\/ruby>(2018)「<ruby>英国<rt>えいこく<\/rt><\/ruby>政府GDSが牽引するデジタル改革」『行政＆情報システム』(4月号)<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>GDS は「システムを作る部署」というより、<b>利用者から出発して行政サービスを設計し直す部署<\/b>。日本のデジタル庁の「サービスデザイン12箇条」はこの10原則を<ruby>下敷<rt>したじ<\/rt><\/ruby>きにしている。デジタル化がポストNPMの<ruby>文脈<rt>ぶんみゃく<\/rt><\/ruby>（利用者視点・連携）に置かれている点がこの講義の特徴。<\/p>"]},"英国GDS":{"id":"英国GDS","h":"英国GDS","part":"事例展开","sect":"","blocks":["<p>2011年、<ruby>英国<rt>えいこく<\/rt><\/ruby>政府は内閣府に <b>GDS<\/b>（Government Digital Service）を設置した。2012年の「政府デジタル戦略」で、各機関がサービスを「<b>デジタル・バイ・デフォルト<\/b>」で提供することを打ち出し、議会への電子請願、選挙登録、失業手当、土地登記、確定申告、パスポート、自動車のナンバープレートなど26の主要サービスをデジタル化した。行政サイトは GOV.UK に一本化された。2014年には政策形成過程をオープンにするため <b>Policy Lab<\/b> が設置され、デザイナーや研究者などの小さなチームが、データと利用者の視点に基づいて政策を作ることを支援している。<\/p>","<p>キーワードは「<b>デザイン思考<\/b>」「<b>サービスデザイン<\/b>」。デジタルサービスデザイン原則は、①ニーズからスタートする ②余計なことをしない ③データに基づきデザインする ④シンプルにする ⑤試行錯誤する ⑥誰でも使えるようにする ⑦ユーザーを取り巻く状況を理解する ⑧ウェブサイトではなくデジタルサービスを提供する ⑨画一ではなく首尾一貫 ⑩オープンにする。日本のデジタル庁が掲げる「サービスデザイン12箇条」は、この原則を参考にしている。<\/p>"]},"6-13 デジタル田園都市国家構想":{"id":"6-13 デジタル田園都市国家構想","h":"6-13 デジタル田園都市国家構想","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-13 岸田政権「デジタル田園都市構想」<\/b><\/div><div class=\"ln\">地域の「暮らしや社会」、「教育や研究開発」、「産業や経済」をデジタル基盤の力により変革し、<\/div><div class=\"ln\">「大都市の利便性」と「地域の豊かさ」を融合した「デジタル田園都市」を構築。<\/div><div class=\"ln\">「心ゆたかな暮らし」(Well-being)と「持続可能な環境・社会・経済」(Sustainability)を実現。<\/div><div class=\"ln\">都市と地方、双方の魅力を最大限引き出す<\/div><div class=\"ln\">暮らしの変革：子供達の未来を支える最高の教育／ヒトを<ruby>惹<rt>ひ<\/rt><\/ruby>きつける魅力的な仕事／生涯を通じたゆとりと安心のある暮らしを実現<\/div><div class=\"ln\">知の変革：やる気のある地域大学・高専を中核に／地域の強みを生かした知見の<ruby>集積<rt>しゅうせき<\/rt><\/ruby>／地域における<ruby>官民<rt>かんみん<\/rt><\/ruby>学人材の好循環<\/div><div class=\"ln\">産業の変革：次世代オフィス環境の実現／スマート農業・医療・防災等を実装／地域の知と大都市を繋ぐ創業環境<\/div><div class=\"ln\">国・地方一体となった<ruby>包括<rt>ほうかつ<\/rt><\/ruby>的な設計<\/div><div class=\"ln\">サービス・アプローチ：Super City、MaaS、地域経済循環型、防災レジリエンス、スマートヘルスケア、スマートホーム…<\/div><div class=\"ln\">公共サービス基盤：APIゲートウェイと統合IDによるサービスの相互連携（認証、決済、共通機能、データ連携基盤）<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>2021年に岸田政権が掲げた構想（正式名は「デジタル田園都市国家構想」）。下の段の「公共サービス基盤」が重要で、個々のサービスの下に、認証・決済・データ連携を<b>国と地方で共通化<\/b>した基盤を置く設計になっている。講義口頭の「システムを国が作れば自治体も使える（共通化）」はこの話。2024年以降は石破政権の「地方創生2.0」に引き継がれた ⚠。<\/p>"]},"6-14 コロナと構造的課題":{"id":"6-14 コロナと構造的課題","h":"6-14 コロナと構造的課題","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-14 コロナが浮き<ruby>彫<rt>ぼ<\/rt><\/ruby>りにした構造的課題<\/b><\/div><div class=\"ln\">○コロナが浮き<ruby>彫<rt>ぼ<\/rt><\/ruby>りにした日本のデジタル化の遅れは、他の全ての分野（に共通）…<\/div><div class=\"ln\">○国民がデジタルを活用したより良いサービスを享受し、成長を実感できるためには、国を構成する「国民」「社会」「産業」「自治体」「政府」といった主体・分野にまたがる本質的「構造改革」が必要。<\/div><div class=\"ln\">■国民と政府／自治体と政府の関係の問題<\/div><div class=\"ln\">×政府にとり、パンデミックの広がりや感染者の行動などコロナ関連の実態の把握が課題に（マイナンバーカード、事業者関係のID・認証の普及。ワクチン接種状況の把握）。<\/div><div class=\"ln\">×政府にとり、こどもの困窮の実態など、コロナの影響の広がりの把握も課題に。<\/div><div class=\"ln\">×多くの行政事務について、バラバラに保有していたデータの連携は難しく、自治体・政府との間での連携も課題に。<\/div><div class=\"ln\">■産業のデジタル化の問題<\/div><div class=\"ln\">×経済活動がデジタル化する中で、GAFAMは着実に成長。日本の産業はデジタル化で劣後。スタートアップによる新陳代謝も遅れ。<\/div><div class=\"ln\">×様々な規制・<ruby>慣行<rt>かんこう<\/rt><\/ruby>が、現場のデジタル化を進める課題に（書面、目視点検など）。<\/div><div class=\"ln\">■デジタル人材の供給・需要側の関係の問題<\/div><div class=\"ln\">×大学等（デジタル関連の卒業生の少なさ）と産業界（専門性に沿った給与体系の不備）の中で、将来を担うデジタル人材を十分に育てることが課題に。<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>政府（デジタル庁設置前後の資料）の問題認識。講義口頭の「現金給付の問題」「自治体がバラバラ」はこのスライドの「国民と政府/自治体と政府の関係の問題」の具体例。<\/p>"]},"コロナと構造的課題":{"id":"コロナと構造的課題","h":"コロナと構造的課題","part":"重要概念展开","sect":"デジタル・ガバナンス","blocks":["<p>6-14 のスライドは、コロナ禍が日本のデジタル化の遅れを浮き<ruby>彫<rt>ぼ<\/rt><\/ruby>りにしたという政府の認識を示す。国民と政府・自治体の関係では、感染者の行動やワクチン接種状況の把握、マイナンバーカードや事業者の ID・認証の普及、自治体と政府がバラバラに保有するデータの連携が課題になった。産業では GAFAM に比べて日本企業のデジタル化が遅れ、書面・目視点検などの規制・<ruby>慣行<rt>かんこう<\/rt><\/ruby>が現場のデジタル化を<ruby>妨<rt>さまた<\/rt><\/ruby>げている。人材面では、大学のデジタル関連の卒業生が少なく、専門性に沿った給与体系も整っていない。結論は、「国民・社会・産業・自治体・政府」にまたがる<b>本質的な構造改革<\/b>が必要、というもの。<\/p>"]},"6-15 OECDデジタル政府指数":{"id":"6-15 OECDデジタル政府指数","h":"6-15 OECDデジタル政府指数","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>6-15 OECD Digital Government Index<\/b><\/div><div class=\"ln\">棒グラフ：各国のスコア（0〜1）。棒が2025年、点が2023年。青く強調された国が1本ある<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>青の国は日本と思われ、2025年は0.7弱で中位 ⚠。2023年（点）からは上がっている。<\/p>"]},"デジタル政府指数":{"id":"デジタル政府指数","h":"デジタル政府指数","part":"重要概念展开","sect":"デジタル・ガバナンス","blocks":["<p>OECD の <b>Digital Government Index<\/b>（DGI）は、各国のデジタル政府の成熟度を、デジタル・バイ・デザイン、データ駆動型の公共部門、プラットフォームとしての政府、オープン・バイ・デフォルト、ユーザー主導、プロアクティブといった観点から0〜1で評価する指標。スライドは2023年と2025年の比較で、青く強調されたバー（日本と思われる）は中位に位置していた ⚠。<\/p>"]},"日本の電子化の問題":{"id":"日本の電子化の問題","h":"日本の電子化の問題","part":"講義ノート","sect":"第6章 ポストNPMとデジタル","blocks":["<p><b>笔记<\/b>（口頭、6-13〜6-15 のあたり）<\/p>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">digital governance：なぜ日本の電子化は問題なのか？<\/div><div class=\"ln\" style=\"--in:0\">①なぜか　②現在のシステム　③組織の問題　④権限の問題　⑤省庁<\/div><div class=\"ln\" style=\"--in:0\"><ruby>韓国<rt>かんこく<\/rt><\/ruby>：デジタル担当の中央機関が命令できる。博士を配置し、分野ごとの専門家がいる。【<ruby>韓国<rt>かんこく<\/rt><\/ruby>の例が繰り返し言及された】<\/div><div class=\"ln\" style=\"--in:0\">各自治体：人口の問題。IT を使いこなせる人がいない。<\/div><div class=\"ln\" style=\"--in:0\">システムを国が作れば、自治体も使えるはず → 共通化<\/div><div class=\"ln\" style=\"--in:0\">日本語：漢字の読み方。以前はシステムがバラバラだったが、今は何とかなった。<\/div><div class=\"ln\" style=\"--in:0\">強制できない<\/div><div class=\"ln\" style=\"--in:0\">現金給付の問題：日本は口座、<ruby>韓国<rt>かんこく<\/rt><\/ruby>はポイント的なもの<\/div><div class=\"ln\" style=\"--in:0\">住民票、確定申告、地方税<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>遅れの原因を技術より<b>組織と権限<\/b>に見ている。約1,700の自治体が別々にシステムを調達してきたうえ、地方自治の原則から国は自治体に<b>強制できない<\/b>。これに対応するのが2021年の地方公共団体情報システム標準化法で、20業務の標準仕様への<ruby>準拠<rt>じゅんきょ<\/rt><\/ruby>を義務づけ、ガバメントクラウドへの移行を進めている ⚠。氏名の<ruby>異体<rt>いたい<\/rt><\/ruby>字・<ruby>外字<rt>がいじ<\/rt><\/ruby>もデータ連携の障害で、標準化で統一が進んでいる。給付金の対比は、2020年に日本の特別定額給付金が住基との手作業照合と口座確認で混乱したのに対し、<ruby>韓国<rt>かんこく<\/rt><\/ruby>はカード会社経由でポイントとして短期間で支給した、という話。<\/p>","<p><b>配布資料との対応<\/b>：講義の最後に配られた廉宗淳・田中秀明「デジタル庁創設の課題（下）」（日経「経済教室」2020年）が、この口頭部分の元ネタ → <span class=\"wl\">廉宗淳・田中秀明「デジタル庁創設の課題（下） 問題解決の実行計画を」<\/span><\/p>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">笔记の「①〜⑤」は、記事の3つの理由（<code>第1<\/code> 評価・原因分析がなく計画ばかり、<code>第2<\/code> 業務を見直さずにそのままシステム化する＝無謬性の行政文化、<code>第3<\/code> 政府CIOは総合調整だけで縦割りを打破できない）に対応する。<\/div><div class=\"ln\" style=\"--in:0\">「<ruby>韓国<rt>かんこく<\/rt><\/ruby>は命令できる」は、情報化振興院（院長は次官級）が予算査定と監査を行い、省庁のプロジェクト中止を命令できること。国と地方については、行政安全省が地方行政も所管するので一体的に電子化でき、自治体のシステムは地域情報開発院がクラウドで共同利用させている。<\/div><div class=\"ln\" style=\"--in:0\">「博士を配置」は、関連組織に法律・医療など各分野の博士が多数おり、情報化振興院の職員の大半が博士であること。幹部ポストの2割は官民公募、3割は政府内公募。<\/div><div class=\"ln\" style=\"--in:0\">記事にない点（給付金の口座とポイント、漢字・外字の問題）は講義での補足。<\/div><\/div>"]},"日本の電子化の課題":{"id":"日本の電子化の課題","h":"日本の電子化の課題","part":"重要概念展开","sect":"デジタル・ガバナンス","blocks":["<p>講義で挙がった論点を整理すると、日本の行政デジタル化が遅れる原因は、技術よりも<b>組織と権限<\/b>にある。<\/p>","<p>国と自治体の関係では、自治体は約1,700あり、それぞれが独自に情報システムを調達してきたため、同じ業務でもシステムがバラバラだった。小規模な自治体には IT を使いこなせる人材がいない。国がシステムを作って共通化すれば効率的だが、地方自治の原則から国は自治体に<b>強制できない<\/b>。これに対応するのが2021年の「<b>地方公共団体情報システムの標準化に関する法律<\/b>」で、住民記録、地方税、福祉など20業務について国の標準仕様への<ruby>準拠<rt>じゅんきょ<\/rt><\/ruby>を自治体に義務づけ、ガバメントクラウドへの移行を進めている（期限は原則2025年度末だが、移行が難しいシステムは延長）⚠。<\/p>","<p>日本語特有の問題として、氏名などに使われる<b><ruby>異体<rt>いたい<\/rt><\/ruby>字・<ruby>外字<rt>がいじ<\/rt><\/ruby><\/b>がある。自治体ごとに独自の<ruby>外字<rt>がいじ<\/rt><\/ruby>を作ってきたため、システム間でデータを連携できなかった。標準化では「行政事務標準文字」に統一する作業が進められている。<\/p>","<p>国の組織としては、2021年に<b>デジタル庁<\/b>が発足し、各省庁のシステム予算を一括計上し、他省庁への勧告権をもつ。講義では<ruby>韓国<rt>かんこく<\/rt><\/ruby>との対比で、<ruby>韓国<rt>かんこく<\/rt><\/ruby>の担当機関は自治体などに<b>命令できる<\/b>権限と、博士号をもつ分野ごとの専門家をそろえている点が強調された。<\/p>","<p>配布資料（廉・田中 2020）は、原因を3つに整理している。第1に、戦略や施策の評価と原因分析がなく計画ばかりであること（KPI は2020年時点で223もあるが、研修回数などプロセス指標が中心）。第2に、業務や法手続きを見直さずに現行業務をそのままシステム化し、失敗から改善する発想が「無謬性」を重んじる行政文化と合わないこと（法令上の手続き約5万6千のうち電子化は種類ベースで12%）。第3に、政府CIO の権限が総合調整にとどまり、CIO室も2年で入れ替わる出向者中心で専門性が育たないこと。処方箋は、専門家の公募・登用と人事・文化の改革、優先順位の明確な計画、システム統合と全国共通の自治体クラウド、紙の申請の段階的廃止。<br>→ <span class=\"wl\">廉宗淳・田中秀明「デジタル庁創設の課題（下） 問題解決の実行計画を」<\/span><\/p>"]},"韓国の電子政府":{"id":"韓国の電子政府","h":"韓国の電子政府","part":"事例展开","sect":"","blocks":["<p><ruby>韓国<rt>かんこく<\/rt><\/ruby>は国連の電子政府ランキングで長く上位を占めてきた。1990年代後半のアジア通貨危機以降、国家戦略として電子政府を進め、行政安全部と<ruby>韓国<rt>かんこく<\/rt><\/ruby>知能情報社会振興院（NIA）が中央から標準システムを整備して、自治体にも共通システムを使わせてきた。住民登録番号を軸にしたデータ連携で、各種証明書の発行や行政手続きがオンラインで完結する。講義で強調されたのは、中央の担当機関が<b>命令できる<\/b>権限と、<b>博士級の分野別専門家<\/b>をそろえている点である。<\/p>","<p>コロナ禍の2020年には、全世帯への<b>緊急災難支援金<\/b>を、クレジットカード会社などを通じたオンライン申請で、カードのポイントとして短期間で支給した。これに対して日本の<b>特別定額給付金<\/b>（1人10万円）は、マイナンバーカードを使ったオンライン申請が、住民基本台帳との照合を自治体職員が手作業で行う必要があり、かえって混乱した。口座情報の確認にも手間がかかり、オンライン申請を停止する自治体も相次いだ。このことが、マイナンバーと<ruby>公金<rt>こうきん<\/rt><\/ruby>受取口座の紐付けや、デジタル庁発足の直接のきっかけの一つになった。<\/p>","<p>配布資料によると、<ruby>韓国<rt>かんこく<\/rt><\/ruby>の電子政府は1997年の経済危機を機に大統領主導の国家大改革として始まり、情報通信相にサムスングループ社長を起用するなど人事が推進力になった。仕組みは、司令塔（行政安全省・科学技術情報通信省）、実施機関（情報化振興院がプロジェクト中止まで命令できる。国家情報資源管理院が約1,500の省庁システムを統合管理し、地域情報開発院が自治体システムをクラウドで共同利用させ、行政情報共同利用センターが約700以上のシステムをつなぐ）、専門人材（各分野の博士、幹部ポストの公募）の三本立て。成果として、約30種類の手続きのワンストップ化、証明書発行の激減（2005年の年4.5億枚以上から2015年の1.5億枚）、窓口来訪者の減少、プッシュ型社会保障が挙げられている。<br>→ <span class=\"wl\">廉宗淳・田中秀明「デジタル庁創設の課題（下） 問題解決の実行計画を」<\/span><\/p>"]},"7-1 まとめ":{"id":"7-1 まとめ","h":"7-1 まとめ","part":"講義ノート","sect":"第7章 まとめ","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>7-1 まとめ<\/b>（p.59）<\/div><div class=\"ln\">・伝統的な行政（OPA）の問題<\/div><div class=\"ln\">・NPMは流行した・しているが、誤解が多く、正しい理解が必要<\/div><div class=\"ln\">・ガバナンス論の興隆、現実とのギャップ（政府経営モデルの多様化・複雑化）<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>講義の3段構成（OPA → NPM → ガバナンス）そのもの。<\/p>"]}}},{"id":"0930-kimura","date":"9/30","title":"Citizen's Participation（木村）","outline":[{"t":"g","label":"導入","depth":0},{"t":"r","main":"地域間格差と人口減少","sides":[]},{"t":"g","label":"重要テーマ A〜D","depth":0},{"t":"r","main":"A 二元代表制","sides":["二元代表制（dual representative system）"]},{"t":"r","main":"B 統治構造の変化","sides":["ミニ・パブリックス（mini-publics）","気候市民会議","オンブズマン制度（ombudsman system）","川崎市市民オンブズマン"]},{"t":"r","main":"C 直接請求と住民投票","sides":["直接請求（direct citizen initiatives）","大阪都構想の住民投票","住民投票（local referendum）","諮問型住民投票"]},{"t":"r","main":"D 行政のイノベーション","sides":["行政DXとAI（DX and AI in public administration）"]},{"t":"g","label":"政策過程と主体間の緊張","depth":0},{"t":"r","main":"政策過程","sides":["政策過程（policy process）"]},{"t":"r","main":"集権と分権","sides":["集権と分権（centralization / decentralization）","地方分権一括法","ナショナル・ミニマム（national minimum）","学級規模の基準"]},{"t":"r","main":"専門性と応答性","sides":["専門性と民主性（expertise / responsiveness）","原発の立地・再稼働と地元同意"]},{"t":"r","main":"ガバナンス","sides":["ガバナンス（governance）"]},{"t":"g","label":"市民参加と代議制民主主義の危機","depth":0},{"t":"r","main":"代議制の停滞","sides":["停滞と空洞化（stagnation / hollowing out）","地方選挙の投票率と無投票"]}],"cards":{"地域間格差と人口減少":{"id":"地域間格差と人口減少","h":"地域間格差と人口減少","part":"講義ノート","sect":"導入","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">地域開発の地域間格差（regional disparity of local development）<\/div><div class=\"ln\" style=\"--in:0\">日本ではスマートシティ（smart city）の取り組み<\/div><div class=\"ln\" style=\"--in:0\">人口減少（depopulation）は多くの国に共通する課題<\/div><div class=\"ln\" style=\"--in:0\">政治的な課題、グローバルな課題：これからの民主主義をどう考えるか<\/div><div class=\"ln\" style=\"--in:0\">市民参加と民主主義（citizen participation and democracy）<\/div><div class=\"ln\" style=\"--in:0\">地方自治体は、行政サービスの充実（enrichment）と柔軟性（flexibility）にどう応えるかを問われている<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>授業全体の問題設定。人口減少と地域間格差は日本だけでなく多くの国の課題で、地方自治体は限られた資源で住民サービスを維持・充実させなければならない。その手段としてスマートシティのような技術的な解決がある一方、「そもそも誰がどうやって地域のことを決めるのか」という民主主義の問題がある。この授業は後者、つまり<b>市民参加<\/b>を軸に地方のガバナンスを考える。<\/p>"]},"A 二元代表制":{"id":"A 二元代表制","h":"A 二元代表制","part":"講義ノート","sect":"重要テーマ A〜D","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">二元代表制（dual representative system）：アメリカに由来<\/div><div class=\"ln\" style=\"--in:0\">最近は、ソーシャルメディアが統治構造に与える影響（impact of social media on government structure）<\/div><div class=\"ln\" style=\"--in:0\">抑制と均衡（checks and balances）：権力をいくつかの部門に分けて抑える<\/div><div class=\"ln\" style=\"--in:0\">三権（three branches）<\/div><div class=\"ln\" style=\"--in:0\">首長（chief executive）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>日本の地方自治は、首長（知事・市町村長）と議会の議員をどちらも住民が直接選挙で選ぶ<b>二元代表制<\/b>をとる（憲法93条）。国の議院内閣制とは違い、アメリカの大統領制に近い仕組みで、首長と議会が互いに抑制し合う。講師が「最近のソーシャルメディアの影響」に触れたのは、SNS で直接有権者に訴える首長が議会と激しく対立する例が増えているため（<ruby>兵庫<rt>ひょうご<\/rt><\/ruby>県知事の不信任と出直し選挙など）。<\/p>"]},"二元代表制（dual representative system）":{"id":"二元代表制（dual representative system）","h":"二元代表制（dual representative system）","part":"重要概念展开","sect":"地方自治の仕組み","blocks":["<p>地方自治体では、首長と議会の議員を住民がそれぞれ直接選挙で選ぶ（憲法93条2項）。国の議院内閣制では国会が首相を選ぶので内閣と与党が一体になりやすいが、二元代表制では首長と議会がそれぞれ独自の民主的正統性をもち、互いに<b>抑制と均衡<\/b>（checks and balances）の関係に立つ。<\/p>","<p>地方自治法はそのための道具を両者に与えている。議会は首長に対して<b>不信任議決<\/b>（議員の3分の2以上が出席し、4分の3以上の同意）ができ、首長は不信任を受けたら10日以内に議会を<b>解散<\/b>できる。首長は議会の議決に異議があれば<b>再議<\/b>（拒否権に近い）を求めることができ、緊急時などには議会の議決を経ずに<b>専決処分<\/b>ができる。<\/p>","<p>課題として指摘されるのは、首長の権限が強い一方で議会が形骸化しやすいこと（首長提出議案がほぼ原案どおり可決される）、そして首長と議会が激しく対立すると行政が停滞すること。<\/p>"]},"B 統治構造の変化":{"id":"B 統治構造の変化","h":"B 統治構造の変化","part":"講義ノート","sect":"重要テーマ A〜D","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">統治構造の変化（changes in government structure）<\/div><div class=\"ln\" style=\"--in:0\"><b>ミニ・パブリックス（mini-publics）<\/b><\/div><div class=\"ln\" style=\"--in:0\">とくに最近は気候（climate）の分野で。政策にどう反映させるか？<\/div><div class=\"ln\" style=\"--in:0\">自治体が条例（ordinances）で課す規制措置（regulatory measures）<\/div><div class=\"ln\" style=\"--in:0\">オンブズマン制度（ombudsman system）による市民の行政監視（citizens' oversight of administration）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>選挙で代表を選ぶ以外の参加の回路が広がっている、という話。<b>ミニ・パブリックス<\/b>は、無作為抽出で選ばれた市民が専門家の情報提供を受けて熟議し、提言をまとめる仕組みで、近年は気候変動をテーマにした<b>気候市民会議<\/b>が各国・各地で開かれている。条例による規制は月曜の授業の中心テーマで、<b>オンブズマン<\/b>は、行政から独立した第三者が市民の苦情を受けて行政を調査・是正勧告する制度。<\/p>"]},"ミニ・パブリックス（mini-publics）":{"id":"ミニ・パブリックス（mini-publics）","h":"ミニ・パブリックス（mini-publics）","part":"重要概念展开","sect":"地方自治の仕組み","blocks":["<p>無作為抽出（くじ引き）で選ばれた少人数の市民が、専門家から情報提供を受け、十分な時間をかけて熟議し、意見や提言をまとめる仕組みの総称。社会の縮図（ミニ・パブリック）を作ることで、選挙で選ばれた代表や声の大きい利益団体とは違う、「普通の市民が熟慮した意見」を政策に反映させようとする。<\/p>","<p>代表的な手法に、ドイツの<b>計画細胞<\/b>（プラーヌンクスツェレ）、デンマークの<b>コンセンサス会議<\/b>、フィシュキンの<b>討論型世論調査<\/b>（deliberative poll）、<b>市民陪審<\/b>などがある。日本では、計画細胞を参考にした「市民討議会」が2000年代から各地で開かれている。近年は気候変動をテーマにした<b>気候市民会議<\/b>が世界的に広がっている（事例参照）。<\/p>","<p>課題は、提言をどこまで実際の政策に反映させるかという<b>拘束力<\/b>の問題と、参加者が少人数なので代表性をどう担保するかという問題。<\/p>"]},"気候市民会議":{"id":"気候市民会議","h":"気候市民会議","part":"事例展开","sect":"","blocks":["<p>フランスでは2019〜2020年に、無作為抽出の市民150人による「気候市民会議」が開かれ、149の提言をまとめ、その一部は「気候・レジリエンス法」（2021年）に反映された。イギリスでも2020年に議会の委託で「Climate Assembly UK」が開かれた。日本では2020年の「気候市民会議さっぽろ2020」が最初で、その後、<ruby>東京<rt>とうきょう<\/rt><\/ruby>都<ruby>武蔵野<rt>むさしの<\/rt><\/ruby>市、<ruby>埼玉<rt>さいたま<\/rt><\/ruby>県所沢市、<ruby>東京<rt>とうきょう<\/rt><\/ruby>都<ruby>江戸川<rt>えどがわ<\/rt><\/ruby>区などで自治体主催の気候市民会議が開かれている。<\/p>"]},"オンブズマン制度（ombudsman system）":{"id":"オンブズマン制度（ombudsman system）","h":"オンブズマン制度（ombudsman system）","part":"重要概念展开","sect":"地方自治の仕組み","blocks":["<p>行政から独立した第三者機関（オンブズマン）が、市民からの苦情を受けて行政の対応を調査し、必要なら是正を勧告する制度。1809年のスウェーデンの議会オンブズマンが起源。日本では国レベルの制度はなく、自治体が条例で設置している（事例参照）。裁判よりも手軽に、行政の不当な扱い（違法とまではいえないものを含む）を正すことができる。なお、住民団体が自ら名乗る「市民オンブズマン」（情報公開請求や住民訴訟で行政を監視する市民団体）とは別物。<\/p>"]},"川崎市市民オンブズマン":{"id":"川崎市市民オンブズマン","h":"川崎市市民オンブズマン","part":"事例展开","sect":"","blocks":["<p>1990年に<ruby>川崎<rt>かわさき<\/rt><\/ruby>市が条例で設置した、日本初の自治体オンブズマン。市の業務について市民からの苦情を受け付け、中立的な立場から調査し、必要に応じて是正を勧告する。その後、<ruby>東京<rt>とうきょう<\/rt><\/ruby>都<ruby>中野<rt>なかの<\/rt><\/ruby>区、<ruby>札幌<rt>さっぽろ<\/rt><\/ruby>市、<ruby>沖縄<rt>おきなわ<\/rt><\/ruby>県などに広がった。<\/p>"]},"C 直接請求と住民投票":{"id":"C 直接請求と住民投票","h":"C 直接請求と住民投票","part":"講義ノート","sect":"重要テーマ A〜D","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">直接請求（direct citizen initiatives）：アメリカに由来、1950年代 (?)<\/div><div class=\"ln\" style=\"--in:0\">条例の制定請求（requests for ordinances）：有権者の2%（50分の1）の署名で、新しい条例の制定を請求できる<\/div><div class=\"ln\" style=\"--in:0\">首長・議会の解職・解散（dismissal of local government heads and assemblies）：市民の直接参加<\/div><div class=\"ln\" style=\"--in:0\">ここ数年の考え方：政治が不安定になる、劇的（dramatic）になる → 解職制度の適切なあり方をどう考えるか<\/div><div class=\"ln\" style=\"--in:0\">住民投票（local referendums）<\/div><div class=\"ln\" style=\"--in:1\">スイス・ドイツ：単一の争点についての直接民主制として非常に有用に機能<\/div><div class=\"ln\" style=\"--in:1\">日本：それほど積極的ではない。知事・市長次第<\/div><div class=\"ln\" style=\"--in:1\">2%の署名で住民投票（条例の制定）を請求できる<\/div><div class=\"ln\" style=\"--in:1\">いったん実施が決まると、一つの自治体の話でも全国が注目する。これが直接参加<\/div><div class=\"ln\" style=\"--in:0\"><ruby>大阪<rt>おおさか<\/rt><\/ruby>の住民投票（<ruby>大阪<rt>おおさか<\/rt><\/ruby>都構想）：2回実施<\/div><div class=\"ln\" style=\"--in:1\">2回とも過半数が賛成しなかった<\/div><div class=\"ln\" style=\"--in:1\">今：3回目もあるかもしれない<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p><b>直接請求<\/b>は、戦後の地方自治法（1947年）で、アメリカの制度を参考に導入された（講義の「1950年代」は聞き取り不確か）。条例の制定・改廃請求は有権者の50分の1の署名で首長に請求でき、首長は議会にかけるが、可決するかどうかは議会が決める。首長・議員の解職（リコール）と議会の解散は、原則有権者の3分の1の署名で住民投票にかけられる。<\/p>","<p><b>住民投票<\/b>は、日本では個別の住民投票条例に基づくものが多く、結果に法的拘束力はない（諮問型）。住民が2%の署名で住民投票条例の制定を請求しても、議会が否決することが多い。例外が<ruby>大阪<rt>おおさか<\/rt><\/ruby>都構想の住民投票で、大都市地域特別区設置法に基づき、結果が法的拘束力をもった。<\/p>"]},"直接請求（direct citizen initiatives）":{"id":"直接請求（direct citizen initiatives）","h":"直接請求（direct citizen initiatives）","part":"重要概念展开","sect":"地方自治の仕組み","blocks":["<p>住民が一定数の署名を集めて、自治体に直接行動を求める制度（地方自治法74条以下）。<\/p>","<div class=\"tbl\"><table><tr><th>種類<\/th><th>必要署名数<\/th><th>請求先<\/th><th>その後<\/th><\/tr><tr><td>条例の制定・改廃<\/td><td>有権者の50分の1<\/td><td>首長<\/td><td>議会が審議・議決<\/td><\/tr><tr><td>事務の監査<\/td><td>有権者の50分の1<\/td><td>監査委員<\/td><td>監査の実施・公表<\/td><\/tr><tr><td>議会の解散<\/td><td>有権者の3分の1 (※)<\/td><td>選挙管理委員会<\/td><td>住民投票で過半数なら解散<\/td><\/tr><tr><td>議員・首長の解職<\/td><td>有権者の3分の1 (※)<\/td><td>選挙管理委員会<\/td><td>住民投票で過半数なら失職<\/td><\/tr><\/table><\/div>","<p>(※) 有権者が40万人を超える部分は6分の1、80万人を超える部分は8分の1で計算する。<\/p>","<p>条例制定請求は署名のハードルは低いが、最終的に決めるのは議会なので、住民投票条例の制定請求なども否決されることが多い。解職・解散は住民投票で決まるので効果は強いが、講義で指摘されたように、政治を不安定にし、劇的な対立を生みやすいという問題もある。<\/p>"]},"大阪都構想の住民投票":{"id":"大阪都構想の住民投票","h":"大阪都構想の住民投票","part":"事例展开","sect":"","blocks":["<p><ruby>大阪<rt>おおさか<\/rt><\/ruby>市を廃止して特別区に再編する「<ruby>大阪<rt>おおさか<\/rt><\/ruby>都構想」について、大都市地域特別区設置法に基づき、2015年5月と2020年11月の2回、<ruby>大阪<rt>おおさか<\/rt><\/ruby>市民による住民投票が行われた。1回目は反対50.38%・賛成49.62%、2回目は反対50.63%・賛成49.37%で、いずれも約1万〜1万7千票差で否決された。講義の「49.6% 対 50.4%」は1回目の数字。2回目は投票率も60%を超え、全国的な注目を集めた。推進してきた<ruby>大阪<rt>おおさか<\/rt><\/ruby>維新の会は、その後も3回目の住民投票を目指す姿勢を示している ⚠。法的拘束力をもつ住民投票で、一つの自治体の制度のあり方が直接民主制で決まった、日本では珍しい例。<\/p>"]},"住民投票（local referendum）":{"id":"住民投票（local referendum）","h":"住民投票（local referendum）","part":"重要概念展开","sect":"地方自治の仕組み","blocks":["<p>日本の住民投票には、法律に基づくものと、条例に基づくものがある。法律に基づくものは、解職・解散の住民投票、特定の自治体だけに適用される特別法の住民投票（憲法95条）、大都市地域特別区設置法に基づく住民投票（<ruby>大阪<rt>おおさか<\/rt><\/ruby>都構想）、市町村合併特例法に基づくものなどで、結果に法的拘束力がある。一方、原発・基地・合併などの争点について自治体が個別に住民投票条例を作って行うものは、結果に法的拘束力がない<b>諮問型<\/b>で、首長や議会は結果を「尊重」するにとどまる。<\/p>","<p>講義でスイス・ドイツと比べられたのは、スイスでは国・州・市町村のすべてのレベルで住民投票（レファレンダム）とイニシアティブが日常的に行われ、ドイツでも多くの州で市町村レベルの住民請求・住民投票が制度化されているため。日本は常設型の住民投票条例をもつ自治体もあるが、多くは首長や議会の判断次第で、講義の言う「それほど積極的ではない」状態にある。<\/p>"]},"諮問型住民投票":{"id":"諮問型住民投票","h":"諮問型住民投票","part":"事例展开","sect":"","blocks":["<p>日本で最初の条例に基づく住民投票は、1996年の<ruby>新潟<rt>にいがた<\/rt><\/ruby>県<ruby>巻<rt>まき<\/rt><\/ruby>町の原発建設をめぐるもので、反対が多数となり、町は建設予定地を売却せず計画は撤回された。同じ1996年には<ruby>沖縄<rt>おきなわ<\/rt><\/ruby>県で米軍基地の整理縮小をめぐる県民投票、2019年には<ruby>辺野古<rt>へのこ<\/rt><\/ruby>埋め立ての賛否を問う県民投票が行われ、反対が約72%だったが、埋め立ては続けられた。法的拘束力のない住民投票の限界を示す例として、しばしば挙げられる。<\/p>"]},"D 行政のイノベーション":{"id":"D 行政のイノベーション","h":"D 行政のイノベーション","part":"講義ノート","sect":"重要テーマ A〜D","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">行政のイノベーション（innovation in administration）<\/div><div class=\"ln\" style=\"--in:0\">民間部門の経営手法の活用（use of private sector management techniques）<\/div><div class=\"ln\" style=\"--in:0\">公共行政へのデジタル・トランスフォーメーション（DX）と AI の応用<\/div><div class=\"ln\" style=\"--in:0\">とくに地方で。サービスをどう充実させるか<\/div><div class=\"ln\" style=\"--in:0\">オンライン申請（online application）、意見の収集（collecting opinions）<\/div><div class=\"ln\" style=\"--in:0\">AI をどう使えるか、どう使うべきか<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>民間の経営手法の導入は火曜の「ガバナンス研究」で扱った NPM のこと。この授業では、DX・AI が市民参加にどう関わるかという観点で扱う。オンライン申請はサービスの効率化、意見の収集（パブリックコメントや電子アンケート、オンラインの参加プラットフォーム）は参加の拡大にあたる。AI については「使えるか」と「使うべきか」を分けて考えている点がポイントで、効率化の可能性と、説明責任や公平性の問題の両方を見る必要がある。<\/p>"]},"行政DXとAI（DX and AI in public administration）":{"id":"行政DXとAI（DX and AI in public administration）","h":"行政DXとAI（DX and AI in public administration）","part":"重要概念展开","sect":"行政のイノベーション","blocks":["<p>行政のデジタル化は、①手続きのオンライン化などサービスの効率化、②データに基づく政策立案（EBPM）、③市民参加の拡大（e-participation）の三つの面をもつ。③には、パブリックコメントのオンライン化、参加型予算、オンラインの参加プラットフォーム（バルセロナ発の Decidim を導入する自治体が日本でも増えている）などがある。<\/p>","<p>AI については、チャットボットによる問い合わせ対応、議事録作成、文書作成支援などで自治体の導入が進んでいる。一方で、誤った回答（ハルシネーション）、判断の根拠が説明できないこと（説明責任）、学習データの偏りによる不公平などの問題があり、「使えるか」と同時に「どこまで使うべきか」の検討が必要になる。<\/p>"]},"政策過程":{"id":"政策過程","h":"政策過程","part":"講義ノート","sect":"政策過程と主体間の緊張","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政策過程（policy making process）<\/div><div class=\"ln\" style=\"--in:0\">課題設定（setting agenda）→ 政策立案（making policy）→ 政策決定（making decision）→ 政策実施（doing policy）→ 政策評価（evaluating policy）<\/div><div class=\"ln\" style=\"--in:0\">すべての過程に（市民が関わる）(?)<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>政策過程を5段階に分ける、行政学・政策学の基本モデル（政策サイクル）。市民参加は選挙や決定の段階だけでなく、課題設定（住民の要望）、立案（審議会・ワークショップ）、実施（協働）、評価（市民による評価）のすべての段階でありうる、という趣旨と思われる。<\/p>"]},"政策過程（policy process）":{"id":"政策過程（policy process）","h":"政策過程（policy process）","part":"重要概念展开","sect":"政策と主体","blocks":["<p>政策が作られ、実施され、見直されるまでを段階に分けて捉えるモデル。①<b>課題設定<\/b>（agenda setting）：数ある社会問題の中から、政府が取り組むべき課題が選ばれる ②<b>政策立案<\/b>（policy formulation）：解決策の選択肢が検討される ③<b>政策決定<\/b>（decision making）：議会や首長が案を決める ④<b>政策実施<\/b>（implementation）：行政が執行する ⑤<b>政策評価<\/b>（evaluation）：効果を測り、次の課題設定につなげる。実際の政策はこの順番どおりに進むとは限らないが、どの段階で誰が関わっているかを整理する道具として有用。市民参加も、段階ごとに手法が違う（課題設定なら請願・陳情、立案ならパブリックコメント・審議会、実施なら協働、評価なら市民評価）。<\/p>"]},"集権と分権":{"id":"集権と分権","h":"集権と分権","part":"講義ノート","sect":"政策過程と主体間の緊張","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">主体間の緊張関係（tensions between actors）<\/div><div class=\"ln\" style=\"--in:0\">集権（centralization）⇄ 分権（decentralization）<\/div><div class=\"ln\" style=\"--in:0\">1999年の地方分権一括法（decentralization act）<\/div><div class=\"ln\" style=\"--in:1\">すべての省庁が反対した<\/div><div class=\"ln\" style=\"--in:1\">ナショナル・ミニマム（national minimum）との対立<\/div><div class=\"ln\" style=\"--in:1\">例：小学校の最低限の基準、学級規模（classroom sizes）など<\/div><div class=\"ln\" style=\"--in:1\">どちらがより重要か<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>分権を進めれば地域の実情に合った政策ができるが、地域ごとの差も広がる。全国どこでも一定水準のサービスを保障する<b>ナショナル・ミニマム<\/b>と、地域の自己決定との間には常に緊張がある。1999年の地方分権一括法は、自治体を国の下部機関のように扱っていた機関委任事務を廃止した大改革で、権限を失う各省庁は強く抵抗した。学級規模は、国が標準を決め、自治体がそれ以上の少人数学級を独自に行えるかどうかが争点になってきた分野の典型。<\/p>"]},"集権と分権（centralization / decentralization）":{"id":"集権と分権（centralization / decentralization）","h":"集権と分権（centralization / decentralization）","part":"重要概念展开","sect":"政策と主体","blocks":["<p>地方分権のメリットは、住民に近い自治体が地域の実情に合わせて決められること、住民が参加しやすいこと、自治体間の政策競争が生まれること。デメリットは、財政力や人材に差がある自治体間でサービス水準の格差が広がること。<\/p>","<p>1999年の<b>地方分権一括法<\/b>（2000年施行）は、475本の法律を一括改正した改革で、自治体を国の下部機関として国の事務を処理させていた<b>機関委任事務<\/b>を廃止し、自治体の事務を自治事務と法定受託事務に再編した。国と自治体の関係を「上下・主従」から「対等・協力」に変えたとされる。権限を失う各省庁は強く抵抗した。<\/p>"]},"地方分権一括法":{"id":"地方分権一括法","h":"地方分権一括法","part":"事例展开","sect":"","blocks":["<p>1990年代の地方分権推進委員会の勧告を受けて1999年に成立し、2000年4月に施行された。地方自治法を中心に475本の法律を一括改正し、機関委任事務の廃止、国の関与のルール化、国地方係争処理委員会の設置などを行った。各省庁は、自らの権限と、それに基づく自治体への指揮監督の手段を失うことになるため、激しく抵抗した。<\/p>"]},"ナショナル・ミニマム（national minimum）":{"id":"ナショナル・ミニマム（national minimum）","h":"ナショナル・ミニマム（national minimum）","part":"重要概念展开","sect":"政策と主体","blocks":["<p>国が全国どこでも保障すべき最低限の生活・サービスの水準。もともとはイギリスのウェッブ夫妻が唱えた考え方で、福祉国家の基本原理の一つ。教育（学級規模、教員の配置基準）、福祉（生活保護の基準）、医療などで、国が法律や補助金で基準を定める。分権を進めるとこの基準が緩み、地域差が生まれるので、「どこまでを国が保障し、どこからを自治体に任せるか」が常に争点になる。<\/p>"]},"学級規模の基準":{"id":"学級規模の基準","h":"学級規模の基準","part":"事例展开","sect":"","blocks":["<p>公立小中学校の学級規模は、国の法律（義務標準法）が標準を定め、それに基づいて国が教職員の給与費を負担する。長く40人学級が標準だったが、2011年に小学1年生が35人学級になり、2021年の法改正で、小学校全学年を2025年度までに段階的に35人学級にすることになった。自治体が独自に少人数学級を実施する例もあり、ナショナル・ミニマムと自治体の裁量の関係を示す典型的な分野。<\/p>"]},"専門性と応答性":{"id":"専門性と応答性","h":"専門性と応答性","part":"講義ノート","sect":"政策過程と主体間の緊張","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">専門性（expertise）⇄ 非専門性（ステークホルダーへの応答 response to stakeholders）<\/div><div class=\"ln\" style=\"--in:0\">例：原子力発電所のリスク<\/div><div class=\"ln\" style=\"--in:1\"><ruby>福島<rt>ふくしま<\/rt><\/ruby>第一原発事故<\/div><div class=\"ln\" style=\"--in:1\">県が同意してから立地する<\/div><div class=\"ln\" style=\"--in:1\">どう決めるか？ 市民の声を聞く<\/div><div class=\"ln\" style=\"--in:1\">政府は市民の声を聞く必要があるが、市民は専門知識を持っていない<\/div><div class=\"ln\" style=\"--in:0\">専門性と非専門性のバランスをとる<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>原発のようにリスクの判断に高度な専門知識が必要な問題を、誰がどう決めるかという問題。専門家だけで決めれば住民の不安や価値観が反映されず、住民の多数決だけで決めれば科学的な判断が軽視されかねない。日本では、原発の設置や再稼働に法的な自治体同意の規定はないが、実際には立地自治体（県・市町村）の同意が事実上の条件になっている。ここでミニ・パブリックス（B）のような、専門家の情報を踏まえて市民が熟議する仕組みが意味をもつ。<\/p>"]},"専門性と民主性（expertise / responsiveness）":{"id":"専門性と民主性（expertise / responsiveness）","h":"専門性と民主性（expertise / responsiveness）","part":"重要概念展开","sect":"政策と主体","blocks":["<p>政策決定には、科学的・技術的に正しい判断（専門性）と、市民の価値観や利害への応答（民主性・応答性）の両方が必要だが、二つはしばしば衝突する。専門家が決めれば「テクノクラシー」として住民の不信を招き、住民の意見だけで決めればリスクの判断を誤るおそれがある。原子力、感染症対策、大規模開発などで典型的に問題になる。対応策として、専門家の情報を市民が理解したうえで判断できるようにする<b>熟議<\/b>の仕組み（ミニ・パブリックス）や、リスク・コミュニケーションが重視される。<\/p>"]},"原発の立地・再稼働と地元同意":{"id":"原発の立地・再稼働と地元同意","h":"原発の立地・再稼働と地元同意","part":"事例展开","sect":"","blocks":["<p>原発の設置や再稼働について、法律上は立地自治体の同意は要件になっていないが、電力会社と立地県・市町村が結ぶ安全協定などにより、知事と立地市町村長の同意が事実上の条件になっている。2011年の<ruby>福島<rt>ふくしま<\/rt><\/ruby>第一原発事故以降、再稼働の判断をめぐって、専門的な安全審査（原子力規制委員会）と、住民の不安や意見をどう両立させるかが各地で争点になった。避難計画の策定が必要な周辺自治体の意見をどこまで反映させるかも問題になっている。<\/p>"]},"ガバナンス":{"id":"ガバナンス","h":"ガバナンス","part":"講義ノート","sect":"政策過程と主体間の緊張","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">ガバナンスの概念：多様な主体（diversified actors）が相互作用（cross interactions）を通じて自律的に（self-disciplined way）動いていくこと<\/div><div class=\"ln\" style=\"--in:0\">協働によるガバナンス（governance through cooperation）<\/div><div class=\"ln\" style=\"--in:0\">民間：NPM や PPP<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>火曜の「ガバナンス研究」のネットワーク型ガバナンスと同じ概念。政府が上から統治する（ガバメント）だけでなく、企業・NPO・住民などが相互に関わり合いながら、自律的に公共の問題を解決していく状態を指す。民間の関わり方として、NPM（民間の経営手法の導入）と PPP（官民連携）が挙げられた。<\/p>"]},"ガバナンス（governance）":{"id":"ガバナンス（governance）","h":"ガバナンス（governance）","part":"重要概念展开","sect":"政策と主体","blocks":["<p>政府だけでなく、企業、NPO、住民などの多様な主体が、相互作用を通じて自律的に公共の問題に取り組む状態、あるいはその調整の仕組み。「ガバメントからガバナンスへ」という言葉で表されるように、政府がヒエラルキーの頂点から統治するモデルから、ネットワークの調整者になるモデルへの移行を指す。民間の関わり方として、NPM（New Public Management：民間の経営手法の導入）、PPP（Public-Private Partnership：官民連携）、協働（collaboration）がある。<\/p>"]},"代議制の停滞":{"id":"代議制の停滞","h":"代議制の停滞","part":"講義ノート","sect":"市民参加と代議制民主主義の危機","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">市民参加（citizen participation）<\/div><div class=\"ln\" style=\"--in:0\">代議制民主主義（representative democracy）<\/div><div class=\"ln\" style=\"--in:0\">停滞（stagnation）：マシーン政治（machine）、利益団体（interest groups）<\/div><div class=\"ln\" style=\"--in:0\">空洞化（hollowing out）：政治的無関心（apathy）<\/div><div class=\"ln\" style=\"--in:0\">投票率の大幅な低下（voting rates ↓↓）<\/div><div class=\"ln\" style=\"--in:1\">都道府県知事／都道府県議会、市町村長／市町村議会<\/div><div class=\"ln\" style=\"--in:1\">選挙結果に意外性がないので、投票する意欲がなくなる<\/div><div class=\"ln\" style=\"--in:1\">（選挙という）プロセスへの信頼が失われている<\/div><div class=\"ln\" style=\"--in:0\"><ruby>大阪<rt>おおさか<\/rt><\/ruby>都構想：賛成49.6% 対 反対50.4%<\/div><div class=\"ln\" style=\"--in:0\">市民参加の問題：次の枠組みは何か<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>代議制民主主義の問題を2つに分けている。<b>停滞<\/b>は、組織票をもつ政治マシーンや利益団体が選挙を支配し、一般の住民の声が届かない状態。<b>空洞化<\/b>は、住民の無関心で投票率が下がり、代表の正統性が弱まる状態。地方選挙の4種類（知事選、都道府県議選、市町村長選、市町村議選）のいずれも投票率が長期的に低下し、無投票当選も増えている。一方で<ruby>大阪<rt>おおさか<\/rt><\/ruby>都構想のように、争点がはっきりした住民投票には多くの人が参加し、僅差で結果が分かれる。講義の結論は、代議制を補う「次の枠組み」（ミニ・パブリックス、住民投票、デジタルの参加手段など）を考える必要がある、というもの。<\/p>"]},"停滞と空洞化（stagnation / hollowing out）":{"id":"停滞と空洞化（stagnation / hollowing out）","h":"停滞と空洞化（stagnation / hollowing out）","part":"重要概念展开","sect":"代議制民主主義の危機","blocks":["<p>代議制民主主義は、選挙で選んだ代表に決定を委ねる仕組みだが、二つの面で機能不全が指摘される。<b>停滞<\/b>は、組織票をもつ政治マシーン（machine politics：票と利益を交換する地域の政治組織。アメリカの都市政治の用語）や利益団体（interest groups）が選挙と政策を左右し、組織されていない住民の声が届かない状態。<b>空洞化<\/b>は、政治的無関心（apathy）で投票率が下がり、少数の組織票で当選が決まって、代表の正統性が弱まる状態。二つは互いに強め合う。<\/p>","<p>地方選挙では、投票率の低下に加えて、立候補者が定数に満たず<b>無投票当選<\/b>になるケースが増えている。「結果がわかっているから投票しない」「投票しても変わらない」という意識が、選挙というプロセスそのものへの信頼を失わせている。<\/p>"]},"地方選挙の投票率と無投票":{"id":"地方選挙の投票率と無投票","h":"地方選挙の投票率と無投票","part":"事例展开","sect":"","blocks":["<p>統一地方選挙の投票率は長期的に低下しており、2023年の統一地方選では、道府県議選・市議選・町村議選などで軒並み過去最低水準となった ⚠。道府県議選では、定数に対して候補者が足りず無投票で当選が決まった議員が約4分の1に上った ⚠。<\/p>"]}}},{"id":"1001-izumo","date":"10/1","title":"Governance Studies（出雲）","outline":[{"t":"g","label":"民営化とエージェンシー化","depth":0},{"t":"r","main":"民営化とエージェンシー化の違い","sides":["民営化（privatization）","JR・NTT・日本郵政の民営化","エージェンシー化（agentification）"]},{"t":"r","main":"民営化の期待と懸念","sides":["水道と電力"]},{"t":"r","main":"エージェンシーの仕組み","sides":["目標による管理（management by objectives）"]},{"t":"g","label":"アウトソーシング","depth":0},{"t":"r","main":"アウトソーシング","sides":["アウトソーシング（outsourcing）"]},{"t":"g","label":"ガバメントからガバナンスへ","depth":0},{"t":"r","main":"NPMの3つの手法","sides":["NPM（New Public Management）","規制緩和とイコールフッティング（deregulation / equal footing）"]},{"t":"r","main":"PPPとNPG","sides":["PPPとNPG（Public-Private Partnership / New Public Governance）"]},{"t":"r","main":"特殊会社","sides":["特殊会社（government enterprises）"]},{"t":"g","label":"第三セクターと非営利法人","depth":0},{"t":"r","main":"第三セクターと非営利法人","sides":["第三セクター（third sector）","非営利法人（non-profit corporations）"]},{"t":"g","label":"規制緩和の効果","depth":0},{"t":"r","main":"教育サービスの4つの規制","sides":["公共サービスの規制の4類型","株式会社立学校"]},{"t":"g","label":"公務員と予算","depth":0},{"t":"r","main":"公務員と民間の雇用","sides":[]},{"t":"r","main":"国会と内閣の承認","sides":[]},{"t":"g","label":"独立行政法人","depth":0},{"t":"r","main":"独立行政法人とJICA","sides":["独立行政法人（independent administrative agency）","橋本行革と独立行政法人","JICA","理化学研究所","国立病院機構"]},{"t":"g","label":"PFI と指定管理者","depth":0},{"t":"r","main":"PFIとPPP","sides":["PFIとコンセッション（Private Finance Initiative / concession）","空港コンセッション"]},{"t":"r","main":"指定管理者制度","sides":["指定管理者制度（designated manager system）","指定管理者と図書館"]},{"t":"r","main":"次回予告","sides":[]}],"cards":{"民営化とエージェンシー化の違い":{"id":"民営化とエージェンシー化の違い","h":"民営化とエージェンシー化の違い","part":"講義ノート","sect":"民営化とエージェンシー化","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">民営化（privatization）とエージェンシー化（agentification）：どちらも政府から切り離す（separated from government）<\/div><div class=\"ln\" style=\"--in:0\">似ているが違う<\/div><div class=\"ln\" style=\"--in:1\">エージェンシー：政府が政策を作り、エージェンシーが実施する<\/div><div class=\"ln\" style=\"--in:1\">民営化：政府はもはや（そのサービスについて）政策を作らない<\/div><div class=\"ln\" style=\"--in:0\">実態：民営化を導入したが、本当には民営化されていない（not really privatized）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>二つの違いは、<b>政策を決める権限がどこに残るか<\/b>。エージェンシー化では、政府が目標と政策を決め、実施だけを切り出した組織に任せる（火曜の「ガバナンス研究」の「政策と実施の分離」）。民営化では、事業そのものを民間に移し、何をどう提供するかは企業が決める。「本当には民営化されていない」は、日本では民営化された会社の株式を国が持ち続けたり、特別な法律で国が経営に関与し続けたりしている例が多いことを指す（事例参照）。<\/p>"]},"民営化（privatization）":{"id":"民営化（privatization）","h":"民営化（privatization）","part":"重要概念展开","sect":"官から民への手法","blocks":["<p>国や自治体が行ってきた事業を民間に移すこと。狭い意味では、国営・公営の事業体を株式会社にして株式を売却すること（所有の移転）。広い意味では、業務の民間委託（アウトソーシング）を含めることもある。1980年代の<ruby>英国<rt>えいこく<\/rt><\/ruby>サッチャー政権（BT、ブリティッシュ・ガス）、日本の中曽根政権（NTT、JR、JT）が代表例。<\/p>","<p>民営化には段階がある。①<b>特殊会社化<\/b>（株式会社にするが、特別な法律で国が株式保有や経営に関与する）、②<b>株式の売却<\/b>（国の持ち株を減らしていく）、③<b>完全民営化<\/b>（特別な法律を廃止し、普通の民間企業になる）。JR東日本・東海・西日本・<ruby>九州<rt>きゅうしゅう<\/rt><\/ruby>は③まで進んだが、NTT や日本郵政は①〜②の段階にとどまっており、講義の「本当には民営化されていない」はこの状態を指す。<\/p>"]},"JR・NTT・日本郵政の民営化":{"id":"JR・NTT・日本郵政の民営化","h":"JR・NTT・日本郵政の民営化","part":"事例展开","sect":"","blocks":["<p>1985年に電電公社が <b>NTT<\/b>、1987年に国鉄が分割されて <b>JR<\/b> 各社になった。JR東日本・東海・西日本・<ruby>九州<rt>きゅうしゅう<\/rt><\/ruby>は株式を全て売却して完全民営化したが、経営基盤の弱い <b>JR<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>・JR<ruby>四国<rt>しこく<\/rt><\/ruby>・JR貨物<\/b>は、独立行政法人の鉄道建設・運輸施設整備支援機構（<b>JRTT<\/b>）が株式を100%保有したままで、国の支援を受け続けている。NTT は NTT法で、政府が発行済み株式の3分の1以上を保有することが義務づけられている（この規制をめぐって2024年に NTT法の見直しが議論された）⚠。<\/p>","<p><b>日本郵政<\/b>は2007年に民営化され、約26万人の職員が国家公務員でなくなった。その後、株式の売却が進められたが、政府はなお日本郵政の株式の約3分の1以上を保有している ⚠。民営化の手続きを始めても、ユニバーサル・サービスの維持（全国一律の郵便、過疎地の鉄道）のために国の関与が残り、「本当には民営化されていない」状態が続く典型例。<\/p>"]},"エージェンシー化（agentification）":{"id":"エージェンシー化（agentification）","h":"エージェンシー化（agentification）","part":"重要概念展开","sect":"官から民への手法","blocks":["<p>政府内部で、政策の企画立案部門と実施部門を分け、実施部門を独立性の高い組織（エージェンシー）にすること。エージェンシーは、政府から目標と予算を与えられ、運営の裁量をもつ代わりに、実績で評価される。<ruby>英国<rt>えいこく<\/rt><\/ruby>の「ネクスト・ステップス」（1988年）が起源で、日本の独立行政法人、各国の執行エージェンシーがこれにあたる。民営化との違いは、政策を決めるのは引き続き政府で、エージェンシーはあくまで政府の一部である点。<\/p>"]},"民営化の期待と懸念":{"id":"民営化の期待と懸念","h":"民営化の期待と懸念","part":"講義ノート","sect":"民営化とエージェンシー化","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">なぜ民営化するのか？（水道、電気など）<\/div><div class=\"ln\" style=\"--in:0\"><b>期待<\/b>（expectation）<\/div><div class=\"ln\" style=\"--in:1\">財政負担を減らす？<\/div><div class=\"ln\" style=\"--in:1\">サービスの質（quality of service）<\/div><div class=\"ln\" style=\"--in:1\">公務員の削減（reduction of civil servants）<\/div><div class=\"ln\" style=\"--in:1\">政府の事業体が他の企業と競争する<\/div><div class=\"ln\" style=\"--in:0\"><b>懸念<\/b>（concern）（メモなし）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>期待は、財政負担の軽減（赤字事業の切り離し、株式売却収入）、競争によるサービスの質の向上と効率化、公務員数の削減。懸念は講義メモにないが、一般には、①採算の合わない地域やサービスの切り捨て（ユニバーサル・サービスの危機）、②料金の値上がり、③安全性の低下、④公共性・説明責任の低下が挙げられる。水道や電気のような<b>ネットワーク型インフラ<\/b>は自然独占になりやすく、民営化しても競争が起きにくいので、懸念がとくに大きい。<\/p>"]},"水道と電力":{"id":"水道と電力","h":"水道と電力","part":"事例展开","sect":"","blocks":["<p>電力は、2016年の小売全面自由化、2020年の発送電分離で、発電と小売には競争を入れ、送配電網は中立的に管理する形になった。水道は2018年の水道法改正で、自治体が施設を所有したまま運営権を民間に売却するコンセッション方式が可能になった。<ruby>宮城<rt>みやぎ<\/rt><\/ruby>県が2022年に上下水道など9事業の運営権を民間に売却したのが最初の大型案件。海外では、パリやベルリンなどで民営化した水道を料金の値上がりなどを理由に再公営化した例もあり、ネットワーク型インフラの民営化の難しさを示している。<\/p>"]},"エージェンシーの仕組み":{"id":"エージェンシーの仕組み","h":"エージェンシーの仕組み","part":"講義ノート","sect":"民営化とエージェンシー化","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">エージェンシーの例：研究機関、免許・検定などの機関（license institutions）<\/div><div class=\"ln\" style=\"--in:0\">職員は公務員ではないが、政府に属する<\/div><div class=\"ln\" style=\"--in:0\">政府が目標（objectives）を与える<\/div><div class=\"ln\" style=\"--in:0\">政府は実績（achievement）に基づいて活動を監視（monitor）する<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>日本のエージェンシーにあたるのが<b>独立行政法人<\/b>。所管の大臣が<b>中期目標<\/b>を示し、法人が<b>中期計画<\/b>を作って実施し、実績を評価される（目標による管理）。職員の身分は、一部の法人（行政執行法人）を除いて国家公務員ではないが、国の出資と運営費交付金で運営される「政府の一部」である。<\/p>"]},"目標による管理（management by objectives）":{"id":"目標による管理（management by objectives）","h":"目標による管理（management by objectives）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p>組織の上位者が目標を示し、下位の組織（または個人）がその達成のための計画を立てて実行し、結果で評価される管理手法。経営学者ドラッカーが提唱した。独立行政法人では、主務大臣が中期目標を示し、法人が中期計画を作り、毎年度と期間終了時に評価を受ける。評価結果は組織の見直しや交付金に反映される。講師が「動機づけのようなもの」と言ったのは、目標と評価で組織を自発的に動かそうとする点を指している。<\/p>"]},"アウトソーシング":{"id":"アウトソーシング","h":"アウトソーシング","part":"講義ノート","sect":"","blocks":["<h5>アウトソーシング<\/h5>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">アウトソーシング（outsourcing）<\/div><div class=\"ln\" style=\"--in:0\">例：政府が所有する施設を、民間部門がすべて運営する<\/div><div class=\"ln\" style=\"--in:0\">官民の組み合わせ（mix of private &amp; public）<\/div><div class=\"ln\" style=\"--in:0\">（譲渡 transfer のことか (?)）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>所有は公共のまま、運営や業務の一部・全部を民間に委ねる方法。民営化（所有も移す）とエージェンシー化（政府内の別組織に任せる）の中間にあたる。日本の自治体では、施設の運営を民間に任せる<b>指定管理者制度<\/b>や、業務の<b>包括委託<\/b>、窓口業務の委託などが典型。「transf」は、所有権そのものを民間に移す譲渡（transfer）を、アウトソーシングと対比したのかもしれない。<\/p>"]},"アウトソーシング（outsourcing）":{"id":"アウトソーシング（outsourcing）","h":"アウトソーシング（outsourcing）","part":"重要概念展开","sect":"官から民への手法","blocks":["<p>公共サービスの所有と責任は政府に残したまま、業務の実施を外部（民間企業、NPO など）に委ねること。単純な業務委託から、施設運営の一括委任（指定管理者）、設計から運営までの一括発注（PFI）、市場化テスト（官民競争入札）まで幅がある。民営化と比べて、政府が責任を持ち続ける分、サービスの継続性や公共性は保ちやすいが、委託先の監視（モニタリング）が必要になる。<\/p>"]},"NPMの3つの手法":{"id":"NPMの3つの手法","h":"NPMの3つの手法","part":"講義ノート","sect":"ガバメントからガバナンスへ","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">ガバメントからガバナンスへ（government to governance）<\/div><div class=\"ln\" style=\"--in:0\">① NPM<\/div><div class=\"ln\" style=\"--in:1\">❶ アウトソーシングと民営化：公共サービスの提供（provision of public services）<\/div><div class=\"ln\" style=\"--in:1\">❷ 政府内部：エージェンシー化 → 政府機関の効率改善<\/div><div class=\"ln\" style=\"--in:1\">❸ 規制緩和（deregulation）<\/div><div class=\"ln\" style=\"--in:2\">政府の内と外での<b>イコールフッティング<\/b>（equal footing）：政府系の企業と純粋な民間企業との違いをなくすべき<\/div><div class=\"ln\" style=\"--in:2\">それでも政府は市場を保護する<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>NPM を、①サービス提供を外に出す（アウトソーシング・民営化）、②政府の中を変える（エージェンシー化）、③市場のルールを変える（規制緩和）の三つに整理している。<b>イコールフッティング<\/b>は、官と民が同じ条件で競争できるようにすること。政府系の事業体が税制や資金調達で優遇されていたり、民間には参入規制がかかっていたりすると、公正な競争にならない。ただし規制緩和をしても、政府は市場の秩序を守る役割（安全規制、独占の防止など）からは降りられない。<\/p>"]},"NPM（New Public Management）":{"id":"NPM（New Public Management）","h":"NPM（New Public Management）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p>民間企業の経営手法と市場メカニズムを行政に取り入れる改革の考え方（詳しくは火曜の「ガバナンス研究」）。講義では、①アウトソーシングと民営化（サービス提供を外へ）、②エージェンシー化（政府の中の効率化）、③規制緩和（市場のルールの変更）の三つの手法に整理された。<\/p>"]},"規制緩和とイコールフッティング（deregulation / equal footing）":{"id":"規制緩和とイコールフッティング（deregulation / equal footing）","h":"規制緩和とイコールフッティング（deregulation / equal footing）","part":"重要概念展开","sect":"官から民への手法","blocks":["<p><b>規制緩和<\/b>は、参入・価格・事業内容などについての政府の規制を減らし、市場競争を促すこと。日本では1990年代以降、通信、運輸、電力、金融などで進められた。<b>イコールフッティング<\/b>は、競争条件の平等化のこと。民営化後も国が関与する会社や公営企業が、税・資金調達・規制の面で優遇されていると、民間企業との公正な競争にならない。逆に、公的な事業体だけに重いユニバーサル・サービス義務が課されていることもあり、どこまで条件を揃えるかが論点になる。<\/p>"]},"PPPとNPG":{"id":"PPPとNPG","h":"PPPとNPG","part":"講義ノート","sect":"ガバメントからガバナンスへ","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">② PPP（NPG）<\/div><div class=\"ln\" style=\"--in:1\">❶ 競争が行き過ぎていて、公共サービスには向かない（too much competitive）<\/div><div class=\"ln\" style=\"--in:1\">❷ 市場を守るために規制を強化する（価格が上がることもある）<\/div><div class=\"ln\" style=\"--in:1\">❸ 質が下がるかもしれない<\/div><div class=\"ln\" style=\"--in:0\">「市場競争よりも政府を強化すべき」？？<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>NPM への反省として出てきたのが PPP（官民連携）と NPG（New Public Governance）。①は NPM 型の競争入札・市場化が、福祉や教育のように継続性や信頼関係が大事なサービスには合わないという批判。②は、民間に任せるほど、品質や安全を守るための規制を政府が強めなければならず、そのコストで結果的に価格が上がることがあるという逆説。③は、コスト削減の圧力で質が下がるおそれ。メモの「政府を強化すべき？？」は、火曜の講義のポストNPM（政府中枢の強化、6-1・6-11）と同じ流れの議論と思われる。<\/p>"]},"PPPとNPG（Public-Private Partnership / New Public Governance）":{"id":"PPPとNPG（Public-Private Partnership / New Public Governance）","h":"PPPとNPG（Public-Private Partnership / New Public Governance）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p><b>PPP<\/b>（官民連携）は、公共と民間が役割とリスクを分担しながら、公共サービスを共同で提供する仕組みの総称。PFI、コンセッション、指定管理者、包括委託などを含む。<b>NPG<\/b> は、政府・企業・NPO・市民のネットワークによる公共サービスの共同生産を重視する、ポストNPM のガバナンス・モデル（オズボーン、2010）。NPM が競争と契約を重視したのに対し、NPG は協働と信頼関係を重視する。講義の3つの懸念（競争の行き過ぎ、規制強化による価格上昇、質の低下）は、NPM 型の市場化への反省として NPG が出てきた理由にあたる。<\/p>"]},"特殊会社":{"id":"特殊会社","h":"特殊会社","part":"講義ノート","sect":"ガバメントからガバナンスへ","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政府企業（government enterprises）（特別な事業 special operation）<\/div><div class=\"ln\" style=\"--in:0\">JRTT、政府内で分離して<\/div><div class=\"ln\" style=\"--in:0\">交通、通信（NTT、ソフトバンク、KDDI） (?)<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>民営化されたが、特別な法律で国が関与し続けている<b>特殊会社<\/b>の話と思われる。JRTT（鉄道建設・運輸施設整備支援機構）は独立行政法人で、JR<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>・JR<ruby>四国<rt>しこく<\/rt><\/ruby>・JR貨物の株式を100%保有している。つまりこの3社は「民営化」されたが、実質的には国の会社のまま。通信では NTT が NTT法で国の株式保有（3分の1以上）を義務づけられている一方、ソフトバンクや KDDI は純粋な民間企業として競争している（「tv」は通信 telecom の聞き違いか (?)）。<\/p>"]},"特殊会社（government enterprises）":{"id":"特殊会社（government enterprises）","h":"特殊会社（government enterprises）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p>特別な法律に基づいて設立され、国が株式の保有や役員人事・事業計画の認可などで関与し続ける株式会社。NTT（NTT法）、日本郵政（日本郵政株式会社法）、JT（日本たばこ産業株式会社法）、JR<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>・<ruby>四国<rt>しこく<\/rt><\/ruby>・貨物（JR会社法）、日本政策投資銀行などがある。形式は民間企業でも、国が経営の重要事項に関与するので、「民営化されたが本当には民営化されていない」状態の典型。<\/p>"]},"第三セクターと非営利法人":{"id":"第三セクターと非営利法人","h":"第三セクターと非営利法人","part":"講義ノート","sect":"","blocks":["<h5>第三セクターと非営利法人<\/h5>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">第三セクター（third sector）<\/div><div class=\"ln\" style=\"--in:0\">公共サービスだが利益を出すサービスを提供するもの、あるいは民間企業だが公共サービスを提供するもの<\/div><div class=\"ln\" style=\"--in:0\">純粋な民間：教育、社会福祉、医療、宗教 → 公共サービスを提供する4種類の法人（課税されない）<\/div><div class=\"ln\" style=\"--in:0\">非営利の社会福祉<\/div><div class=\"ln\" style=\"--in:1\">保険から70%、利用者から30%を受け取る<\/div><div class=\"ln\" style=\"--in:0\">収益活動をすることもある（課税される）<\/div><div class=\"ln\" style=\"--in:1\">例：研修、出版（課税）<\/div><div class=\"ln\" style=\"--in:0\">政府からの補助金<\/div><div class=\"ln\" style=\"--in:0\">財団：非営利、課税されない<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>「第三セクター」は、第一セクター（政府）でも第二セクター（営利企業）でもない領域を指す。英語圏では NPO などの非営利部門を指すが、日本語の「第三セクター」は、国や自治体と民間が共同出資する法人（多くは株式会社）を指すことが多いので注意。<\/p>","<p>講義の中心は、公共的なサービスを担う<b>非営利法人<\/b>の4類型：<b>学校法人<\/b>（教育）、<b>社会福祉法人<\/b>（福祉）、<b>医療法人<\/b>（医療）、<b>宗教法人<\/b>。本来の事業は非課税または軽課税だが、研修や出版などの<b>収益事業<\/b>には法人税がかかる。「保険7割・利用者3割」は医療保険の自己負担の構造（原則3割負担）で、介護保険では利用者負担は原則1割（所得により2〜3割）。財団は公益財団法人のことで、公益目的事業は非課税。<\/p>"]},"第三セクター（third sector）":{"id":"第三セクター（third sector）","h":"第三セクター（third sector）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p>国際的には、政府（第一セクター）でも営利企業（第二セクター）でもない、NPO・協同組合・慈善団体などの非営利部門を指す。日本語の「第三セクター」は意味が違い、国や自治体と民間が共同出資して作った法人（株式会社や公益法人）を指すのが一般的。1980〜90年代にリゾート開発や地方鉄道などで多く作られたが、経営破綻して自治体の財政を圧迫した例が多い。講義の「公共サービスだが利益を出すもの、または民間企業だが公共サービスを提供するもの」という説明は、この官民の中間的な性格を指している。<\/p>"]},"非営利法人（non-profit corporations）":{"id":"非営利法人（non-profit corporations）","h":"非営利法人（non-profit corporations）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p>公共的なサービスを担う民間の非営利法人には、根拠法ごとに類型がある。<b>学校法人<\/b>（私立学校法）、<b>社会福祉法人<\/b>（社会福祉法）、<b>医療法人<\/b>（医療法）、<b>宗教法人<\/b>（宗教法人法）に加えて、<b>公益財団法人・公益社団法人<\/b>、<b>NPO法人<\/b>（特定非営利活動法人）など。本来の事業は非課税または軽課税で、研修・出版・物品販売などの<b>収益事業<\/b>（法人税法で定める34業種）には法人税がかかる。政府から補助金を受けるものも多い。<\/p>","<p>医療・介護では、サービス費用の大部分が保険から支払われ、利用者は一部を負担する。医療保険は原則3割負担（保険7割）、介護保険は原則1割負担。民間の法人でありながら、公的な保険制度と規制の中で動く点で、純粋な市場とも政府とも違う領域にある。<\/p>"]},"教育サービスの4つの規制":{"id":"教育サービスの4つの規制","h":"教育サービスの4つの規制","part":"講義ノート","sect":"規制緩和の効果","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\"><b>規制緩和<\/b>（deregulation）？？<\/div><div class=\"ln\" style=\"--in:0\">第一段階、第二段階<\/div><div class=\"ln\" style=\"--in:0\">（教育サービスの例）<\/div><div class=\"ln\" style=\"--in:0\">① 教育サービスを提供できるかどうか：参入規制（entry regulation）<\/div><div class=\"ln\" style=\"--in:0\">② 人員配置基準（staffing standards）：一定以上の質でなければならない。（月曜の minimum、ナショナル・ミニマムのこと？）質の設定<\/div><div class=\"ln\" style=\"--in:0\">③ 必置規制（mandatory placement regulation）：民間の教育サービスも専門職を雇わなければならない<\/div><div class=\"ln\" style=\"--in:0\">④ 価格規制（price regulation）：民間の教育サービスの費用は一定以下でなければならない<\/div><div class=\"ln\" style=\"--in:0\">⇒ だから（規制緩和しても）何も変わらなかった<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>規制緩和で民間が参入できるようにしても、残る規制のせいで実態は変わらない、という話。①参入規制が緩んでも、②人員配置基準（教員数、施設の基準）、③必置規制（資格をもつ専門職を必ず置く）、④価格規制（授業料の上限）が残っていれば、民間がコストを下げたり独自のサービスを出したりする余地がなく、結局、公共と同じことしかできない。②はご推察のとおり、月曜の木村先生の授業の<b>ナショナル・ミニマム<\/b>とつながる考え方で、質を保障するための基準が、同時に民間参入の壁にもなる。<\/p>"]},"公共サービスの規制の4類型":{"id":"公共サービスの規制の4類型","h":"公共サービスの規制の4類型","part":"重要概念展开","sect":"官から民への手法","blocks":["<p>民間が公共サービスに参入するときに働く規制を、講義の教育の例で整理すると：①<b>参入規制<\/b>（誰が提供できるか。学校を設置できるのは原則として国・自治体・学校法人のみ）②<b>人員配置基準<\/b>（教員数、施設・設備の基準。設置基準）③<b>必置規制<\/b>（特定の資格をもつ職員を必ず置かせる。教員免許、司書、保育士など）④<b>価格規制<\/b>（授業料・利用料の上限）。<\/p>","<p>規制緩和で①だけを緩めても、②〜④が残っていれば、民間はコストの構造も、サービスの中身も、価格も変えられない。結果として、参入しても公共と同じことしかできず「何も変わらない」。質を保障するための基準（ナショナル・ミニマム）が、同時に民間の創意工夫を妨げる壁にもなる、というジレンマ。<\/p>"]},"株式会社立学校":{"id":"株式会社立学校","h":"株式会社立学校","part":"事例展开","sect":"","blocks":["<p>2003年の構造改革特別区域法で、特区に限って株式会社による学校の設置が認められた。現在は主に通信制高校などで見られる。ただし、学校の設置基準、教員免許をもつ教員の配置、私学助成の対象外（株式会社は助成を受けられない）など、講義で挙がった規制が残るため、全国的な広がりは限定的にとどまっている。参入規制だけを緩めても実態が変わりにくい例。<\/p>"]},"公務員と民間の雇用":{"id":"公務員と民間の雇用","h":"公務員と民間の雇用","part":"講義ノート","sect":"公務員と予算","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">公務員と民間の被用者<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>メモが短いが、民営化・エージェンシー化で職員の身分が公務員から民間の被用者に変わることの話と思われる。日本郵政の民営化（2007年）では約26万人の郵政職員が国家公務員でなくなり、独立行政法人化でも多くの職員が国家公務員の身分を離れた。<\/p>"]},"国会と内閣の承認":{"id":"国会と内閣の承認","h":"国会と内閣の承認","part":"講義ノート","sect":"公務員と予算","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">予算に関わるので、国会と内閣の承認が必要<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>「congress」は日本の場合<b>国会<\/b>。政府から切り離された組織でも、予算に関わる部分は国会の統制を受ける、という話と思われる。例えば日本政策金融公庫や JICA の有償資金協力部門などの予算は「政府関係機関予算」として、国の一般会計・特別会計と一緒に国会の議決を受ける。直後の ODA・JICA の話につながる。<\/p>"]},"独立行政法人とJICA":{"id":"独立行政法人とJICA","h":"独立行政法人とJICA","part":"講義ノート","sect":"独立行政法人","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">ODA プロジェクト<\/div><div class=\"ln\" style=\"--in:0\">独立行政法人：JICA<\/div><div class=\"ln\" style=\"--in:0\">政府の機能として政策と実施を分離（policy &amp; implementation separated）<\/div><div class=\"ln\" style=\"--in:0\">目標による管理（management by objectives）（x年計画）<\/div><div class=\"ln\" style=\"--in:1\">動機づけ（motivating）のようなもの<\/div><div class=\"ln\" style=\"--in:0\">橋本行革：1990年代<\/div><div class=\"ln\" style=\"--in:0\">独立行政法人の例<\/div><div class=\"ln\" style=\"--in:1\">JICA<\/div><div class=\"ln\" style=\"--in:1\">奨学金（JASSO）<\/div><div class=\"ln\" style=\"--in:1\">理化学研究所（RIKEN）：ライフサイエンス、山中（伸弥）<\/div><div class=\"ln\" style=\"--in:1\">国立病院機構（national hospital organization）<\/div><div class=\"ln\" style=\"--in:2\">民間病院が受け入れたがらない患者<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>日本版エージェンシーである独立行政法人は、1990年代後半の<b>橋本行革<\/b>（中央省庁等改革）で導入が決まり、2001年に発足した。<ruby>英国<rt>えいこく<\/rt><\/ruby>のエージェンシー（ネクスト・ステップス）がモデル。所管大臣が3〜7年の中期目標を示し、法人が計画を作って実施し、評価を受ける<b>目標による管理<\/b>が基本で、講師の言う「動機づけ」はこの仕組みのこと。<\/p>","<p>例として、ODA を実施する <b>JICA<\/b>（国際協力機構）、奨学金の <b>JASSO<\/b>（日本学生支援機構）、研究開発の<b>理化学研究所<\/b>、全国の国立病院を運営する<b>国立病院機構<\/b>が挙げられた。国立病院機構は、結核、重症心身障害、筋ジストロフィーなど、採算が合わず民間病院が引き受けたがらない医療（セーフティネット医療）を担っており、コロナ禍でも患者の受け入れで役割を果たした。山中伸弥教授は<ruby>京都<rt>きょうと<\/rt><\/ruby>大学 iPS 細胞研究所の所属で、理研とは別だが、ライフサイエンス研究の例として名前が出たと思われる (?)。<\/p>"]},"独立行政法人（independent administrative agency）":{"id":"独立行政法人（independent administrative agency）","h":"独立行政法人（independent administrative agency）","part":"重要概念展开","sect":"官から民への手法","blocks":["<p>1990年代後半の橋本行革（中央省庁等改革基本法、1998年）で導入が決まり、2001年に発足した日本版エージェンシー。2015年の制度改正で、①<b>中期目標管理法人<\/b>（3〜5年の中期目標。JICA、JASSO、国立病院機構など）、②<b>国立研究開発法人<\/b>（5〜7年の中長期目標。理化学研究所、JAXA など）、③<b>行政執行法人<\/b>（毎年度の目標。職員は国家公務員。国立印刷局、造幣局など）の3類型になった。<\/p>","<p>運営費は主に国からの<b>運営費交付金<\/b>で賄われ、使い道の裁量が大きい代わりに、主務大臣の評価を受ける。課題として、天下りの受け皿になっているという批判や、交付金の削減で研究機関の基盤が弱まっているという指摘がある。<\/p>"]},"橋本行革と独立行政法人":{"id":"橋本行革と独立行政法人","h":"橋本行革と独立行政法人","part":"事例展开","sect":"","blocks":["<p>1996年に発足した橋本龍太郎内閣は、行政改革会議を設置して中央省庁の再編を進め、1府22省庁を1府12省庁に再編した（2001年施行）。その一環として、政策の企画立案と実施を分離し、実施部門を独立行政法人にする方針が打ち出され、2001年に57の独立行政法人が発足した。<ruby>英国<rt>えいこく<\/rt><\/ruby>のエージェンシー（ネクスト・ステップス）がモデルだった。<\/p>"]},"JICA":{"id":"JICA","h":"JICA","part":"事例展开","sect":"","blocks":["<p>国際協力機構（JICA）は、日本の政府開発援助（ODA）のうち、技術協力、有償資金協力（円借款）、無償資金協力を一元的に実施する独立行政法人。外務省などの政府が ODA の政策を決め、JICA が実施するという、政策と実施の分離の典型例。円借款を扱う有償資金協力部門の予算は「政府関係機関予算」として国会の議決を受ける。<\/p>"]},"理化学研究所":{"id":"理化学研究所","h":"理化学研究所","part":"事例展开","sect":"","blocks":["<p>1917年に財団法人として設立された日本最大の総合研究機関で、2003年に独立行政法人、2015年に国立研究開発法人になった。ライフサイエンス、物理、化学、計算科学（スーパーコンピューター「富岳」）など幅広い分野の研究を行う。国立研究開発法人は、研究開発の長期性に配慮して、中長期目標の期間が最長7年と長く設定されている。<\/p>"]},"国立病院機構":{"id":"国立病院機構","h":"国立病院機構","part":"事例展开","sect":"","blocks":["<p>全国約140の国立病院を運営する独立行政法人（2004年発足）。結核、重症心身障害、筋ジストロフィー、精神科の一部など、採算が合わず民間病院が担いにくい<b>セーフティネット医療<\/b>を多く担っている。コロナ禍では、国が国立病院機構などに患者受け入れを要請し、民間病院が受け入れに消極的だった中で役割が注目された。<\/p>"]},"PFIとPPP":{"id":"PFIとPPP","h":"PFIとPPP","part":"講義ノート","sect":"PFI と指定管理者","blocks":["<h4 class=\"lab\">笔记<\/h4>","<h4 class=\"lab\">PFI／PPP<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">設計（design）、公共施設<\/div><div class=\"ln\" style=\"--in:0\">空港の建て直しにはお金がかかる → 民間の資金を活用（utilize private funds）<\/div><div class=\"ln\" style=\"--in:0\">現在：税金を使う。これから：民間の資金を使う<\/div><div class=\"ln\" style=\"--in:1\">民間はコストを払うが、収入も得る<\/div><div class=\"ln\" style=\"--in:0\">入札して落札する、という意味？<\/div><div class=\"ln\" style=\"--in:0\">日本の PFI 法<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p><b>PFI<\/b>（Private Finance Initiative）は、公共施設の設計・建設・維持管理・運営を、民間の資金とノウハウでまとめて行う手法。日本では1999年の PFI 法で導入された。メモの「民間はコストを払うが収入も得る」は、PFI の中でも、利用料金を民間が直接受け取って運営する<b>コンセッション<\/b>（公共施設等運営権）方式のこと（2011年の法改正で導入）。空港はその代表例で、<ruby>関西<rt>かんさい<\/rt><\/ruby>・<ruby>伊丹<rt>いたみ<\/rt><\/ruby>空港や<ruby>仙台<rt>せんだい<\/rt><\/ruby>空港などで運営権が民間に売却された。事業者は<b>競争入札<\/b>などで選ばれるので、「入札・落札」の理解で合っている。<\/p>"]},"PFIとコンセッション（Private Finance Initiative / concession）":{"id":"PFIとコンセッション（Private Finance Initiative / concession）","h":"PFIとコンセッション（Private Finance Initiative / concession）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p><b>PFI<\/b> は、公共施設の設計・建設・維持管理・運営を一括して民間に任せ、民間の資金で整備する手法。<ruby>英国<rt>えいこく<\/rt><\/ruby>で1992年に始まり、日本では1999年に PFI 法が制定された。政府は、施設の完成後にサービス購入料を長期にわたって支払う（サービス購入型）。<\/p>","<p><b>コンセッション<\/b>（公共施設等運営権）は、2011年の PFI 法改正で導入された方式で、施設の所有権は公共に残したまま、運営権を民間に売却する。民間事業者は利用料金を直接受け取って収入とし、その中から運営費や投資を賄う（独立採算型）。講義の「民間はコストを払うが、収入も得る」はこれにあたる。<\/p>","<p>PFI の判断基準は <b>VFM<\/b>（Value for Money）で、公共が自ら行う場合と比べて、同じ費用でより良いサービス、または同じサービスをより安く提供できるかを評価する。<\/p>"]},"空港コンセッション":{"id":"空港コンセッション","h":"空港コンセッション","part":"事例展开","sect":"","blocks":["<p>2016年に<ruby>関西<rt>かんさい<\/rt><\/ruby>国際空港・<ruby>大阪<rt>おおさか<\/rt><\/ruby>国際空港（<ruby>伊丹<rt>いたみ<\/rt><\/ruby>）の運営権がオリックスとフランスのヴァンシ・エアポートの企業連合に売却され、同年には<ruby>仙台<rt>せんだい<\/rt><\/ruby>空港も民間運営に移った。その後、<ruby>高松<rt>たかまつ<\/rt><\/ruby>、<ruby>福岡<rt>ふくおか<\/rt><\/ruby>、<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>の7空港などに広がった。民間事業者は着陸料や商業施設の収入で運営し、路線誘致や商業施設の充実で収益を上げる。コロナ禍で旅客が激減した際には、事業者の経営が大きく圧迫され、リスク分担のあり方が問題になった。<\/p>"]},"指定管理者制度":{"id":"指定管理者制度","h":"指定管理者制度","part":"講義ノート","sect":"PFI と指定管理者","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\"><b>指定管理者制度<\/b>（designated manager system）<\/div><div class=\"ln\" style=\"--in:0\">民間が運営だけを行う（private operates only）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>2003年の地方自治法改正で導入された制度で、自治体の<b>公の施設<\/b>（図書館、体育館、公民館、公園など）の管理運営を、民間企業や NPO を含む団体に任せることができる。所有は自治体のまま、運営だけを任せる点が PFI（建設から任せる）との違い。<\/p>"]},"指定管理者制度（designated manager system）":{"id":"指定管理者制度（designated manager system）","h":"指定管理者制度（designated manager system）","part":"重要概念展开","sect":"ガバメントからガバナンスへ","blocks":["<p>2003年の地方自治法改正で導入された制度で、自治体の公の施設の管理運営を、議会の議決を経て指定した団体（民間企業、NPO、財団など）に任せることができる。それ以前は、自治体の出資法人などにしか委託できなかった（管理委託制度）。指定期間は3〜5年が多く、期間ごとに公募で選び直すことが多い。所有は自治体に残り、運営だけを任せる点が PFI との違い。課題として、短い指定期間のために職員の雇用が不安定になること、コスト削減が優先されて専門性が失われること（図書館など）が指摘されている。<\/p>"]},"指定管理者と図書館":{"id":"指定管理者と図書館","h":"指定管理者と図書館","part":"事例展开","sect":"","blocks":["<p><ruby>佐賀<rt>さが<\/rt><\/ruby>県<ruby>武雄<rt>たけお<\/rt><\/ruby>市は2013年、市立図書館の運営を、TSUTAYA を運営するカルチュア・コンビニエンス・クラブ（CCC）に指定管理者として任せ、カフェや書店を併設した図書館に改装した。来館者は大きく増えたが、選書の質や蔵書の除籍をめぐって批判も起きた。指定管理者制度が、サービスの改善と専門性の確保の両方をどう実現するかという課題を示す例。<\/p>"]},"次回予告":{"id":"次回予告","h":"次回予告","part":"講義ノート","sect":"PFI と指定管理者","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">来週：市場の失敗（market failure）、政府の失敗（government failure）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>今日の民営化・規制緩和の話の理論的な前提。市場に任せるとうまくいかない場合（市場の失敗）があるから政府が介入するが、政府の介入にも失敗（政府の失敗）がある。NPM は政府の失敗を、ポストNPM・NPG は市場化の失敗を重く見た議論といえる。<\/p>"]}}},{"id":"1002-yuasa","date":"10/2","title":"E-Government（湯淺）","outline":[{"t":"g","label":"導入","depth":0},{"t":"r","main":"政府はどう人を把握するか","sides":[]},{"t":"g","label":"電子政府の目的","depth":0},{"t":"r","main":"なぜ電子政府か","sides":["電子政府の目的","電子投票","ワンストップ・サービス"]},{"t":"g","label":"国家と住民登録","depth":0},{"t":"r","main":"国家の三要素","sides":["国家三要素説","中国の洪水","ソブリンAI","一人っ子政策","自律型致死兵器システム","韓国とタイの少子化","日本人ファーストと外国人労働者"]},{"t":"r","main":"住民登録の国際比較","sides":["戸籍","韓国の家族関係登録","住民基本台帳","アメリカの社会保障番号","マイナンバー制度","戸籍の振り仮名","コンビニ交付"]},{"t":"r","main":"出生届と死亡届","sides":["出生届・死亡届のオンライン化"]},{"t":"r","main":"住基ネットとLG-WAN","sides":["住基ネットとLG-WAN (2)"]},{"t":"g","label":"マイナンバー","depth":0},{"t":"r","main":"番号の統合","sides":[]},{"t":"g","label":"プッシュ型行政","depth":0},{"t":"r","main":"プル型からプッシュ型へ","sides":["プッシュ型行政","妊娠届とプッシュ型支援"]},{"t":"g","label":"ベース・レジストリ","depth":0},{"t":"r","main":"ベース・レジストリ","sides":["ベース・レジストリ (2)","富山市の国勢調査水増し事件"]},{"t":"g","label":"討論の問い","depth":0},{"t":"r","main":"討論の問い","sides":["犬の登録とマイクロチップ"]}],"cards":{"政府はどう人を把握するか":{"id":"政府はどう人を把握するか","h":"政府はどう人を把握するか","part":"講義ノート","sect":"導入","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政府はどのように人々を管理（control）するのか<\/div><div class=\"ln\" style=\"--in:0\">住民（inhabitants）の把握？ そのプロセス<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>今日のテーマの出発点。国家が税を集め、サービスを提供し、選挙を行うには、まず「誰がどこに住んでいるか」を把握しなければならない。その仕組みが<b>住民登録制度<\/b>で、電子政府の土台になる。後半の住民登録・マイナンバー・ベース・レジストリの話は、すべてこの問いにつながっている。<\/p>"]},"なぜ電子政府か":{"id":"なぜ電子政府か","h":"なぜ電子政府か","part":"講義ノート","sect":"電子政府の目的","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">なぜ電子政府なのか（why e-government）<\/div><div class=\"ln\" style=\"--in:0\">コスト削減（cost reduction）：紙<\/div><div class=\"ln\" style=\"--in:0\">行政の効率化（efficiency in administration）<\/div><div class=\"ln\" style=\"--in:0\">公共サービス提供の改善（improved public service delivery）<\/div><div class=\"ln\" style=\"--in:0\">社会のデジタル・トランスフォーメーション（DX）：社会そのものを変え、より革新的にする<\/div><div class=\"ln\" style=\"--in:0\">民主的な参加の支援（supporting democratic engagement）：政府のプロセスを透明にする<\/div><div class=\"ln\" style=\"--in:0\">〔例〕日本：高齢化社会（労働力不足）<\/div><div class=\"ln\" style=\"--in:0\">〔例〕先進国：効率化が目的<\/div><div class=\"ln\" style=\"--in:0\">〔例〕途上国：電子投票（e-voting）。選挙を公正にするため<\/div><div class=\"ln\" style=\"--in:0\">日本：紙の文化（culture of paper）<\/div><div class=\"ln\" style=\"--in:0\">ワンストップ・サービス（one-stop services）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>電子政府の目的を5つ挙げ、国によって重点が違うことを示している。日本では高齢化による<b>労働力不足<\/b>（自治体職員も減る）が最大の動機で、少ない人手で行政を回すために効率化が必要になる。途上国では、<b>電子投票<\/b>などで選挙の不正を防ぎ、政府の透明性を高めることが重要な目的になる（メモの「e-boarding」は e-voting の聞き違いと思われる）。日本の課題として挙がった<b>紙の文化<\/b>と<b>ワンストップ・サービス<\/b>は、後半の出生届・死亡届の話で具体化される。<\/p>"]},"電子政府の目的":{"id":"電子政府の目的","h":"電子政府の目的","part":"講義ノート","sect":"","blocks":["<h5>なぜ電子政府か<\/h5>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">なぜ電子政府なのか（why e-government）<\/div><div cl
