<style>
/* Style follows 导论artifact: white canvas, gray filled rounded cards (darker gray = higher level), frosted glass bars and panels, hairline separators, neutral near-black accent. Q/＊ mark colors stay as functional colors. Feed = one column; each row pages sideways to its linked cards; outline in a left drawer. */
:root{
  --bg:#ffffff; --card:#f0f0f2; --ink:#000000; --ink2:#3c3c43d9; --mute:#3c3c4399; --sep:#d1d1d6; --line:#c7c7cc;
  --accent:#1c1c1e; --accent-soft:#e8e8ed; --slide:#e7e7ea; --fill:#7676801f; --sel:#e3e3e8;

  --glass:rgba(255,255,255,.5); --glass-w:rgba(255,255,255,.78);
  --dig-ic:#FF3B30; --key-ic:#007AFF; --dig:rgba(255,59,48,.5); --dig-line:#FF3B30; --key:rgba(70,105,143,.3); --key-line:#007AFF;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","PingFang SC","Noto Sans CJK JP",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --hdr:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#212024; --ink:#ffffff; --ink2:#ebebf5d9; --mute:#ebebf599; --sep:#38383a; --line:#48484a;
  --accent:#f2f2f7; --accent-soft:#2c2c2e; --slide:#18181a; --fill:#7676803d; --sel:#3a3a3c;
  --chip-bg:#3a3a3e; --l1-bg:#3b3b40; --group:#2c2c2e;
  --glass:rgba(22,22,24,.5); --glass-w:rgba(22,22,24,.78);
  --dig-ic:#FF453A; --key-ic:#0A84FF; --dig:rgba(255,69,58,.55); --dig-line:#FF453A; --key:rgba(143,175,210,.38); --key-line:#0A84FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#212024; --ink:#ffffff; --ink2:#ebebf5d9; --mute:#ebebf599; --sep:#38383a; --line:#48484a;
  --accent:#f2f2f7; --accent-soft:#2c2c2e; --slide:#18181a; --fill:#7676803d; --sel:#3a3a3c;
  --chip-bg:#3a3a3e; --l1-bg:#3b3b40; --group:#2c2c2e;
  --glass:rgba(22,22,24,.5); --glass-w:rgba(22,22,24,.78);
  --dig-ic:#FF453A; --key-ic:#0A84FF; --dig:rgba(255,69,58,.55); --dig-line:#FF453A; --key:rgba(143,175,210,.38); --key-line:#0A84FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.noselect{user-select:none;-webkit-user-select:none}

/* nav bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--hdr);display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding-inline:6px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);border-bottom:.5px solid var(--sep);user-select:none;-webkit-user-select:none}
.ib{width:40px;height:40px;display:grid;place-items:center;color:var(--accent);border-radius:6px;transition:background-color .15s ease,color .15s ease}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top{transition:transform .22s ease}
.top.hide{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 2px))}
.where{min-width:0;text-align:center;line-height:1.2}
.where .l1{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where .l2{font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.furi{justify-self:end;font-size:13px;color:var(--mute);padding:8px 6px}
.furi[aria-pressed="true"]{color:var(--accent)}
.prog{position:absolute;left:0;bottom:-.5px;height:1.5px;background:var(--accent);width:0;transition:width .2s;opacity:.7}

/* large title */
.lt{padding:8px 12px 0;max-width:760px;margin-inline:auto}
.lt .sub{font-size:12px;color:var(--mute)}
.lt h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}

/* feed */
main{padding-inline:12px;padding-block:0 110px;max-width:760px;margin-inline:auto}
.grp{font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.3;margin:16px 2px 6px;text-wrap:balance;scroll-margin-top:calc(var(--hdr) + 12px)}
.grp.d1{font-size:14px;margin-top:10px;color:var(--ink2)}
.row{margin-bottom:8px;scroll-margin-top:calc(var(--hdr) + 10px)}
.chips{display:flex;flex-wrap:wrap;gap:4px;width:fit-content;max-width:100%;margin-bottom:6px;padding:0;background:none;user-select:none;-webkit-user-select:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:1.28;padding:4px 10px;border-radius:11px;background:var(--card);color:var(--ink2);transition:background-color .2s ease}
.chip.on{background:var(--l1-bg);color:var(--accent);font-weight:600}
.chip.main{font-weight:600;color:var(--ink)}
.pager{display:flex;align-items:flex-start;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;margin-inline:-12px;padding-inline:12px;scroll-padding-inline:12px}
.pager::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;min-width:0;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:10px 13px 12px;position:relative;transition:opacity .2s}
.has-side .card{flex-basis:calc(100% - 20px)}
.eb{font-size:11.5px;line-height:1.4;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.eb .pt{color:var(--accent)}
.side .eb .pt{color:var(--mute)}
.eb .n{margin-left:auto;font-variant-numeric:tabular-nums}
.card h3{font-weight:600;font-size:16px;line-height:1.35;letter-spacing:-.01em;margin:2px 0 6px;text-wrap:balance}
.cbody{display:flex;flex-direction:column;gap:6px}
.cbody p{margin:0}
.cbody rt{font-size:.52em;color:var(--mute)}
.nofuri .cbody rt{display:none}
.slide{margin:0;background:var(--slide);border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.55;color:var(--ink2)}
.slide .ln:first-child{color:var(--ink)}
.lab{margin:3px 0 -4px;font-size:12px;color:var(--mute);font-weight:400;user-select:none;-webkit-user-select:none}
.notes{font-size:13.5px;color:var(--ink2);line-height:1.6}
.notes .ln{padding-left:calc(var(--in,0) * 1.2em)}
.box{background:var(--slide);border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.55;color:var(--ink2)}
.box .ln.in{padding-left:1em}
.cbody h5{font-size:13.5px;margin:3px 0 -3px;font-weight:600}
.cbody ul,.cbody ol{margin:0;padding-left:1.3em}
.cbody li.d1{margin-left:1.2em}.cbody li.d2{margin-left:2.4em}
.cbody code{font-family:var(--f-mono);font-size:.78em;color:var(--mute);background:var(--slide);border-radius:4px;padding:1px 5px;white-space:normal}
.wl{color:var(--accent)}
.tbl{overflow-x:auto;border-radius:12px;box-shadow:0 0 0 .5px var(--sep);background:var(--slide)}
.tbl table{border-collapse:collapse;font-size:12.5px;line-height:1.5;min-width:100%}
.tbl th,.tbl td{border-bottom:.5px solid var(--sep);padding:5px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--l1-bg);white-space:nowrap;font-weight:600}
.tbl tr:last-child td{border-bottom:0}

/* marks */
mark.m{background:none;border-radius:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-skip-ink:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.dig{color:var(--dig-line);text-decoration-color:var(--dig-line)}

@keyframes fl{50%{outline:2px solid var(--accent);outline-offset:2px}}
.g{font-weight:700}
.g.dig{color:var(--dig-line)}.g.key{color:var(--key-line)}

/* floating action bar (placed next to the selection by script) */
.bar{position:fixed;left:0;top:0;z-index:40;width:max-content;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s ease,visibility 0s .12s}
.bar.show{opacity:1;visibility:visible;transition:opacity .12s ease}
.bar .in{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);border:.5px solid var(--sep);border-radius:12px;padding:3px;user-select:none;-webkit-user-select:none}
.bb{display:grid;place-items:center;width:44px;height:30px;border-radius:9px;color:var(--ink2)}
.bar .in{padding:2px;gap:1px;border-radius:16px;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(24px) saturate(1.9) brightness(1.1);backdrop-filter:blur(24px) saturate(1.9) brightness(1.1)}
.bb{height:28px;width:40px;border-radius:14px}
.tb{width:18px;height:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar .in{background:rgba(70,70,74,.38);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9)}}
:root[data-theme="dark"] .bar .in{background:rgba(70,70,74,.38);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9)}
.bb.dig{color:var(--dig-line)}
.bb.key{color:var(--key-line)}
.bb.on,.bb:active{background:rgba(60,60,67,.16);-webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bb.on,:root:not([data-theme="light"]) .bb:active{background:rgba(255,255,255,.16)}}
:root[data-theme="dark"] .bb.on,:root[data-theme="dark"] .bb:active{background:rgba(255,255,255,.16)}
.bb[hidden],.dv[hidden]{display:none}
.dv{width:.5px;height:16px;background:var(--sep);margin-inline:4px}
.tb{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.tb .dot{fill:currentColor;stroke-width:1.9}
.tb .qt{font:400 18px/1 "Hiragino Sans","PingFang SC",-apple-system,system-ui,sans-serif;fill:currentColor;stroke:none}
.ic .ast{fill:none;stroke:var(--ic);stroke-width:3.4;stroke-linecap:round}
.ic .qi{font:800 21px/1 "Hiragino Sans","PingFang SC",-apple-system,system-ui,sans-serif;fill:var(--ic);stroke:none}


/* drawer */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:51;width:min(86vw,360px);background:var(--glass-w);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-right:.5px solid var(--sep)}
body.open .drawer{transform:none}
body.open .scrim{opacity:1;pointer-events:auto}
.dh{font-size:16px;font-weight:600;letter-spacing:-.01em;padding:10px 16px 4px}
.gl{background:var(--group);border-radius:8px;overflow:hidden;margin:0 10px}
.gl > *{position:relative}
.gl > * + *::before{content:"";position:absolute;left:12px;right:0;top:0;height:.5px;background:var(--sep)}
.lec{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px 8px 12px;line-height:1.3;transition:background-color .12s ease}
.lec .d{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none;width:2.4em}

.lec.on .t{color:var(--accent);font-weight:600}
.chev{width:8px;height:13px;flex:none;stroke:var(--mute);opacity:.6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:2px;margin:10px 10px 2px;padding:2px;border-radius:9px;background:var(--fill)}
.tab{flex:1;height:28px;border-radius:7px;font-size:13px}
.tab.on{background:var(--group);font-weight:600}
.pane{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 0 24px}
.o-g{font-weight:600;font-size:13.5px;color:var(--ink);padding:11px 14px 4px;line-height:1.35}
.o-g.d1{font-size:13px;color:var(--ink2);padding-top:7px}
.o-i{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 10px 7px 12px;font-size:13.5px;line-height:1.35;color:var(--ink);transition:background-color .12s ease}
.o-i.s{padding-left:26px;font-size:12.5px;color:var(--mute)}
.o-i.s::before{left:26px}
.o-i.done .tx{opacity:.4}
.o-i .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o-i.cur{background:var(--sel)}
.o-i.cur .tx{color:var(--accent);font-weight:600}
.cnt{display:flex;gap:6px;flex:none;font-size:12px;font-variant-numeric:tabular-nums}
.mk-h{font-weight:600;font-size:13.5px;padding:11px 14px 4px;display:flex;gap:6px;align-items:baseline}
.mk-h .n{font-weight:400;color:var(--mute);font-size:12.5px}
.mk{display:block;width:100%;text-align:left;padding:7px 10px 7px 12px;font-size:13.5px;line-height:1.5;transition:background-color .12s ease}
.mk:active,.o-i:active,.lec:active{background:var(--sel)}
.mk q{quotes:"“" "”"}
.mk small{display:block;color:var(--mute);font-size:11.5px;margin-top:1px}
.empty{color:var(--mute);font-size:13px;padding:12px 14px;line-height:1.7}
.foot{border-top:.5px solid var(--sep);padding:8px 14px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.foot .sp{flex:1}
.btn{font-size:14px;color:var(--accent);padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:color-mix(in srgb,var(--ink) 82%,transparent);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
#copyArea{position:fixed;left:-9999px;top:0;width:10px;height:10px}

/* SF-Symbols-style mark icons */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;display:inline-block}
.ic .bgf{fill:var(--ic)} .ic.st .bgf,.ic .st{stroke:var(--ic);stroke-width:1.6;stroke-linejoin:round}
.ic .fg{fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round} .ic .fgd{fill:#fff}
.ic .ln{fill:none;stroke:var(--ic);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.dig{--ic:var(--dig-ic)} .ic.key{--ic:var(--key-ic)} .ic.del{--ic:#D1444F}
.cnt{display:flex;gap:6px;align-items:center;flex:none;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.cnt span{display:inline-flex;align-items:center;gap:2px}
.cnt .ic{width:12px;height:12px}
.mk-h .ic{width:14px;height:14px;align-self:center}
.toast{display:flex;align-items:center;gap:6px}
.toast .ic{width:14px;height:14px}

/* read state */
/* guide bar + finished rows */
.guide{display:flex;align-items:center;gap:6px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:10;background:var(--bg);margin:0 -12px 1px;padding:4px 12px;transition:top .22s ease}
body:has(.top.hide) .guide{top:env(safe-area-inset-top,0px)}
.guide .chips{margin-bottom:0}
.gk{flex:none;width:26px;height:26px;display:grid;place-items:center;order:3;margin-left:auto;margin-right:-4px}
.guide .chips{order:1;min-width:0}
.tgl{order:2}
.gk svg{width:18px;height:18px}
.gk circle{fill:none;stroke:var(--mute);stroke-width:1.5;opacity:.7}
.gk path{fill:none;stroke:var(--card);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.done .gk circle{fill:var(--accent);stroke:var(--accent);opacity:1}
.row.done .gk path{opacity:1}
.tgl{display:none;flex:none;width:26px;height:26px;place-items:center;color:var(--mute)}
.tgl svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.row.done .tgl{display:grid}
.row.done .chips{opacity:.6}
.row.done:not(.collapsed) .tgl svg{transform:rotate(180deg)}
.row.collapsed .pager{display:none}
.row.collapsed{margin-bottom:6px}
/* per-card note */
/* typed at 16px (stops iOS zoom-on-focus), drawn at 14px via scale(.875) */
.nw{margin-top:9px;height:27px;overflow:hidden;border-radius:10px;background:var(--slide)}
.nw:focus-within{box-shadow:inset 0 0 0 1px var(--accent)}
.note{display:block;width:114.2857%;height:31px;margin:0;padding:5.5px 10.3px;border:0;background:transparent;color:color-mix(in srgb,var(--ink) 58%,var(--bg));font:inherit;font-size:16px;line-height:20px;resize:none;overflow:hidden;outline:none;transform:scale(.875);transform-origin:0 0}
@media (min-width:760px){
  .has-side .card{flex-basis:calc(50% - 4px)}
  main,.lt{max-width:1060px}
}
@media (min-width:1100px){
  .drawer{transform:none}
  .scrim{display:none}
  body{padding-left:340px}
  .top{margin-left:-340px;padding-left:346px}
  #menuBtn{visibility:hidden}
}

</style>

  <div class="where"><div class="l1" id="w1"></div><div class="l2" id="w2"></div></div>

</header>

</nav>

  <span class="dv" id="dv" hidden></span>
  <button class="bb del" data-act="del" id="delBtn" aria-label="Delete" hidden><svg class="tb" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9.8 7V5.3h4.4V7M7 7l.8 11.3c.1.9.8 1.5 1.6 1.5h5.2c.9 0 1.6-.6 1.6-1.5L17 7M10.4 10.5v6M13.6 10.5v6"/></svg></button>

<script type="application/json" id="data">{"lectures":[{"id":"0928-kimura","date":"9/28","title":"条例・自治法研究（木村）","outline":[{"t":"g","label":"条例の位置づけ","depth":0},{"t":"r","main":"条例と法律","sides":["民泊","ヘイトスピーチ","うろつき規制"]},{"t":"r","main":"委任条例と自主条例","sides":["空き家対策","ごみ屋敷対策","危険ドラッグ"]},{"t":"r","main":"概括授権と制限列挙","sides":["まちづくり条例","地方制度調査会"]},{"t":"g","label":"法による介入","depth":0},{"t":"r","main":"政策法務","sides":["品川マンション事件","首長・議員ハラスメント","太陽光発電"]},{"t":"r","main":"行政法の必要性","sides":["放置自転車","ポイ捨て・路上喫煙","渋谷区 ごみ箱義務化","鳥害・餌やり","カスハラ防止"]},{"t":"r","main":"政策手段","sides":["宿泊税"]},{"t":"g","label":"行政・規制の分類","depth":0},{"t":"r","main":"規制行政・給付行政","sides":["犯罪被害者支援"]},{"t":"r","main":"経済的・社会的規制","sides":["客引き禁止","渋谷区 路上飲酒","香川県ゲーム条例"]},{"t":"g","label":"規制の拡大と限界","depth":0},{"t":"r","main":"行政国家化","sides":["エスカレーター条例","不正受給の通報"]},{"t":"r","main":"平等原則","sides":["二重価格"]}],"cards":{"条例と法律":{"id":"条例と法律","h":"条例と法律","part":"重要概念展开","sect":"条例の位置づけ","blocks":["<p>憲法94条は地方公共団体に「法律の範囲内で条例を制定する」<ruby>権能<rt>けんのう<\/rt><\/ruby>を認めていて、地方自治法14条1項も「法令に違反しない限りにおいて」条例を制定できると定めている。つまり条例は法律より下位にあるけれど、住民の権利を制限し義務を課すことができる点では法律と同じ種類の法<ruby>規範<rt>きはん<\/rt><\/ruby>になる。地方自治法14条2項は「義務を課し、又は権利を制限するには……条例によらなければならない」と定めていて、これが<b>侵害<ruby>留保<rt>りゅうほ<\/rt><\/ruby><\/b>の自治体版にあたる。規則（<ruby>首長<rt>しゅちょう<\/rt><\/ruby>が定めるもの）ではできず、議会の<ruby>議決<rt>ぎけつ<\/rt><\/ruby>を経た条例が必要。<\/p>","<p><ruby>罰則<rt>ばっそく<\/rt><\/ruby>についても14条3項で、条例に「2年以下の懲役（2025年6月以降は<ruby>拘禁<rt>こうきん<\/rt><\/ruby>刑）若しくは<ruby>禁錮<rt>きんこ<\/rt><\/ruby>、100万円以下の罰金、<ruby>拘留<rt>こうりゅう<\/rt><\/ruby>、<ruby>科料<rt>かりょう<\/rt><\/ruby>若しくは没収の刑又は5万円以下の<ruby>過料<rt>かりょう<\/rt><\/ruby>」を科す規定を置けるとされている。<ruby>刑罰<rt>けいばつ<\/rt><\/ruby>は本来「法律」で定めるもの（罪刑<ruby>法定<rt>ほうてい<\/rt><\/ruby>主義、憲法31条）だけど、条例は住民代表の議会が作る民主的な法なので許される、というのが<ruby>判例<rt>はんれい<\/rt><\/ruby>（<ruby>大阪<rt>おおさか<\/rt><\/ruby>市売春<ruby>取締<rt>とりしまり<\/rt><\/ruby>条例事件、<ruby>最大判<rt>さいだいはん<\/rt><\/ruby>1962年）。<\/p>","<p>条例が法律に反するかどうかの判断基準としては<b><ruby>徳島<rt>とくしま<\/rt><\/ruby>市公安条例事件(<ruby>最大判<rt>さいだいはん<\/rt><\/ruby>1975年9月10日)<\/b>が基本<ruby>判例<rt>はんれい<\/rt><\/ruby>で、「両者の対象事項と規定<ruby>文言<rt>もんごん<\/rt><\/ruby>を対比するのみでなく、それぞれの趣旨、目的、内容及び効果を比較し、両者の間に矛盾<ruby>抵触<rt>ていしょく<\/rt><\/ruby>があるかどうかによってこれを決しなければならない」とした。ここから、国の法律が「全国一律の最低基準」を定める趣旨なら、自治体がそれより厳しい規制（<b><ruby>上乗<rt>うわの<\/rt><\/ruby>せ条例<\/b>）や対象を広げる規制（<b>横出し条例<\/b>）を置くことが許される余地が出てくる。<ruby>民泊<rt>みんぱく<\/rt><\/ruby>や空き家の話はまさにこの問題。<\/p>"]},"民泊":{"id":"民泊","h":"民泊","part":"事例展开","sect":"営業の自由","blocks":["<p>2018年6月施行の<b>住宅宿泊事業法(<ruby>民泊<rt>みんぱく<\/rt><\/ruby><ruby>新法<rt>しんぽう<\/rt><\/ruby>)<\/b>で、国は年間180日以内の営業を認め、インバウンド拡大のため<ruby>民泊<rt>みんぱく<\/rt><\/ruby>を全国的に解禁した（規制緩和）。一方で18条に基づき自治体は条例で区域・期間を制限でき、<ruby>京都<rt>きょうと<\/rt><\/ruby>市（住居専用地域では1〜3月のみ）、<ruby>新宿<rt>しんじゅく<\/rt><\/ruby>区（住居専用地域では平日禁止）など厳しい<ruby>上乗<rt>うわの<\/rt><\/ruby>せ規制をかける自治体が多い。近年も騒音・ゴミ・違法営業への住民の警戒感は強く、規制強化が続いている。<\/p>","<ul><li class=\"d0\"><b><ruby>大阪<rt>おおさか<\/rt><\/ruby>市<\/b>：国家戦略<ruby>特区<rt>とっく<\/rt><\/ruby>による「<ruby>特区<rt>とっく<\/rt><\/ruby><ruby>民泊<rt>みんぱく<\/rt><\/ruby>」（全国の<ruby>特区<rt>とっく<\/rt><\/ruby><ruby>民泊<rt>みんぱく<\/rt><\/ruby>の大半が<ruby>大阪<rt>おおさか<\/rt><\/ruby>市に集中）について、<b>2026年5月29日で新規受付を停止<\/b>。既存施設は「迷惑<ruby>民泊<rt>みんぱく<\/rt><\/ruby><ruby>根絶<rt>こんぜつ<\/rt><\/ruby>チーム」で監視・指導を強化。<\/li><li class=\"d0\"><b><ruby>豊島<rt>としま<\/rt><\/ruby>区<\/b>：2025年に住宅宿泊事業の条例を改正し、営業期間を<b>春・夏・冬休みを中心とした年間120日程度<\/b>に限定（法律上の上限180日から大きく削減）、住居専用地域での新規開設も制限。<b>既存の事業者にも適用<\/b>される（1年の経過措置の後、2026年12月から）点が「遡及的」と議論を呼んだ。当初案は84日だったが、意見を受けて120日に緩和。開業時の住民説明の義務化なども含む。<\/li><li class=\"d0\"><ruby>墨田<rt>すみだ<\/rt><\/ruby>区なども<ruby>上乗<rt>うわの<\/rt><\/ruby>せ規制を検討・実施。<b>国の規制緩和 ⇔ 自治体の規制強化<\/b>という構図がはっきり出る事例。<\/li><\/ul>"]},"ヘイトスピーチ":{"id":"ヘイトスピーチ","h":"ヘイトスピーチ","part":"事例展开","sect":"表現の自由・人権","blocks":["<p>国の<b>ヘイトスピーチ解消法<\/b>（2016年）は<ruby>罰則<rt>ばっそく<\/rt><\/ruby>のない理念法にとどまった。<ruby>大阪<rt>おおさか<\/rt><\/ruby>市は2016年に全国初の対処条例を作り、表現内容の認定と氏名の公表を定めた。<b><ruby>川崎<rt>かわさき<\/rt><\/ruby>市「差別のない人権尊重のまちづくり条例」<\/b>（2019年12月成立、2020年7月全面施行）は、公共の場での特定のヘイトスピーチを繰り返した者に<b>刑事罰(最高50万円の罰金)<\/b>を科す、全国初の条例になった。<ruby>東京<rt>とうきょう<\/rt><\/ruby>都も2018年に人権尊重条例を作った（<ruby>罰則<rt>ばっそく<\/rt><\/ruby>なし）。日本は<b>表現の自由(憲法21条)<\/b>の保障に慎重なので、<ruby>刑罰<rt>けいばつ<\/rt><\/ruby>を伴う規制は極めて限定的な形でしか導入されていない。<\/p>"]},"うろつき規制":{"id":"うろつき規制","h":"うろつき規制","part":"事例展开","sect":"表現の自由・人権","blocks":["<p><ruby>東京<rt>とうきょう<\/rt><\/ruby>都の迷惑防止条例は改正を重ねていて、つきまとい行為の類型として「住居等の付近において<ruby>見張<rt>みは<\/rt><\/ruby>りをし、又はみだりにうろつくこと」などを規制している（ストーカー規制法も2021年改正で「うろつき」を追加）。「うろつく」は日常的な行為と区別しにくく、<b>何を規制しているのか曖昧になりやすい<\/b>。<ruby>刑罰<rt>けいばつ<\/rt><\/ruby><ruby>法規<rt>ほうき<\/rt><\/ruby>は<b>明確性の原則<\/b>が求められるので、人権的観点から要件の書き方に慎重さが必要、という論点。<\/p>"]},"委任条例と自主条例":{"id":"委任条例と自主条例","h":"委任条例と自主条例","part":"重要概念展开","sect":"条例の位置づけ","blocks":["<p><b><ruby>委任<rt>いにん<\/rt><\/ruby>条例<\/b>は、法律が「条例で定める」と明示的に委ねた事項を定める条例。例えば住宅宿泊事業法18条は、生活環境の悪化を防ぐため条例で<ruby>民泊<rt>みんぱく<\/rt><\/ruby>の実施区域・期間を制限できると定めていて、各自治体の<ruby>民泊<rt>みんぱく<\/rt><\/ruby>条例はこれに基づく<ruby>委任<rt>いにん<\/rt><\/ruby>条例になる。<\/p>","<p><b>自主条例<\/b>は、法律の<ruby>委任<rt>いにん<\/rt><\/ruby>なしに、自治体が自らの事務について独自に制定する条例。法律がまだない分野で問題が先に起きたとき、自治体が先行して対応する手段になる。代表例が<b>空き家対策条例<\/b>で、<ruby>埼玉<rt>さいたま<\/rt><\/ruby>県<ruby>所沢<rt>ところざわ<\/rt><\/ruby>市が2010年に制定したのを皮切りに全国に広がり、その後、国が2014年に<b><ruby>空家<rt>あきや<\/rt><\/ruby>等対策の推進に関する特別措置法<\/b>を作った。つまり<b>自治体の自主条例が国の<ruby>立法<rt>りっぽう<\/rt><\/ruby>を先導した<\/b>ケース。危険ドラッグや犯罪被害者支援も似た構図がある。<\/p>"]},"空き家対策":{"id":"空き家対策","h":"空き家対策","part":"事例展开","sect":"財産権","blocks":["<p><ruby>所沢<rt>ところざわ<\/rt><\/ruby>市（2010年）を先駆けに、管理不全の空き家に対して所有者への指導・勧告・命令・公表、場合によっては代執行を定める自主条例が全国に広がり、2014年に<b><ruby>空家<rt>あきや<\/rt><\/ruby>等対策の推進に関する特別措置法<\/b>ができた（倒壊のおそれなどがある「特定空家等」に対し、助言・指導→勧告→命令→代執行。勧告を受けると固定資産税の住宅用地<ruby>特例<rt>とくれい<\/rt><\/ruby>が外れる）。2023年改正では、特定<ruby>空家<rt>あきや<\/rt><\/ruby>になる前段階の「管理不全<ruby>空家<rt>あきや<\/rt><\/ruby>」にも指導・勧告ができるようになった。<br>論点は、空き家は放置されていても所有者の財産であり、行政がどこまで手を出せるかという<b>財産権(憲法29条)<\/b>との調整。シラバスの第10回「財産権に対する規制と条例（行政は個人の財産にどこまで関与すべきか？）」がこのテーマ。<\/p>"]},"ごみ屋敷対策":{"id":"ごみ屋敷対策","h":"ごみ屋敷対策","part":"事例展开","sect":"財産権","blocks":["<p>住宅に大量のごみや物をため込み、悪臭・害虫・火災の危険で近隣に迷惑をかける「ごみ屋敷」に対処する条例。全国法がないので、完全に<b>自主条例<\/b>の領域。<ruby>足立<rt>あだち<\/rt><\/ruby>区「生活環境の保全に関する条例」（2013年）、<ruby>京都<rt>きょうと<\/rt><\/ruby>市「不良な生活環境を解消するための支援及び措置に関する条例」（2014年）などが代表例で、調査・指導・勧告・命令・代執行の手続を定める。<br>最大の難しさは、住人が「これはゴミではなく自分の財産だ」と主張すること。廃棄物かどうかの判断は、物の<ruby>性状<rt>せいじょう<\/rt><\/ruby>や<ruby>占有<rt>せんゆう<\/rt><\/ruby>者の意思などを総合的に見て決まる（おから事件、<ruby>最決<rt>さいけつ<\/rt><\/ruby>1999年）ので、行政が一方的に「ゴミ」と認定して撤去すると財産権侵害になりうる。また、ため込みの背景に住人の孤立や生活困難があることも多いので、<ruby>京都<rt>きょうと<\/rt><\/ruby>市の条例は名前のとおり<b>規制だけでなく福祉的な<\/b>「<b>支援<\/b>」を前面に出している。空き家と同じく財産権がテーマだけど、相手が「そこに住んでいる人」である点で、福祉との接点が大きいのが特徴。<\/p>"]},"危険ドラッグ":{"id":"危険ドラッグ","h":"危険ドラッグ","part":"事例展开","sect":"法の空白を埋める","blocks":["<p>合法ハーブなどと称して売られた危険ドラッグは、化学構造を少し変えるだけで法律の規制をすり抜けたため、<b>法律が<ruby>白地<rt>しらじ<\/rt><\/ruby>（空白）状態<\/b>になっていた。<ruby>東京<rt>とうきょう<\/rt><\/ruby>都は2005年に<b>薬物<ruby>濫用<rt>らんよう<\/rt><\/ruby>防止条例<\/b>を作り、知事指定薬物として国より先に規制した。2014年6月に<ruby>東京<rt>とうきょう<\/rt><\/ruby>・<ruby>池袋<rt>いけぶくろ<\/rt><\/ruby>で危険ドラッグを吸った運転者の暴走事故が起き、国も<ruby>包括<rt>ほうかつ<\/rt><\/ruby>指定・指定薬物の所持規制強化・販売店への検査命令などを進め、2015年頃までに店舗はほぼ<ruby>根絶<rt>こんぜつ<\/rt><\/ruby>された。⚠ 笔记里的「<ruby>秋葉原<rt>あきはばら<\/rt><\/ruby>」可能是听错成<ruby>池袋<rt>いけぶくろ<\/rt><\/ruby>，或者老师另举了秋叶原的销售店铺为例。<b>法律の空白を自治体の条例が先に埋める<\/b>という自主条例の意義を示す例。<\/p>"]},"概括授権と制限列挙":{"id":"概括授権と制限列挙","h":"概括授権と制限列挙","part":"重要概念展开","sect":"条例の位置づけ","blocks":["<p>自治体にどこまで仕事を任せるかについて、大きく二つの方式がある。<\/p>","<p><b>制限<ruby>列挙<rt>れっきょ<\/rt><\/ruby>方式<\/b>（イギリス型）では、議会が法律で個別に<ruby>授権<rt>じゅけん<\/rt><\/ruby>した事務しか自治体は行えない。<ruby>授権<rt>じゅけん<\/rt><\/ruby>の範囲を超えた行為は<b><ruby>越権<rt>えっけん<\/rt><\/ruby>(ultra vires)<\/b>として無効になる。イギリスでは2011年のLocalism Actで「一般的権能（general power of competence）」が導入されてこの原則は大きく緩和されたけど、伝統的にはこの型の代表。<\/p>","<p><b><ruby>概括<rt>がいかつ<\/rt><\/ruby><ruby>授権<rt>じゅけん<\/rt><\/ruby>方式<\/b>（大陸型、フランス・ドイツ）では、「地域の事務」を<ruby>包括<rt>ほうかつ<\/rt><\/ruby>的に自治体に委ね、法律で禁止されたり国の<ruby>専管<rt>せんかん<\/rt><\/ruby>とされたりしない限り、自治体は地域の課題に広く取り組める。日本の地方自治法2条2項（「地域における事務及びその他の事務で法律又はこれに基づく<ruby>政令<rt>せいれい<\/rt><\/ruby>により処理することとされるもの」）はこの型に属する。<\/p>","<p>講義で自治体の規模に触れたのは、ドイツやフランスには人口数百人〜千人程度の小さな基礎自治体が大量に残っている（ドイツのゲマインデは約1万1千、フランスのコミューンは約3万5千）のに対し、日本は平成の大合併を経て1,718市町村（<ruby>東京<rt>とうきょう<\/rt><\/ruby>23区を除く）まで減り、1自治体あたり平均7万人超という国際的にも大きい規模になっている、という対比。規模が大きいぶん、日本の市町村は一つひとつが幅広い事務を担う力をもっている、という話につながる。（補足：ドイツ全体の平均はおよそ7〜8千人だけど、ラインラント＝プファルツ州などは数百人規模の村が大半を占めるので、講義の「800人」はそういう典型的な小規模ゲマインデのイメージだと思われる。）<\/p>"]},"まちづくり条例":{"id":"まちづくり条例","h":"まちづくり条例","part":"事例展开","sect":"財産権","blocks":["<p>都市計画法など国の法律だけでは拾いきれない地域の景観・開発の問題に、住民参加の手続（計画段階での説明会、住民協議など）を条例で組み込むもの。<ruby>神奈川<rt>かながわ<\/rt><\/ruby>県<ruby>真鶴<rt>まなづる<\/rt><\/ruby>町の「美の条例」（1993年）などが有名。<\/p>"]},"地方制度調査会":{"id":"地方制度調査会","h":"地方制度調査会","part":"事例展开","sect":"制度・議会・監視","blocks":["<p>内閣総理大臣の<ruby>諮問<rt>しもん<\/rt><\/ruby>機関で、地方自治制度の改正方針を審議する。第33次（2022〜2023年）の答申が、<b>大規模災害・感染症などの非常時に国が自治体に補充的な指示を出せる仕組み<\/b>や、<b>DXと自治体間の連携<\/b>を提言し、これを受けて2024年に地方自治法が改正された（国の補充的指示権の創設、情報システムの適正な利用に関する規定など）。現在は第34次が審議中 ⚠。デジタル行政を研究テーマにする立場からは、この答申と2024年改正はフォローしておく価値がある。<\/p>"]},"政策法務":{"id":"政策法務","h":"政策法務","part":"重要概念展开","sect":"法による介入","blocks":["<p>政策<ruby>法務<rt>ほうむ<\/rt><\/ruby>は1990年代以降、自治体<ruby>法務<rt>ほうむ<\/rt><\/ruby>の分野で広まった考え方で、法を「国から与えられたものを解釈・執行する対象」として受け身に扱うのをやめて、地域の課題を解決するための<b>政策手段として設計する<\/b>ことに主眼を置く。一般に次の段階に分けて整理される。<\/p>","<ul><li class=\"d0\"><b><ruby>立法<rt>りっぽう<\/rt><\/ruby><ruby>法務<rt>ほうむ<\/rt><\/ruby><\/b>：条例をどう設計するか（目的、対象、手法、<ruby>罰則<rt>ばっそく<\/rt><\/ruby>の有無）<\/li><li class=\"d0\"><b>執行<ruby>法務<rt>ほうむ<\/rt><\/ruby><\/b>（解釈運用<ruby>法務<rt>ほうむ<\/rt><\/ruby>）：条例・法律をどう運用するか（指導、勧告、命令、公表など）<\/li><li class=\"d0\"><b>評価・<ruby>争訟<rt>そうしょう<\/rt><\/ruby><ruby>法務<rt>ほうむ<\/rt><\/ruby><\/b>：運用の結果を評価し、改正につなげる。訴訟リスクへの対応も含む<\/li><\/ul>","<p>2000年の<b>地方<ruby>分権<rt>ぶんけん<\/rt><\/ruby>一括法<\/b>で機関<ruby>委任<rt>いにん<\/rt><\/ruby>事務が廃止され、自治体の事務はすべて自治事務か<ruby>法定<rt>ほうてい<\/rt><\/ruby><ruby>受託<rt>じゅたく<\/rt><\/ruby>事務になった。これで法律の解釈を自治体自身がする余地が広がり、条例制定権の範囲も広がったことが、政策<ruby>法務<rt>ほうむ<\/rt><\/ruby>が重視されるようになった背景。元総務省の講師が「条例の改正運用」に重点を置いているのは、作って終わりにせず、運用しながら直していくサイクルまで含めて見ているからだと思われる。<\/p>"]},"首長・議員ハラスメント":{"id":"首長・議員ハラスメント","h":"首長・議員ハラスメント","part":"事例展开","sect":"制度・議会・監視","blocks":["<p>職員に対するハラスメント対策は、一般職については人事院規則や各自治体の規則で整備されているけど、<b><ruby>首長<rt>しゅちょう<\/rt><\/ruby>や議員は特別職なので、これらの規則の対象外<\/b>になってしまう。この穴を条例で埋めようとする動きが広がっている。<\/p>","<ul><li class=\"d0\"><b>議員を対象とする条例<\/b>：<b><ruby>福岡<rt>ふくおか<\/rt><\/ruby>県「<ruby>福岡<rt>ふくおか<\/rt><\/ruby>県における議会関係ハラスメントを<ruby>根絶<rt>こんぜつ<\/rt><\/ruby>するための条例」<\/b>（2022年6月成立）は、県議会だけでなく<ruby>市町村議<rt>しちょうそんぎ<\/rt><\/ruby>会の議員も対象にし、研修や外部有識者による相談窓口を定めた都道府県初の例。ただし<ruby>首長<rt>しゅちょう<\/rt><\/ruby>は対象外。<\/li><li class=\"d0\"><b><ruby>首長<rt>しゅちょう<\/rt><\/ruby>を対象とする条例<\/b>：<ruby>東京<rt>とうきょう<\/rt><\/ruby>都<ruby>狛江<rt>こまえ<\/rt><\/ruby>市が、前市長のセクハラ問題をきっかけに、市長・副市長・教育長・議員を対象に第三者委員会による調査や結果の公表を定めた条例を作り、その後全国に広がった。<ruby>首長<rt>しゅちょう<\/rt><\/ruby>を対象に含む条例は50程度とされる（<ruby>福岡<rt>ふくおか<\/rt><\/ruby>県内では<ruby>小郡<rt>おごおり<\/rt><\/ruby>市など）。2024年の<ruby>兵庫<rt>ひょうご<\/rt><\/ruby>県知事のパワハラ疑惑問題以降、関心が一段と高まった。<\/li><li class=\"d0\"><b><ruby>福岡<rt>ふくおか<\/rt><\/ruby>県内の最近の事例<\/b>：<b><ruby>田川<rt>たがわ<\/rt><\/ruby>市<\/b>では、市の第三者委員会が2026年5月に村上卓哉市長の女性職員へのセクハラ行為を認定し、市長は5月31日付で辞職、7月に出直し市長選が行われた。<ruby>築上<rt>ちくじょう<\/rt><\/ruby>郡<b><ruby>吉富<rt>よしとみ<\/rt><\/ruby>町<\/b>でも、町幹部からのハラスメントが職員に深刻な影響を与えたとして第三者委員会が調査し、2025年2月に報告書を公表している。西日本新聞も「<ruby>首長<rt>しゅちょう<\/rt><\/ruby>のハラスメントを条例で規制　対象外から一転、<ruby>福岡<rt>ふくおか<\/rt><\/ruby>でも」と報じていて、<ruby>福岡<rt>ふくおか<\/rt><\/ruby>県内でも<ruby>首長<rt>しゅちょう<\/rt><\/ruby>を条例の対象に含める動きが出ている。<\/li><li class=\"d0\">論点：<ruby>首長<rt>しゅちょう<\/rt><\/ruby>は選挙で選ばれ、辞めさせる手段は不<ruby>信任<rt>しんにん<\/rt><\/ruby><ruby>議決<rt>ぎけつ<\/rt><\/ruby>かリコールしかない。条例で第三者調査・公表の仕組みを作っても、最終的な責任の取り方は政治に委ねられる、という限界がある。<\/li><\/ul>"]},"太陽光発電":{"id":"太陽光発電","h":"太陽光発電","part":"事例展开","sect":"外部不経済","blocks":["<p>二つの方向がある。一つは規制型で、メガソーラーの乱開発による土砂災害・景観破壊への懸念から、<ruby>山梨<rt>やまなし<\/rt><\/ruby>県（2021年）などが設置を許可制にしたり、区域を制限したりする条例を作っている。もう一つは促進型で、<ruby>東京<rt>とうきょう<\/rt><\/ruby>都は2025年4月から新築住宅への太陽光パネル設置を大手住宅メーカーに義務づけた。同じ「太陽光」でも規制と誘導の両面から条例が使われている。<\/p>"]},"行政法の必要性":{"id":"行政法の必要性","h":"行政法の必要性","part":"重要概念展开","sect":"法による介入","blocks":["<p>民事法は私人間の紛争を、被害者が訴えることで<ruby>事後<rt>じご<\/rt><\/ruby>的に解決する仕組みで、刑事法は重大な違法行為を国家が処罰する仕組み。どちらも基本的に<b>事後的・個別的<\/b>。行政法（とそれを具体化する条例）は、講義で挙がった三つの理由でその隙間を埋める。<\/p>","<p><b><ruby>性悪説<rt>せいあくせつ<\/rt><\/ruby><\/b>の部分は、自発的な協力に期待できないならルールと強制手段を用意しておく必要がある、ということ。<\/p>","<p><b><ruby>軽微<rt>けいび<\/rt><\/ruby>・累積的被害<\/b>は、一件一件は訴訟を起こすほどではないけれど、<ruby>集積<rt>しゅうせき<\/rt><\/ruby>すると深刻になる被害を指す。路上駐車一台では誰も訴えないが、全体で交通が麻痺する。工場一つの<ruby>排煙<rt>はいえん<\/rt><\/ruby>はわずかでも、地域全体で<ruby>公害<rt>こうがい<\/rt><\/ruby>になる。個々の被害者が訴えるインセンティブが弱く、<ruby>因果<rt>いんが<\/rt><\/ruby>関係の<ruby>立証<rt>りっしょう<\/rt><\/ruby>も難しいので、民事ではカバーできず、事前に基準を決めて予防する行政規制が必要になる。<\/p>","<p><b>外部不経済の<ruby>是正<rt>ぜせい<\/rt><\/ruby><\/b>は経済学の概念で、ある主体の行動が市場を通さずに第三者にコストを負わせている状態（騒音、ゴミ、景観破壊、混雑など）を指す。市場に任せるとこのコストが価格に反映されず過剰に生み出されるので、規制や課税で行為者に負担させる（内部化する）。宿泊税やオーバーツーリズム対策の二重料金もこの論理で説明できる。<\/p>"]},"放置自転車":{"id":"放置自転車","h":"放置自転車","part":"事例展开","sect":"外部不経済","blocks":["<p>1970〜80年代、駅前の放置自転車は深刻な社会問題になり、1980年に「自転車の安全利用の促進及び自転車駐車場の整備に関する法律」（自転車法）ができ、各自治体が放置禁止区域の指定と撤去を定める条例を制定した。<b><ruby>駐輪<rt>ちゅうりん<\/rt><\/ruby>場の整備(給付)＋放置の規制(規制)<\/b>を組み合わせて改善した例。<\/p>"]},"ポイ捨て・路上喫煙":{"id":"ポイ捨て・路上喫煙","h":"ポイ捨て・路上喫煙","part":"事例展开","sect":"外部不経済","blocks":["<p><ruby>千代田<rt>ちよだ<\/rt><\/ruby>区の「安全で快適な<ruby>千代田<rt>ちよだ<\/rt><\/ruby>区の生活環境の整備に関する条例」（2002年）が、路上喫煙に<b><ruby>過料<rt>かりょう<\/rt><\/ruby><\/b>を科す仕組みで全国的に知られるようになった。一件一件は<ruby>軽微<rt>けいび<\/rt><\/ruby>な迷惑行為を、行政罰（<ruby>過料<rt>かりょう<\/rt><\/ruby>）で抑える典型。<\/p>"]},"渋谷区 ごみ箱義務化":{"id":"渋谷区 ごみ箱義務化","h":"渋谷区 ごみ箱義務化","part":"事例展开","sect":"外部不経済","blocks":["<p>「きれいなまち<ruby>渋谷<rt>しぶや<\/rt><\/ruby>をみんなでつくる条例」を改正（2025年12月、区議会で<ruby>全会<rt>ぜんかい<\/rt><\/ruby>一致可決）し、2026年4月施行、<ruby>過料<rt>かりょう<\/rt><\/ruby>の適用は6月から。<\/p>","<ul><li class=\"d0\"><b>ごみ箱の設置義務<\/b>：<ruby>渋谷<rt>しぶや<\/rt><\/ruby>・<ruby>原宿<rt>はらじゅく<\/rt><\/ruby>・<ruby>恵比寿<rt>えびす<\/rt><\/ruby>エリアの指定区域で飲食料を売る店舗（コンビニ、カフェ、ファストフード、キッチンカーなど）と、区内全域の自動販売機に、売った商品のごみを捨てられる回収容器の設置と管理を義務づける。従わない場合は勧告→命令→公表→<b><ruby>過料<rt>かりょう<\/rt><\/ruby>5万円<\/b>。<\/li><li class=\"d0\"><b>ポイ捨て<\/b>：区内全域で禁止し、<b><ruby>過料<rt>かりょう<\/rt><\/ruby>2,000円<\/b>。<\/li><li class=\"d0\">背景：コロナ後の来街者の急増でポイ捨てが深刻化し、区長は「従来の美化啓発活動だけでは健全な環境維持が難しい」と説明。<\/li><li class=\"d0\">賛否：「ごみ箱は区が置くべきで、行政の仕事を民間事業者に丸投げしている」という批判がある一方、<ruby>表参道<rt>おもてさんどう<\/rt><\/ruby>では広告付きごみ箱の導入も検討されている。コストを誰が負担するか（<b>原因者負担<\/b>）という論点で、講義の外部不経済の<ruby>是正<rt>ぜせい<\/rt><\/ruby>の話と直結する。<\/li><\/ul>"]},"鳥害・餌やり":{"id":"鳥害・餌やり","h":"鳥害・餌やり","part":"事例展开","sect":"私生活への介入","blocks":["<p>カラス・ハトへの餌やりによる糞害・騒音に対し、<ruby>荒川<rt>あらかわ<\/rt><\/ruby>区などが餌やり行為を規制する条例を置いている。個人の善意の行為が周囲に外部不経済を生む例。<\/p>"]},"カスハラ防止":{"id":"カスハラ防止","h":"カスハラ防止","part":"事例展开","sect":"法の空白を埋める","blocks":["<p><b><ruby>東京<rt>とうきょう<\/rt><\/ruby>都カスタマー・ハラスメント防止条例<\/b>が2024年10月に成立、2025年4月に施行され、全国初のカスハラ防止条例になった。<ruby>罰則<rt>ばっそく<\/rt><\/ruby>はなく、「何人も、あらゆる場において、カスタマー・ハラスメントを行ってはならない」という禁止規定と、事業者・行政の<ruby>責務<rt>せきむ<\/rt><\/ruby>を定める理念型の条例。<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>、<ruby>群馬<rt>ぐんま<\/rt><\/ruby>県なども続いた。国も2025年に労働施策総合推進法を改正し、事業者にカスハラ対策を義務づけた ⚠。講義の論点は、カスハラ一件一件は民事訴訟になじまず、刑事事件になるほどでもないので、条例で行為<ruby>規範<rt>きはん<\/rt><\/ruby>を示すしかない、というところ。<\/p>"]},"政策手段":{"id":"政策手段","h":"政策手段","part":"重要概念展开","sect":"法による介入","blocks":["<p>講義では「規制が一番強力」とされた。行政学や公共政策論の教科書でよく使われる分類だと、政策手段はおおむね次のように分けられる。<\/p>","<div class=\"tbl\"><table><tr><th>手段<\/th><th>内容<\/th><th>講義中の例<\/th><\/tr><tr><td>規制（{法規<\/td><td>ほうき}）<\/td><td>禁止・許可・命令で行為を直接コントロール<\/td><td>{客引<\/td><td>きゃくひ}き禁止、路上飲酒禁止、{民泊<\/td><td>みんぱく}の区域制限<\/td><\/tr><tr><td>経済的手法（負担）<\/td><td>課税・{課徴<\/td><td>かちょう}金で行為のコストを上げる<\/td><td>宿泊税、二重料金<\/td><\/tr><tr><td>経済的手法（{便益<\/td><td>べんえき}）<\/td><td>補助金・融資で望ましい行為を促す<\/td><td>融資、高校無償化<\/td><\/tr><tr><td>直接供給<\/td><td>行政が自らサービスや施設を提供<\/td><td>{駐輪<\/td><td>ちゅうりん}場の設置、博物館・動物園<\/td><\/tr><tr><td>情報・啓発<\/td><td>情報提供、努力義務、モラルへの訴え<\/td><td>エスカレーター条例、ゲーム条例<\/td><\/tr><\/table><\/div>","<p>規制は強制力があるぶん、<b>営業の自由・財産権・表現の自由<\/b>などの人権と衝突しやすい。だから「最も強力」である一方、使うときは比例原則（目的に対して必要最小限か）を意識する必要がある。今日の講義後半の事例は、ほとんどがこの緊張関係をめぐるもの。<\/p>"]},"宿泊税":{"id":"宿泊税","h":"宿泊税","part":"事例展开","sect":"課税・料金","blocks":["<p><ruby>東京<rt>とうきょう<\/rt><\/ruby>都が2002年に導入したのが最初で、その後<ruby>大阪<rt>おおさか<\/rt><\/ruby>府、<ruby>京都<rt>きょうと<\/rt><\/ruby>市、<ruby>金沢<rt>かなざわ<\/rt><\/ruby>市、<ruby>福岡<rt>ふくおか<\/rt><\/ruby>県・<ruby>福岡<rt>ふくおか<\/rt><\/ruby>市、<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>の<ruby>倶知安<rt>くっちゃん<\/rt><\/ruby>町などに広がった。地方税法上の<b>法定外目的税<\/b>で、総務大臣の同意を得て条例で導入する。<ruby>京都<rt>きょうと<\/rt><\/ruby>市は2026年3月から最高税額を1泊1万円に引き上げる ⚠。オーバーツーリズム対策の<ruby>財源<rt>ざいげん<\/rt><\/ruby>として、課税という政策手段の代表例。<\/p>"]},"規制行政・給付行政":{"id":"規制行政・給付行政","h":"規制行政・給付行政","part":"重要概念展开","sect":"行政・規制の分類","blocks":["<p><b>規制行政<\/b>は、国民の権利を制限し義務を課す行政（許可、禁止、命令など）。法律（条例）の根拠が厳格に求められる。<br><b>給付行政<\/b>は、国民に<ruby>便益<rt>べんえき<\/rt><\/ruby>を提供する行政（補助金、手当、公共施設、サービス）。権利制限を伴わないので、伝統的には法律の根拠がなくても予算措置と<ruby>要綱<rt>ようこう<\/rt><\/ruby>で実施できるとされてきた。<\/p>","<p>講義で挙がった高校無償化は給付行政の例。国の高等学校等<ruby>就学<rt>しゅうがく<\/rt><\/ruby>支援金に加えて、<ruby>東京<rt>とうきょう<\/rt><\/ruby>都や<ruby>大阪<rt>おおさか<\/rt><\/ruby>府は私立高校授業料の独自支援を拡大している（国の制度も2025年度から所得制限を段階的に<ruby>撤廃<rt>てっぱい<\/rt><\/ruby>）。<\/p>"]},"犯罪被害者支援":{"id":"犯罪被害者支援","h":"犯罪被害者支援","part":"事例展开","sect":"法の空白を埋める","blocks":["<p>2004年の犯罪被害者等基本法が、自治体に地域の状況に応じた施策を実施する<ruby>責務<rt>せきむ<\/rt><\/ruby>を定めたことを受けて、見舞金の支給、住居の確保、相談窓口などを定める条例が全国に広がっている。<ruby>兵庫<rt>ひょうご<\/rt><\/ruby>県<ruby>明石<rt>あかし<\/rt><\/ruby>市の条例（2011年）は、加害者が払わない損害賠償を市が立て替える制度を導入したことで知られる。<\/p>"]},"経済的・社会的規制":{"id":"経済的・社会的規制","h":"経済的・社会的規制","part":"重要概念展开","sect":"行政・規制の分類","blocks":["<p><b>経済的規制<\/b>は市場参入・価格・営業形態などに関する規制（旅館業の許可、<ruby>客引<rt>きゃくひ<\/rt><\/ruby>き規制など）。<br><b>社会的規制<\/b>は安全・健康・環境・生活秩序を守るための規制で、近年は<b>個人の私的な行動そのもの<\/b>（ゲーム時間、路上飲酒、エスカレーターの歩き方、餌やり）にまで及んでいる。講義で強調されたのは、この後者が増えていることが「行政国家化」の表れで、同時に個人の自由や監視社会化との緊張を生んでいる、という点。<\/p>"]},"客引き禁止":{"id":"客引き禁止","h":"客引き禁止","part":"事例展开","sect":"営業の自由","blocks":["<p><ruby>新宿<rt>しんじゅく<\/rt><\/ruby>区、<ruby>豊島<rt>としま<\/rt><\/ruby>区、<ruby>渋谷<rt>しぶや<\/rt><\/ruby>区、<ruby>大阪<rt>おおさか<\/rt><\/ruby>市など多くの自治体が、繁華街での<ruby>客引<rt>きゃくひ<\/rt><\/ruby>き・勧誘行為を禁止する条例を置いている（違反者に<ruby>過料<rt>かりょう<\/rt><\/ruby>、悪質な場合は罰金など）。商売のやり方は<b>営業の自由<\/b>（憲法22条1項の職業選択の自由から導かれる）で保障されるので、「どこまで制限していいのか」が論点。公共空間の通行の安全や、ぼったくり被害の予防が正当化根拠になる。<\/p>"]},"渋谷区 路上飲酒":{"id":"渋谷区 路上飲酒","h":"渋谷区 路上飲酒","part":"事例展开","sect":"私生活への介入","blocks":["<p>2019年に「<ruby>渋谷<rt>しぶや<\/rt><\/ruby>駅周辺地域の安全で安心な環境の確保に関する条例」を制定し、ハロウィン期間と年末年始の夜間に<ruby>渋谷<rt>しぶや<\/rt><\/ruby>駅周辺の公共の場所での飲酒を禁止した。その後も騒動が続いたことから、2024年に改正し、対象地域での<b>路上飲酒を通年で夜間（18時〜翌5時）禁止<\/b>に拡大（2024年10月施行）。<ruby>罰則<rt>ばっそく<\/rt><\/ruby>はない。公共空間での個人の飲酒という私的行為を条例で直接規制している点で、社会的規制の典型例。<\/p>"]},"香川県ゲーム条例":{"id":"香川県ゲーム条例","h":"香川県ゲーム条例","part":"事例展开","sect":"私生活への介入","blocks":["<p>2020年4月施行。18歳未満のゲーム利用を平日60分・休日90分まで、スマホ使用を中学生以下は21時・高校生は22時までを「目安」とし、保護者にそれを守らせる<b>努力義務<\/b>を課した。<ruby>罰則<rt>ばっそく<\/rt><\/ruby>はない。家庭内の私的な行動に行政が介入するものとして強い批判を受け、<ruby>違憲<rt>いけん<\/rt><\/ruby>訴訟も起きたが、<ruby>高松<rt>たかまつ<\/rt><\/ruby>地裁は2022年に請求を<ruby>棄却<rt>ききゃく<\/rt><\/ruby>した（努力義務にとどまり権利侵害とまではいえない）。社会的規制がどこまで私生活に入れるか、の象徴的事例。<\/p>"]},"行政国家化":{"id":"行政国家化","h":"行政国家化","part":"重要概念展开","sect":"規制の拡大と限界","blocks":["<p>19世紀型の「<ruby>夜警<rt>やけい<\/rt><\/ruby>国家」（国家の役割は治安・国防に限定）から、20世紀以降、国家が社会・経済に広く介入する<b>行政国家(福祉国家)<\/b>へ移ったことを指す。<ruby>立法<rt>りっぽう<\/rt><\/ruby>より行政の役割が<ruby>肥大<rt>ひだい<\/rt><\/ruby>化し、行政が生活の細部までルールを作り、執行するようになる。講義では、自治体の条例がゲーム時間やエスカレーターの乗り方まで決めるようになっている状況を「行政国家化」と呼び、それが<b>監視社会<\/b>につながるリスクとの<ruby>天秤<rt>てんびん<\/rt><\/ruby>で考える必要がある、という問題提起になっていた。<\/p>"]},"エスカレーター条例":{"id":"エスカレーター条例","h":"エスカレーター条例","part":"事例展开","sect":"私生活への介入","blocks":["<p><b><ruby>埼玉<rt>さいたま<\/rt><\/ruby>県エスカレーターの安全な利用の促進に関する条例<\/b>（2021年10月施行）が全国初で、利用者に「立ち止まった状態で利用しなければならない」と定めた。<b><ruby>名古屋<rt>なごや<\/rt><\/ruby>市<\/b>も2023年10月に同様の条例を施行。どちらも<ruby>罰則<rt>ばっそく<\/rt><\/ruby>はなく努力規定的な性格が強い。講義の問いは「人が少なく危険がないときも守らなければならないのか」で、目的（<ruby>転倒<rt>てんとう<\/rt><\/ruby>事故防止）と手段の関係、行為規制の限界を考えさせるもの。<\/p>"]},"不正受給の通報":{"id":"不正受給の通報","h":"不正受給の通報","part":"事例展开","sect":"制度・議会・監視","blocks":["<p><ruby>兵庫<rt>ひょうご<\/rt><\/ruby>県<ruby>小野<rt>おの<\/rt><\/ruby>市の「福祉給付制度適正化条例」（2013年）が有名 ⚠。生活保護などの不正受給や、受給者がパチンコなどで浪費を繰り返していることを見つけた市民に、<b>市への情報提供を<ruby>責務<rt>せきむ<\/rt><\/ruby>として求めた<\/b>ことで、「市民同士の監視を促す」と批判を浴びた。行政の適正化と<b>監視社会<\/b>の境界を考える事例。<\/p>"]},"平等原則":{"id":"平等原則","h":"平等原則","part":"重要概念展开","sect":"規制の拡大と限界","blocks":["<p>公の施設の利用について、地方自治法244条3項は「住民が公の施設を利用することについて、不当な差別的取扱いをしてはならない」と定め、使用料は228条1項により<b>条例で定める<\/b>必要がある。住民と非住民で料金に差をつけることは、住民が税金で施設を支えているという理由があれば一般に「不当」とまではされないが、どこまでの差が合理的かは問題になる。オーバーツーリズム対策の二重料金（外国人観光客にだけ高い料金を課す案など）は、国籍による区別になれば平等原則（憲法14条）との関係がさらに難しくなるので、「住民か否か」で区別する設計が選ばれることが多い。<\/p>"]},"二重価格":{"id":"二重価格","h":"二重価格","part":"事例展开","sect":"課税・料金","blocks":["<p>博物館や動物園の入園料は、地方自治法228条に基づき<b>条例で定める<\/b>。料金設定は、<ruby>受益<rt>じゅえき<\/rt><\/ruby>者負担（使う人が払う）と、子どもや家族連れに来てもらうための政策的な安さのバランスで決まる。<br>オーバーツーリズム対策としては、<b><ruby>姫路<rt>ひめじ<\/rt><\/ruby>城<\/b>が2026年3月1日から二重価格を導入した。18歳以上の入城料は、<b><ruby>姫路<rt>ひめじ<\/rt><\/ruby>市民1,000円、市民以外2,500円<\/b>（それまでは一律1,000円）、18歳未満は無料に。市民かどうかはマイナンバーカードや運転免許証で確認する。当初は市長が「外国人観光客だけ高くする」案に言及して議論になったが、国籍で区別すると平等原則や国際的な批判の問題が大きいため、最終的に「<b>市民か否か<\/b>」で区別する形になった。導入後1か月で入城料収入は約2倍、入城者数は約17%減と報じられている。収入は今後10年ほどの保存修理や整備に充てるとされている。国の施設でも同様の二重価格の導入が検討されている。<\/p>"]},"品川マンション事件":{"id":"品川マンション事件","h":"品川マンション事件","part":"事例展开","sect":"行政指導","blocks":["<p>建築主が<ruby>建築確認<rt>けんちくかくにん<\/rt><\/ruby>を申請したところ、近隣住民が反対した。都の職員は住民との話し合いを求める<b><ruby>行政指導<rt>ぎょうせいしどう<\/rt><\/ruby><\/b>を行い、<ruby>建築主事<rt>けんちくしゅじ<\/rt><\/ruby>はその間、確認処分を<b><ruby>留保<rt>りゅうほ<\/rt><\/ruby><\/b>（先延ばし）した。建築主は建築審査会に審査請求をしたが、約5か月後に住民へ金銭補償をして和解が成立し、ようやく確認が下りた。建築主は違法な留保だとして、都に<ruby>国家賠償<rt>こっかばいしょう<\/rt><\/ruby>を請求した。<\/p>","<p>最高裁（1985年7月16日）は、確認は要件を満たせば速やかに行うのが原則だとしたうえで、建築主が任意に同意している場合や、社会通念上<ruby>合理<rt>ごうり<\/rt><\/ruby>的な留保は違法にならないとした。ただし、話し合いに応じているだけでは同意したとは言えない。建築主が「留保されたままでは協力できない」と明確に示して処分を求めた後は、不協力が社会通念上<ruby>正義<rt>せいぎ<\/rt><\/ruby>の観念に反するといえる<b><ruby>特段<rt>とくだん<\/rt><\/ruby>の事情<\/b>がない限り、行政指導を理由にした留保は国家賠償法1条1項の違法になる（建築主の不利益と行政指導の必要性を<ruby>比較衡量<rt>ひかくこうりょう<\/rt><\/ruby>して判断）。<\/p>","<p>要点は行政指導の<b><ruby>任意性<rt>にんいせい<\/rt><\/ruby><\/b>。建築確認で審査されるのは法令への適合で、住民との話し合いは別の手続として並行して進めるもの。相手が従わないと示したのに、許認可を止めて従わせ続ければ、実質的な強制になる。<\/p>","<p>政策法務との関係では、攻めの法務の限界を示す例。目的が正当でも、手段が違法なら賠償責任を負う。⚠ 住民協議の手続を条例に置く設計（まちづくり条例など）の背景にもなっていると思われる。<\/p>"]}}},{"id":"0929-tanaka","date":"9/29","title":"ガバナンス研究（田中）","outline":[{"t":"g","label":"第1章 導入・近代官僚制（写真なし）","depth":0},{"t":"r","main":"NPMの誕生","sides":["民営化（国鉄・電電公社）"]},{"t":"r","main":"行政の起源","sides":[]},{"t":"r","main":"19世紀の改革","sides":["近代公務員制度"]},{"t":"r","main":"ウェーバーの二元論","sides":["ウェーバーの官僚制"]},{"t":"r","main":"ウィルソンと二分論","sides":["政治行政二分論"]},{"t":"g","label":"第2章 官僚制批判","depth":0},{"t":"r","main":"2-1 伝統的行政の浸透","sides":["OPA"]},{"t":"r","main":"2-2 環境の変化","sides":[]},{"t":"r","main":"2-3 政府批判","sides":[]},{"t":"r","main":"2-4 官僚制批判","sides":["官僚制の逆機能","パーキンソンの法則","予算極大化モデル","官僚優位論"]},{"t":"r","main":"2-5 エージェンシー問題","sides":["エージェンシー問題"]},{"t":"g","label":"第3章 NPMとは何か","depth":0},{"t":"r","main":"3-1 NPMのミステリー","sides":["NPMのミステリー"]},{"t":"r","main":"3-2 OPA vs NPM","sides":["OPAとNPM"]},{"t":"r","main":"3-3 NPMは新しくない","sides":["科学的管理論"]},{"t":"r","main":"3-4 NPM論のパイオニア","sides":["フッドの7原則"]},{"t":"r","main":"3-5 Pollittの整理","sides":["ポリットのNPM"]},{"t":"r","main":"3-7 共通の改革手法","sides":["共通の改革手法"]},{"t":"r","main":"3-8 2つの原理","sides":["させる・任せる"]},{"t":"r","main":"3-9 NPMの基本モデル","sides":["購入者・提供者モデル"]},{"t":"r","main":"3-10 NPMの定義","sides":["NPMの定義","NZ改革"]},{"t":"r","main":"3-11 日本におけるNPM","sides":[]},{"t":"g","label":"第4章 NPMの評価","depth":0},{"t":"r","main":"4-1 NPMのアプローチ","sides":[]},{"t":"r","main":"4-2 異なるモデル","sides":["異なるモデル"]},{"t":"r","main":"4-3 NPMへの批判","sides":["NPM批判"]},{"t":"r","main":"4-5 OECD諸国の実際の問題","sides":["OECDの実態分析"]},{"t":"r","main":"4-6 Purchaser/Providerの条件","sides":["購入者・提供者の条件"]},{"t":"r","main":"4-7 NPMの本質は集権","sides":["NPMは政治改革"]},{"t":"r","main":"4-8 NPMは政治改革","sides":[]},{"t":"r","main":"4-9 ウェストミンスター・モデル","sides":["ウェストミンスター・モデル"]},{"t":"r","main":"4-10 講師の見解","sides":["講師の見解"]},{"t":"g","label":"第5章 ガバナンス論","depth":0},{"t":"r","main":"5-1 NPMに代わる仕組み","sides":[]},{"t":"r","main":"5-2 第一世代改革の成果","sides":["第一世代改革の評価"]},{"t":"r","main":"5-3 3つのガバナンス・モデル","sides":["3つのガバナンス・モデル","ネットワークと協働"]},{"t":"r","main":"5-4 Osborneの3モデル","sides":["NPG"]},{"t":"r","main":"5-5 Denhardtの3モデル","sides":["NPS"]},{"t":"r","main":"5-6 Considine&Lewis","sides":["4つのガバナンス類型"]},{"t":"r","main":"5-7 Petersの4モデル","sides":["ピーターズの4モデル"]},{"t":"r","main":"5-8 NWS・NPM・NPG","sides":["NWS・NPM・NPG"]},{"t":"g","label":"第6章 ポストNPMとデジタル","depth":0},{"t":"r","main":"6-1 ポストNPMの模索","sides":["ポストNPMの模索"]},{"t":"r","main":"6-2 ブレアの宣言","sides":["英国（サッチャーからブレアへ）"]},{"t":"r","main":"6-3 Modernising Government","sides":[]},{"t":"r","main":"6-4 省庁連携白書","sides":[]},{"t":"r","main":"6-5 NPM後の行政改革","sides":["NPM後の行政改革"]},{"t":"r","main":"6-6 OECD VFMレポート","sides":["VFMの3段階"]},{"t":"r","main":"6-9 協働の具体例","sides":["協働の具体例"]},{"t":"r","main":"6-10 ソーシャル・インパクト・ボンド","sides":["SIBと八王子市"]},{"t":"r","main":"6-11 ポストNPMの課題","sides":["ポストNPMの課題"]},{"t":"r","main":"6-12 英GDS","sides":["英国GDS"]},{"t":"r","main":"6-13 デジタル田園都市国家構想","sides":[]},{"t":"r","main":"6-14 コロナと構造的課題","sides":["コロナと構造的課題"]},{"t":"r","main":"6-15 OECDデジタル政府指数","sides":["デジタル政府指数"]},{"t":"r","main":"日本の電子化の問題","sides":["日本の電子化の課題","韓国の電子政府"]},{"t":"g","label":"第7章 まとめ","depth":0},{"t":"r","main":"7-1 まとめ","sides":[]}],"cards":{"NPMの誕生":{"id":"NPMの誕生","h":"NPMの誕生","part":"講義ノート","sect":"第1章 導入・近代官僚制（写真なし）","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">NPM＝新公共経営という概念は、なぜ生まれたのか。<\/div><div class=\"ln\" style=\"--in:0\">民営化：JR、NTT。au。サービスの質が上がった。<\/div><div class=\"ln\" style=\"--in:0\">電話、水道は重要。送電。競争と関わる？<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>NPM の具体的な出発点として、講義は日本の民営化から入った。1985年に<ruby>電電<rt>でんでん<\/rt><\/ruby><ruby>公社<rt>こうしゃ<\/rt><\/ruby>が NTT に、1987年に国鉄が JR 各社になり、競争の導入で料金が下がりサービスが多様化した（携帯電話では NTT ドコモに対して、のちの KDDI・au などが参入）。一方で電話網・水道・送電網のような<b>ネットワーク型インフラ<\/b>は、一本の線しか引けない自然独占になりやすく、単純には競争を入れられない。電力では2020年の<b>発送電分離<\/b>で、発電と小売には競争を入れ、送電網は中立的に管理する形がとられた。厳密には、1980年代の民営化は 6-6 の第1期「政府の見直し」にあたる。<\/p>"]},"民営化（国鉄・電電公社）":{"id":"民営化（国鉄・電電公社）","h":"民営化（国鉄・電電公社）","part":"事例展开","sect":"","blocks":["<p>1980年代の中曽根政権は、第二次臨時行政調査会（土光<ruby>臨調<rt>りんちょう<\/rt><\/ruby>）の答申を受けて三<ruby>公社<rt>こうしゃ<\/rt><\/ruby>の民営化を進めた。1985年に日本電信電話<ruby>公社<rt>こうしゃ<\/rt><\/ruby>が <b>NTT<\/b>、日本専売<ruby>公社<rt>こうしゃ<\/rt><\/ruby>が JT に、1987年に国鉄が分割されて <b>JR<\/b> 各社になった。通信では競争の導入で料金が下がり、サービスが多様化した（第二<ruby>電電<rt>でんでん<\/rt><\/ruby>・日本移動通信などの参入が、のちの KDDI・au につながる）。国鉄は巨額の<ruby>累積<rt>るいせき<\/rt><\/ruby>債務を抱えていたが、分割民営化後、JR 東日本・東海・西日本などは黒字化した。<\/p>","<p>一方、講義の問い「電話・水道・送電は競争とどう関わるか」は、ネットワーク型のインフラは一本の線しか引けない<b>自然独占<\/b>になりやすく、単純に競争を入れられないという論点。電力では2016年の小売全面自由化、2020年の<b>発送電分離<\/b>（送配電部門の法的分離）で、発電と小売には競争を入れ、送電網は中立的に管理する形がとられた。水道は2018年の水道法改正で、自治体が施設を保有したまま運営権を民間に売却する<b>コンセッション<\/b>方式が導入可能になった。<\/p>"]},"行政の起源":{"id":"行政の起源","h":"行政の起源","part":"講義ノート","sect":"第1章 導入・近代官僚制（写真なし）","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">古代エジプト：ナイル川の<ruby>灌漑<rt>かんがい<\/rt><\/ruby>、ピラミッド建設<\/div><div class=\"ln\" style=\"--in:0\">古代<ruby>中国<rt>ちゅうごく<\/rt><\/ruby>、ギリシャ、ローマなどの帝国運営<\/div><div class=\"ln\" style=\"--in:0\">中世〜絶対<ruby>王政<rt>おうせい<\/rt><\/ruby>の<ruby>常備<rt>じょうび<\/rt><\/ruby>軍<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>行政は近代の発明ではなく、大規模な<ruby>治水<rt>ちすい<\/rt><\/ruby>や建設、帝国の統治のために古代から存在した。近代的な官僚制の直接の起源は、絶対<ruby>王政<rt>おうせい<\/rt><\/ruby>が<b><ruby>常備<rt>じょうび<\/rt><\/ruby>軍<\/b>とそれを養う<ruby>徴税<rt>ちょうぜい<\/rt><\/ruby>機構を整えたこと。軍と官僚制が、近代国家の二本柱になった。<\/p>"]},"19世紀の改革":{"id":"19世紀の改革","h":"19世紀の改革","part":"講義ノート","sect":"第1章 導入・近代官僚制（写真なし）","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">19世紀の改革＝新しい<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度<\/div><div class=\"ln\" style=\"--in:0\">英1854、米1883、日1887・1893<\/div><div class=\"ln\" style=\"--in:0\">政治的中立、民主的統制、資格任用、労働基本権<\/div><div class=\"ln\" style=\"--in:0\">近代行政・<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度の理論的基礎＝マックス・ウェーバー<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>英1854はノースコート・トレヴェリアン報告、米1883はペンドルトン法、日1887は<ruby>文官<rt>ぶんかん<\/rt><\/ruby>試験<ruby>試補<rt>しほ<\/rt><\/ruby>及<ruby>見習<rt>みならい<\/rt><\/ruby>規則、1893は<ruby>文官<rt>ぶんかん<\/rt><\/ruby><ruby>任用<rt>にんよう<\/rt><\/ruby>令。いずれも、政党が支持者に<ruby>官職<rt>かんしょく<\/rt><\/ruby>を配る<b><ruby>猟官<rt>りょうかん<\/rt><\/ruby>制<\/b>をやめ、試験と能力で<ruby>公務<rt>こうむ<\/rt><\/ruby>員を選ぶ<b>資格<ruby>任用<rt>にんよう<\/rt><\/ruby>(メリット・システム)<\/b>を導入した。身分保障と引き換えに政治的中立が求められ、労働基本権は制限される。<\/p>"]},"近代公務員制度":{"id":"近代公務員制度","h":"近代公務員制度","part":"重要概念展开","sect":"近代官僚制の成立","blocks":["<p>近代<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度は、19世紀に「誰を役人にするか」を政治的な縁故ではなく能力で決める仕組みとして各国で成立した。<ruby>英国<rt>えいこく<\/rt><\/ruby>は1854年のノースコート・トレヴェリアン報告で公開競争試験による採用を提言し、1870年に本格導入した。<ruby>米国<rt>べいこく<\/rt><\/ruby>は1883年のペンドルトン法で、選挙に勝った政党が支持者に<ruby>官職<rt>かんしょく<\/rt><\/ruby>を配る<b><ruby>猟官<rt>りょうかん<\/rt><\/ruby>制(スポイルズ・システム)<\/b>を改め、試験による<ruby>任用<rt>にんよう<\/rt><\/ruby>を始めた（1881年のガーフィールド大統領暗殺事件がきっかけ）。日本は1887年の<ruby>文官<rt>ぶんかん<\/rt><\/ruby>試験<ruby>試補<rt>しほ<\/rt><\/ruby>及<ruby>見習<rt>みならい<\/rt><\/ruby>規則、1893年の<ruby>文官<rt>ぶんかん<\/rt><\/ruby><ruby>任用<rt>にんよう<\/rt><\/ruby>令で試験<ruby>任用<rt>にんよう<\/rt><\/ruby>を制度化した。<\/p>","<p>共通する原則は、<b>政治的中立<\/b>（政権交代があっても行政は継続する）、<b>民主的統制<\/b>（官僚は議会・内閣を通じて国民に統制される）、<b>資格<ruby>任用<rt>にんよう<\/rt><\/ruby>(メリット・システム)<\/b>（試験と能力で採用・昇進する）、そして身分保障とセットになった<b>労働基本権の制限<\/b>である。<\/p>"]},"ウェーバーの二元論":{"id":"ウェーバーの二元論","h":"ウェーバーの二元論","part":"講義ノート","sect":"第1章 導入・近代官僚制（写真なし）","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">近代官僚、ウェーバーの官僚制モデル<\/div><div class=\"ln\" style=\"--in:0\">ウェーバーの二元論<\/div><div class=\"ln\" style=\"--in:0\">政治家：結果責任の自覚、能力、情熱<\/div><div class=\"ln\" style=\"--in:0\">官僚制：合理的・機械的・非人格的<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>ウェーバーは官僚制を最も合理的で効率的な組織と見なした。『職業としての政治』（1919）では、政治家に必要なのは情熱・責任感・判断力で、自らの決定の結果に責任を負う。官僚は命令を個人的な好悪なしに正確に執行する。この役割分担が、次のウィルソンの政治・行政二分論や、講義後半の<ruby>政官<rt>せいかん<\/rt><\/ruby>関係論（4-8、4-9）の土台になる。<\/p>"]},"ウェーバーの官僚制":{"id":"ウェーバーの官僚制","h":"ウェーバーの官僚制","part":"重要概念展开","sect":"近代官僚制の成立","blocks":["<p>マックス・ウェーバー（1864-1920）は、近代国家の支配を「合法的支配」と捉え、その最も純粋な形態が官僚制だとした。近代官僚制の特徴は、規則による権限の明確化、ヒエラルキー（階統制）、文書主義、専門性に基づく<ruby>任用<rt>にんよう<\/rt><\/ruby>、<ruby>公私<rt>こうし<\/rt><\/ruby>の分離、非人格性などで、ウェーバーはこれを「最も合理的で効率的な組織」と見なした。<\/p>","<p>講義の「二元論」は、『職業としての政治』（1919）での政治家と官僚の対比を指すと思われる。政治家に必要なのは<b>情熱・責任感（結果責任）・判断力<\/b>で、自らの決定の結果に責任を負う。官僚は上からの命令を、個人的な好悪を交えず、規則に従って正確に執行することに名誉がある（<b>合理的・機械的・非人格的<\/b>）。この役割分担が、後の政治・行政二分論や<ruby>政官<rt>せいかん<\/rt><\/ruby>関係論の土台になる。<\/p>"]},"ウィルソンと二分論":{"id":"ウィルソンと二分論","h":"ウィルソンと二分論","part":"講義ノート","sect":"第1章 導入・近代官僚制（写真なし）","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">ウィルソン『行政の研究』<\/div><div class=\"ln\" style=\"--in:0\">技術的行政学<\/div><div class=\"ln\" style=\"--in:0\">政治と行政の区別<\/div><div class=\"ln\" style=\"--in:0\">政治：人の価値観と利害衝突の現象、権力と闘争の観念が重要<\/div><div class=\"ln\" style=\"--in:0\">行政：規則に基づいて国家の任務を遂行する行為であり、効率性・合理性が重要<\/div><div class=\"ln\" style=\"--in:0\"><ruby>猟官<rt>りょうかん<\/rt><\/ruby>制<\/div><div class=\"ln\" style=\"--in:0\">（この前の小番号は記録なし）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>ウィルソン（のちの米大統領）の1887年の論文が<ruby>米国<rt>べいこく<\/rt><\/ruby>行政学の出発点。価値と権力がぶつかる<b>政治<\/b>と、決まったことを効率的に執行する技術としての<b>行政<\/b>を分けた。背景には<ruby>猟官<rt>りょうかん<\/rt><\/ruby>制による腐敗があり、行政を政治の外に置いて専門性で運営しようとした。<\/p>"]},"政治行政二分論":{"id":"政治行政二分論","h":"政治行政二分論","part":"重要概念展开","sect":"近代官僚制の成立","blocks":["<p>ウッドロウ・ウィルソン（のちの米大統領）は1887年の論文「行政の研究」で、行政を政治から切り離して研究すべきだと主張し、<ruby>米国<rt>べいこく<\/rt><\/ruby>行政学の出発点となった。<b>政治<\/b>は価値観や利害が衝突し、権力と闘争がものを言う領域で、<b>行政<\/b>は政治が決めたことを規則に基づいて効率的に執行する技術的な領域だとした（<b>技術的行政学<\/b>）。<\/p>","<p>背景には、当時の<ruby>米国<rt>べいこく<\/rt><\/ruby>で<ruby>猟官<rt>りょうかん<\/rt><\/ruby>制が腐敗と非効率を生んでいたことがある。行政を「政治の外」に置き、専門的な能力で運営することで、行政の効率と中立を守ろうとした。ただし戦後になると、実際の行政は政策形成に深く関わっているという批判（政治行政融合論）が強まる。<\/p>"]},"2-1 伝統的行政の浸透":{"id":"2-1 伝統的行政の浸透","h":"2-1 伝統的行政の浸透","part":"講義ノート","sect":"第2章 官僚制批判","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">OPA：1920年代に確立 (?)<\/div><div class=\"ln\" style=\"--in:0\">①ヒエラルキー等の官僚制による組織<\/div><div class=\"ln\" style=\"--in:0\">政府が財・サービスを提供<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>写真なし。OPA（Old Public Administration）は、ウェーバー型官僚制と政治行政二分論を土台に20世紀前半に確立した伝統的行政。ヒエラルキー型の組織で、政府がサービスを直接生産・提供し、法令と手続きの<ruby>遵守<rt>じゅんしゅ<\/rt><\/ruby>を重視する。<\/p>"]},"OPA":{"id":"OPA","h":"OPA","part":"重要概念展开","sect":"伝統的行政（OPA）への批判","blocks":["<p>OPA（Old Public Administration、伝統的行政）は、ウェーバー型の官僚制と政治行政二分論を土台にした行政モデルで、20世紀前半に先進国で確立した。特徴は、①ヒエラルキー型の官僚制組織、②政府がサービスを直接生産・提供すること、③法令と手続きの<ruby>遵守<rt>じゅんしゅ<\/rt><\/ruby>を重視すること、④終身雇用の<ruby>公務<rt>こうむ<\/rt><\/ruby>員制度である。福祉国家の拡大とともに行政は<ruby>肥大<rt>ひだい<\/rt><\/ruby>化し、1970年代の石油危機と財政赤字をきっかけに「大きな政府」への批判が高まり、NPM へつながっていく。<\/p>"]},"2-2 環境の変化":{"id":"2-2 環境の変化","h":"2-2 環境の変化","part":"講義ノート","sect":"第2章 官僚制批判","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政府を取り巻く環境の変化<\/div><div class=\"ln\" style=\"--in:0\">社会経済環境の変化<\/div><div class=\"ln\" style=\"--in:0\">先進国で<ruby>公務<rt>こうむ<\/rt><\/ruby>員が批判の対象になる <code>原文の年代：1930s<\/code><\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>写真なし。福祉国家の拡大で行政が<ruby>肥大<rt>ひだい<\/rt><\/ruby>化し、1970年代の石油危機と財政赤字をきっかけに、先進国で「大きな政府」と官僚制への批判が高まった（講義の年代は聞き取り不確か）。<\/p>"]},"2-3 政府批判":{"id":"2-3 政府批判","h":"2-3 政府批判","part":"講義ノート","sect":"第2章 官僚制批判","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">社会における政府の役割<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>写真なし。政府はそもそも何をすべきか、という問い直し。市場に任せられることまで政府がやっているのではないか、という批判が NPM の前提になる。<\/p>"]},"2-4 官僚制批判":{"id":"2-4 官僚制批判","h":"2-4 官僚制批判","part":"講義ノート","sect":"第2章 官僚制批判","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>2-4 学者による官僚制批判<\/b>（p.12）<\/div><div class=\"ln\"><b>マートンによる「官僚制の逆機能」<\/b><\/div><div class=\"ln\">①規則万能　②責任回避・自己保身　③秘密主義　④前例主義　⑤画一的傾向　⑥権威主義　⑦繁文縟礼　⑧セクショナリズム<\/div><div class=\"ln\"><b>パーキンソン「パーキンソンの法則」<\/b><\/div><div class=\"ln\">①成長の法則（仕事量に関係なく、官僚組織は<ruby>肥大<rt>ひだい<\/rt><\/ruby>化する）　②<ruby>凡俗<rt>ぼんぞく<\/rt><\/ruby>の法則（不要な仕事がつくられる）<\/div><div class=\"ln\"><b>ニスカネン「予算<ruby>極大<rt>きょくだい<\/rt><\/ruby>化モデル」<\/b><\/div><div class=\"ln\">官僚は個人と同様に<ruby>効用<rt>こうよう<\/rt><\/ruby>関数をもち、それは予算<ruby>極大<rt>きょくだい<\/rt><\/ruby>化を目的として行動。政治家とは独立に行動するため、公共サービスは過剰供給となる。<\/div><div class=\"ln\"><b>辻<ruby>清明<rt>きよあき<\/rt><\/ruby>『日本官僚制の研究』(1969)<\/b><\/div><div class=\"ln\">明治以来における日本の官僚は特権的なエリートによる構造的な支配の中核。戦後の民主化後も存続し、民主化を阻害（「官僚優位論」）<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">講義ではマートン、パーキンソン、ニスカネン、辻<ruby>清明<rt>きよあき<\/rt><\/ruby>の順に紹介。<\/div><div class=\"ln\" style=\"--in:0\">ニスカネン：官僚も個人と同じ<ruby>効用<rt>こうよう<\/rt><\/ruby>関数をもち、予算<ruby>極大<rt>きょくだい<\/rt><\/ruby>化が行動の目的になる。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>4人とも、ウェーバーが「最も合理的」とした官僚制に、それぞれ別の角度から穴を見つけている。マートンは<b>組織の<ruby>病理<rt>びょうり<\/rt><\/ruby><\/b>（規則を守ること自体が目的になる）、パーキンソンは<b>組織の自己増殖<\/b>、ニスカネンは<b>官僚個人の利己的動機<\/b>（経済学の公共選択論）、辻は<b>日本の官僚の歴史的な特権性<\/b>。前の3つが「官僚制一般の欠陥」、辻は「日本の官僚が強すぎる」という日本固有の問題で、講義後半の「NPMは政治改革」（4-8）の伏線になっている。<\/p>"]},"官僚制の逆機能":{"id":"官僚制の逆機能","h":"官僚制の逆機能","part":"重要概念展开","sect":"伝統的行政（OPA）への批判","blocks":["<p>ロバート・マートン（1940）は、ウェーバーが合理的だとした官僚制の特徴が、実際には意図しない悪影響を生むと指摘した。規則を守ることが目的化し（<b>目的の転移<\/b>）、規則万能、前例主義、責任回避、秘密主義、画一性、権威主義、<b><ruby>繁文<rt>はんぶん<\/rt><\/ruby><ruby>縟礼<rt>じょくれい<\/rt><\/ruby><\/b>（レッド・テープ、煩雑な手続き）、<b>セクショナリズム<\/b>（<ruby>縄張<rt>なわば<\/rt><\/ruby>り意識）といった<ruby>病理<rt>びょうり<\/rt><\/ruby>が生じる。いずれも「お役所仕事」として日常的に批判される現象で、日本の行政改革論議でも繰り返し使われる<ruby>枠組<rt>わくぐ<\/rt><\/ruby>み。<\/p>"]},"パーキンソンの法則":{"id":"パーキンソンの法則","h":"パーキンソンの法則","part":"重要概念展开","sect":"伝統的行政（OPA）への批判","blocks":["<p>C・N・パーキンソン（1957）が<ruby>英国<rt>えいこく<\/rt><\/ruby>海軍省などの観察から皮肉を込めて示した法則。「仕事の量は、完成のために与えられた時間をすべて満たすまで膨張する」。官僚は部下を増やしたがり、増えた部下同士が互いに仕事を作り出すので、<b>仕事量と関係なく組織は<ruby>肥大<rt>ひだい<\/rt><\/ruby>化する(成長の法則)<\/b>。また、組織が大きくなると本来不要な仕事が作られる（<b><ruby>凡俗<rt>ぼんぞく<\/rt><\/ruby>の法則<\/b>）。<\/p>"]},"予算極大化モデル":{"id":"予算極大化モデル","h":"予算極大化モデル","part":"重要概念展开","sect":"伝統的行政（OPA）への批判","blocks":["<p>ウィリアム・ニスカネン（1971）の<b>公共選択論<\/b>に基づくモデル。官僚も利己的な個人として行動し、その<ruby>効用<rt>こうよう<\/rt><\/ruby>（権限、<ruby>威信<rt>いしん<\/rt><\/ruby>、昇進など）は所管予算の大きさと結びついているので、<b>予算を最大化するように行動する<\/b>。しかも官僚はサービスの実際のコストについて政治家より多くの情報をもつ（情報の非対称性）ので、政治家は<ruby>査定<rt>さてい<\/rt><\/ruby>しきれず、結果として公共サービスは<b>過剰供給<\/b>になる。NPM が市場メカニズムや業績測定を導入しようとした理論的根拠の一つ。<\/p>"]},"官僚優位論":{"id":"官僚優位論","h":"官僚優位論","part":"重要概念展开","sect":"伝統的行政（OPA）への批判","blocks":["<p>辻<ruby>清明<rt>きよあき<\/rt><\/ruby>『日本官僚制の研究』（初版1952、新版1969）は、明治以来の日本の官僚が特権的エリートとして国家支配の中核を担い、戦後の民主化改革を経ても温存され、民主化を阻害していると論じた（<b>官僚優位論<\/b>）。これに対して1980年代には<ruby>村松<rt>むらまつ<\/rt><\/ruby><ruby>岐夫<rt>みちお<\/rt><\/ruby>らが、戦後は自民党の政治家が政策決定に強い影響力をもつようになったとする<b>政党優位論<\/b>を唱え、日本の<ruby>政官<rt>せいかん<\/rt><\/ruby>関係をめぐる論争になった。<\/p>"]},"2-5 エージェンシー問題":{"id":"2-5 エージェンシー問題","h":"2-5 エージェンシー問題","part":"講義ノート","sect":"第2章 官僚制批判","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>2-5 エージェンシー問題<\/b>（p.13）<\/div><div class=\"ln\">プリンシパル（主人）（国民、政治家、株主等）<\/div><div class=\"ln\">　⇅<\/div><div class=\"ln\">エージェント（代理人）（政治家、官僚、会社役員等）<\/div><div class=\"ln\">エージェントが、プリンシパルの利益のために<ruby>委任<rt>いにん<\/rt><\/ruby>されているにもかかわらず、プリンシパルの利益に反して、エージェント自身の利益を優先する行動をとることを「エージェンシー・スラック」（エージェンシー問題）という。エージェンシー・スラックは、情報の非対称性に起因するモラル・ハザードの一種であり、市場の失敗の一例である。これを防止するためには、監視コストなどエージェンシー費用がかかる。<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">principal ⇄ agent<\/div><div class=\"ln\" style=\"--in:0\">会社員は株主のために働く。働かせるための仕組みがストック・オプションや従業員持株。<\/div><div class=\"ln\" style=\"--in:0\">校長の場合は、校長のパフォーマンスをどうモニターするか。<\/div><div class=\"ln\" style=\"--in:0\">官僚の場合、働かせる役は誰か？ → 大臣（政治家）。<\/div><div class=\"ln\" style=\"--in:0\">タイの例：独裁（軍事政権など）の下では、プリンシパルである国民がエージェントである政府・官僚を監視できず、国家が<ruby>恣意<rt>しい<\/rt><\/ruby>的に権力を使う。国民の参加と民主的統制が「国家の代理人」を監視する手段になる、という話か (?)<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>図のポイントは、<b>政治家が両方の欄に入っている<\/b>こと。国民から見れば政治家はエージェントだが、官僚から見ればプリンシパルになる。行政は「国民 → 政治家 → 官僚」という<b><ruby>委任<rt>いにん<\/rt><\/ruby>の連鎖<\/b>で、各段階でスラックが起きうる。NPM の業績目標・契約・成果報酬は、この「どうやって代理人をちゃんと働かせるか」への答えとして設計された。<\/p>"]},"エージェンシー問題":{"id":"エージェンシー問題","h":"エージェンシー問題","part":"重要概念展开","sect":"伝統的行政（OPA）への批判","blocks":["<p><b>プリンシパル・エージェント理論<\/b>は、仕事を任せる側（プリンシパル）と任される側（エージェント）の関係を分析する。エージェントは任された仕事をどれだけ真面目にやっているかを一番よく知っているが、プリンシパルはそれを完全には観察できない（<b>情報の非対称性<\/b>）。そのためエージェントは自分の利益を優先してしまう（<b>エージェンシー・スラック<\/b>、モラル・ハザード）。防ぐには監視（モニタリング）や、成果と報酬を結びつけるインセンティブ設計が必要で、そのコストが<b>エージェンシー費用<\/b>になる。<\/p>","<p>企業なら株主（プリンシパル）と経営者（エージェント）の関係で、ストック・オプションで経営者の利益を株価に連動させるのが典型的な対策。行政では、<b>国民 → 政治家 → 官僚<\/b>という<ruby>委任<rt>いにん<\/rt><\/ruby>の連鎖があり、それぞれの段階でエージェンシー問題が生じる。NPM の「成果目標を契約で示し、達成度を測って報いる」という発想は、この理論を行政に応用したもの。<\/p>"]},"3-1 NPMのミステリー":{"id":"3-1 NPMのミステリー","h":"3-1 NPMのミステリー","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-1 NPMのミステリー<\/b>（p.14）<\/div><div class=\"ln\">1．1980年代に、主としてアングロ・アメリカン諸国で生まれたが、先進国・途上国共通に<ruby>伝播<rt>でんぱ<\/rt><\/ruby><\/div><div class=\"ln\">2．様々な批判を受けたが、NPM的な改革は世界中のどこかで引き続き実施<\/div><div class=\"ln\">3．日本にも大きな影響（国・地方共通）<\/div><div class=\"ln\">⇓<\/div><div class=\"ln\">他方、誤解や不理解も大きい<\/div><div class=\"ln\">魔法の杖のように肯定するものから、レトリックに過ぎないと否定するものまである<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>講義全体の問題設定。「こんなに広まったのに、なぜこんなに理解されていないのか」。最後の 4-10（講師の見解）で「魔法の杖でもレトリックでもない」と答えを出す構成になっている。<\/p>"]},"NPMのミステリー":{"id":"NPMのミステリー","h":"NPMのミステリー","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>NPM は1980年代に<ruby>英国<rt>えいこく<\/rt><\/ruby>・NZ・<ruby>豪州<rt>ごうしゅう<\/rt><\/ruby>など<b>アングロ・アメリカン諸国<\/b>で生まれ、先進国にも途上国にも広がった。日本でも国・地方を通じて大きな影響を与えている。ところが NPM が何なのかについては誤解が大きく、「行政を立て直す魔法の杖」と持ち上げる議論から、「中身のないレトリックだ」と切り捨てる議論まで評価が割れている。講義はこの「なぜこれほど広まったのに、これほど理解されていないのか」を出発点にしている。<\/p>"]},"3-2 OPA vs NPM":{"id":"3-2 OPA vs NPM","h":"3-2 OPA vs NPM","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-2 OPA vs NPM<\/b>（p.15）<\/div><div class=\"ln\">OPA：行政管理／官僚制／ヒエラルキー／手続き重視<\/div><div class=\"ln\">　⇔<\/div><div class=\"ln\">NPM：マネジメント／民間志向／フラット／結果重視<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">OPA ⇄ NPM<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>左右が一対一で対応している。行政管理 ⇔ マネジメント、官僚制 ⇔ 民間志向、ヒエラルキー ⇔ フラット、手続き重視 ⇔ 結果重視。とくに最後の対比が核心で、OPA は「正しい手続きを踏んだか」、NPM は「どんな成果を出したか」で行政を評価する。<\/p>"]},"OPAとNPM":{"id":"OPAとNPM","h":"OPAとNPM","part":"重要概念展开","sect":"NPMの理論","blocks":["<div class=\"tbl\"><table><tr><th><\/th><th>OPA（伝統的行政）<\/th><th>NPM<\/th><\/tr><tr><td>基本発想<\/td><td>行政管理<\/td><td>マネジメント<\/td><\/tr><tr><td>組織<\/td><td>官僚制・ヒエラルキー<\/td><td>フラット、民間志向<\/td><\/tr><tr><td>重視するもの<\/td><td>手続き（インプット・プロセス）<\/td><td>結果（アウトプット・アウトカム）<\/td><\/tr><\/table><\/div>","<p>OPA が「決められた手続きを正しく守ったか」で行政を評価するのに対し、NPM は「どれだけの成果を上げたか」で評価する。<\/p>"]},"3-3 NPMは新しくない":{"id":"3-3 NPMは新しくない","h":"3-3 NPMは新しくない","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-3 NPMは \"new\" ではない<\/b>（p.16）<\/div><div class=\"ln\"><b>科学的管理論 Scientific Management<\/b><\/div><div class=\"ln\">テイラー（1856-1915）「科学的管理法」<\/div><div class=\"ln\">大規模工場の管理法を応用し、作業過程の改善は経営管理における合理性について基礎的な考え方を打ち立てた。「テーラー主義」とは、複雑な<ruby>課業<rt>かぎょう<\/rt><\/ruby>を分解し、誰にでもできるような仕事に再構成し、労働コストを下げる方式とその実践を支える考え方<\/div><div class=\"ln\">ギューリック（1892-1993）「組織管理論」<\/div><div class=\"ln\">科学的管理法依頼のフォーマルな制度や原理を適用して、組織を合理的に管理するという理念を、事務系組織について応用。組織管理に必要な7つの要素（Planning, Organizing, Directing, Staffing, Coordinating, Reporting, Budgeting）を POSDCORB として定式化<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">NPM は new ではない。科学的管理論：大規模工場の作業を分解・測定する。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>「依頼」はスライドの誤字で「以来」。NPM の業績測定や管理技術の重視は、100年前の工場管理論と同じ発想だという指摘。ただし NPM が新しいのは、それを<b>市場メカニズムや契約<\/b>と組み合わせた点にある。<\/p>"]},"科学的管理論":{"id":"科学的管理論","h":"科学的管理論","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>NPM は \"new\" ではない、という講義の主張の根拠。フレデリック・テイラー（1856-1915）の<b>科学的管理法<\/b>は、大規模工場の作業を時間研究・動作研究で<b>分解・計測・標準化<\/b>し、誰でもできる仕事に再構成して労働コストを下げる手法だった。ルーサー・ギューリック（1892-1993）はこれを行政組織に応用し、管理者の機能を <b>POSDCORB<\/b>（Planning, Organizing, Staffing, Directing, Coordinating, Reporting, Budgeting）として定式化した。NPM の業績測定や管理手法の重視は、この古典的な管理論の延長線上にある。<\/p>"]},"3-4 NPM論のパイオニア":{"id":"3-4 NPM論のパイオニア","h":"3-4 NPM論のパイオニア","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-4 NPM論のパイオニア<\/b>（p.17）<\/div><div class=\"ln\">1．実践的・専門的マネジメント<\/div><div class=\"ln\">2．明確な基準と業績の測定<\/div><div class=\"ln\">3．アウトプットの重視<\/div><div class=\"ln\">4．<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化<\/div><div class=\"ln\">5．競争環境の強化<\/div><div class=\"ln\">6．民間部門のマネジメント<\/div><div class=\"ln\">7．厳しい財政規律<\/div><div class=\"ln\">※Christopher Hood (1991)<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">Christopher Hood（1991）。業績管理（performance management）。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>NPM という言葉を定着させたフッドの7原則。大きく分けると、1・2・3・7 が<b>管理の仕方<\/b>（誰が責任者で、何をどう測るか）、4・5・6 が<b>組織と市場の構造<\/b>（大きな組織を分け、競争させ、民間の手法を入れる）。<\/p>"]},"フッドの7原則":{"id":"フッドの7原則","h":"フッドの7原則","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>クリストファー・フッドの論文 \"A Public Management for All Seasons?\"（1991）は、NPM という言葉を広めた古典的文献。NPM の<ruby>教義<rt>きょうぎ<\/rt><\/ruby>を7つにまとめた：①実践的・専門的マネジメント（管理者に明確な権限と責任）②明確な基準と業績の測定 ③アウトプットの重視 ④<b><ruby>分権<rt>ぶんけん<\/rt><\/ruby>化<\/b>（大きな組織を単位ごとに分解）⑤競争環境の強化 ⑥民間部門のマネジメント手法 ⑦厳しい財政規律（資源利用の節約）。<\/p>"]},"3-5 Pollittの整理":{"id":"3-5 Pollittの整理","h":"3-5 Pollittの整理","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-5 Pollitt(2003)によるNPM<\/b>（p.18）<\/div><div class=\"ln\">1．インプットからアウトプット重視<\/div><div class=\"ln\">2．計測と定量化へ<\/div><div class=\"ln\">3．専門的・自立的な組織<\/div><div class=\"ln\">4．契約的な関係<\/div><div class=\"ln\">5．サービス提供における市場原理<\/div><div class=\"ln\">6．顧客志向<\/div><div class=\"ln\">7．<ruby>官民<rt>かんみん<\/rt><\/ruby>の区別が曖昧に<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">定量化、顧客志向。住民を「市民」から「顧客」として捉え直す。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>フッドの7原則と比べると、ポリットは「<b>契約的な関係<\/b>」と「<b>顧客志向<\/b>」「<b><ruby>官民<rt>かんみん<\/rt><\/ruby>の区別が曖昧に<\/b>」を加えている。行政内部の管理の話から、行政と住民・民間との関係の話へ視野が広がっている。<\/p>"]},"ポリットのNPM":{"id":"ポリットのNPM","h":"ポリットのNPM","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>クリストファー・ポリット（2003）による整理：①インプットからアウトプット重視へ ②<b>計測と定量化<\/b> ③専門的・自立的な組織 ④<b>契約的な関係<\/b> ⑤サービス提供における市場原理 ⑥<b>顧客志向<\/b> ⑦<ruby>官民<rt>かんみん<\/rt><\/ruby>の区別の曖昧化。<\/p>","<p>講義で強調されたのは⑥で、NPM は住民を「市民」から「顧客」として捉え直す。これはサービスの質を上げる一方で、後述の NPM 批判（「国民は顧客であるだけでなく主人である」）につながる論点でもある。<\/p>"]},"3-7 共通の改革手法":{"id":"3-7 共通の改革手法","h":"3-7 共通の改革手法","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-7 NPMの共通の改革手法<\/b>（p.20）<\/div><div class=\"ln\">1．業績測定（PM）<\/div><div class=\"ln\">2．エージェンシー、分解<\/div><div class=\"ln\">3．発生主義会計<\/div><div class=\"ln\">民間企業の経営手法の導入？<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">エージェンシー化：ミッションの明確化、（企画と実施の）分離、法律と予算、<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化して目標を立てる。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>各国で共通して使われた3つの道具。赤字の「？」は、これらが本当に「民間の手法を持ち込んだだけ」なのか、という問いかけ。発生主義会計は企業会計そのものだが、業績測定やエージェンシー化は、むしろ政治家が官僚を統制する道具として使われた面がある（4-8 につながる）。<\/p>"]},"共通の改革手法":{"id":"共通の改革手法","h":"共通の改革手法","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>各国の NPM 改革に共通する手法は、①<b>業績測定<\/b>（Performance Measurement / Management）②<b>エージェンシー化<\/b>・組織の分解（政策の企画部門と実施部門を分離し、実施部門に明確なミッションと目標、予算の<ruby>裁量<rt>さいりょう<\/rt><\/ruby>を与える）③<b>発生主義会計<\/b>（現金の出入りだけでなく資産・負債・<ruby>減価<rt>げんか<\/rt><\/ruby><ruby>償却<rt>しょうきゃく<\/rt><\/ruby>を把握する企業会計的手法）の3つ。スライドの赤字「民間企業の経営手法の導入？」は、これらが本当に民間の手法の単純な導入なのか、という問いかけ。<\/p>"]},"3-8 2つの原理":{"id":"3-8 2つの原理","h":"3-8 2つの原理","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-8 NPMの2つの原理<\/b>（p.21）<\/div><div class=\"ln\">「NPM＝2つの原理の結婚」、Hood (1991)<\/div><div class=\"ln\">\"Make managers manage\"「させる」<\/div><div class=\"ln\">　制度派経済学、公共選択理論、取引コスト理論、プリンシパル・エージェント理論 等<\/div><div class=\"ln\">　⇅<\/div><div class=\"ln\">\"Let managers manage\"「任せる」<\/div><div class=\"ln\">　民間企業のマネジメント、人間組織論 等<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">「させる」＝強制の意味。<\/div><div class=\"ln\" style=\"--in:0\">【ニュージーランドの事例が何度も言及された】<\/div><div class=\"ln\" style=\"--in:0\"><ruby>自律<rt>じりつ<\/rt><\/ruby>性を発揮させて働かせる。サッチャーの<ruby>英国<rt>えいこく<\/rt><\/ruby>と<ruby>公務<rt>こうむ<\/rt><\/ruby>員。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>「させる」は管理者に成果を<b>強制<\/b>する（契約・目標・監視）、「任せる」は規則を緩めて管理者の<b><ruby>裁量<rt>さいりょう<\/rt><\/ruby><\/b>に委ねる。講師が「させる＝強制の意味」と強調したところ。NZ は前者、<ruby>英国<rt>えいこく<\/rt><\/ruby>は後者に近いとされるが、実際の改革は両方を同時に含み、互いに緊張関係にある。<\/p>"]},"させる・任せる":{"id":"させる・任せる","h":"させる・任せる","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>フッド（1991）は NPM を「2つの原理の結婚」と表現した。<\/p>","<p><b>Make managers manage(させる)<\/b>：管理者に契約や目標で成果を出すことを<b>強制<\/b>する。制度派経済学、公共選択理論、取引コスト理論、プリンシパル・エージェント理論が背景。NZ 型の改革が典型<br><b>Let managers manage(任せる)<\/b>：細かい規則や手続きの<ruby>縛<rt>しば<\/rt><\/ruby>りを外して、管理者の<ruby>裁量<rt>さいりょう<\/rt><\/ruby>に<b>任せる<\/b>。民間企業のマネジメント論、人間関係論が背景。<ruby>英国<rt>えいこく<\/rt><\/ruby>の Next Steps 型の改革がこれに近い<\/p>","<p>二つは緊張関係にあり、「任せる」ほど統制が効かなくなり、「させる」ほど<ruby>自律<rt>じりつ<\/rt><\/ruby>性が失われる。<\/p>"]},"3-9 NPMの基本モデル":{"id":"3-9 NPMの基本モデル","h":"3-9 NPMの基本モデル","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-9 NPMの基本モデル<\/b>（p.22）<\/div><div class=\"ln\">政府＝購入者（Purchaser）　※従来のモデル：政府＝供給者<\/div><div class=\"ln\">　↓ <ruby>擬似<rt>ぎじ<\/rt><\/ruby>市場<\/div><div class=\"ln\">エージェンシー・企業、NPO等＝供給者（Provider）→ 国民<\/div><div class=\"ln\">国民 → 議会 → 政府<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政府＝provider？<\/div><div class=\"ln\" style=\"--in:0\">供給するだけなら、誰がやってもいいのではないか？ → モデルが機能する。<\/div><div class=\"ln\" style=\"--in:0\">供給者が政府と競合したら、あるいは一社しかなかったら？ → 独占の問題。<\/div><div class=\"ln\" style=\"--in:0\">PFI (?)：講師の問い「（事業者を選んで契約するまで）どれくらい時間がかかると思うか」。学生は数か月と答えたが、実際は約2年。スライドの cost の話につながり、ここでの cost は時間コスト（取引コスト）のこと。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>三角形で読む。国民は議会を通じて政府を統制し、政府はサービスを「買う」側に回り、実際の提供はエージェンシーや企業・NPO が担う。講義で出た「供給だけなら誰でもいいのでは」「一社しかなければ独占では」「PFI は契約まで2年かかる（時間コスト）」は、すべてこのモデルの弱点についての話。<\/p>"]},"購入者・提供者モデル":{"id":"購入者・提供者モデル","h":"購入者・提供者モデル","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>従来のモデルでは、政府が自らサービスを生産・供給していた（政府＝供給者）。NPM の基本モデルでは、政府は<b>購入者(Purchaser)<\/b>としてサービスの内容と水準を決め、エージェンシー、民間企業、NPO などの<b>供給者(Provider)<\/b>に契約で委ねる。両者の間に<b><ruby>擬似<rt>ぎじ<\/rt><\/ruby>市場<\/b>を作り、競争で効率と質を高める。国民は議会を通じて政府を統制し、供給者からサービスを受ける。<\/p>","<p>オズボーンとゲーブラー『行政革命（Reinventing Government）』（1992）の「政府は<ruby>漕<rt>こ<\/rt><\/ruby>ぐ（rowing）のではなく舵を取る（steering）べき」という標語も同じ発想。講義で出た「供給だけなら誰がやってもいいのでは？」という問いがこのモデルの核心で、逆に供給者が一社しかなければ<b>独占<\/b>になり、競争の利点が失われる。<\/p>","<p><b>PFI<\/b>（Private Finance Initiative）はこのモデルの応用で、公共施設の建設・運営を民間の資金とノウハウで行う手法。<ruby>英国<rt>えいこく<\/rt><\/ruby>で1992年に始まり、日本では1999年に PFI 法が制定された。<b>VFM<\/b>（Value for Money、支払いに対して最も価値の高いサービス）が導入の判断基準になる。<\/p>","<p>講義で「どれくらい時間がかかるか」と問われたのがこの PFI の手続きだと考えられる。日本の PFI は、導入可能性調査、実施方針の公表、特定事業の選定、入札・事業者選定、契約締結と段階を踏むため、構想から契約までおおむね<b>1年半〜2年以上<\/b>かかるのが普通 ⚠。この時間と手間そのものが<b>取引コスト<\/b>で、4-6 の「Purchaser/Provider モデルの条件」の③取引コストにあたる。外部に任せれば安くなるように見えても、契約を設計し、事業者を選び、監視するためのコストが大きければ、かえって非効率になる。<\/p>","<p>（PFI という略語は聞き取りからの推定。発音が近く同じ<ruby>文脈<rt>ぶんみゃく<\/rt><\/ruby>で出てくる略語としては、PPP（<ruby>官民<rt>かんみん<\/rt><\/ruby>連携）、PFS（Pay for Success、成果連動型民間委託）、VFM もありうる。ただし「2年かかる手続き」という話に最もよく合うのは PFI。）<\/p>"]},"3-10 NPMの定義":{"id":"3-10 NPMの定義","h":"3-10 NPMの定義","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-10 NPMで明らかなこと<\/b>（p.23）<\/div><div class=\"ln\"><b>共通の定まった定義はない<\/b><\/div><div class=\"ln\">⇑<\/div><div class=\"ln\">1．なぜなら、考え方は様々な国における実践から抽出された<\/div><div class=\"ln\">2．実践は国により<ruby>多種<rt>たしゅ<\/rt><\/ruby>多様<\/div><div class=\"ln\">3．NPMの理論は \"retrospective\"<\/div><div class=\"ln\">ありうるNPMの起源（教科書）<\/div><div class=\"ln\">NZ Treasury (1987) \"Government Management\"<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">NZ：NPMの教科書。【NZの話がまた出た】<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>NPM は理論が先にあって実践されたのではなく、各国がばらばらに改革した後で「これを NPM と呼ぼう」と名前がついた（retrospective＝後づけ）。だから定義がひとつに定まらない。講義で「NZ は NPM の教科書」と言われたのがこの NZ 財務省の報告書。<\/p>"]},"NPMの定義":{"id":"NPMの定義","h":"NPMの定義","part":"重要概念展开","sect":"NPMの理論","blocks":["<p>NPM には共通の定まった定義がない。理由は、①考え方が各国の実践から後づけで抽出されたこと、②実践が国ごとに<ruby>多種<rt>たしゅ<\/rt><\/ruby>多様なこと、③NPM の理論が \"retrospective\"（後づけの説明）であること。教科書的な起源として挙げられるのは、ニュージーランド財務省が1987年の総選挙後に新政権に提出した報告書 \"Government Management\" である。<\/p>"]},"NZ改革":{"id":"NZ改革","h":"NZ改革","part":"事例展开","sect":"","blocks":["<p>ニュージーランドは NPM の「教科書」とされる。1984年に発足したロンギ労働党政権のもとで、深刻な財政危機を背景に<ruby>急進<rt>きゅうしん<\/rt><\/ruby>的な改革が行われた。1986年の国有企業法で国営事業を企業化・民営化し、1988年の<b>国家部門法(State Sector Act)<\/b>で各省の事務次官を期限付きの契約制の<b>最高経営責任者(CE)<\/b>に改め、1989年の<b>財政法(Public Finance Act)<\/b>で<b>発生主義会計<\/b>とアウトプット予算を導入した。大臣がアウトプットを「購入」し、省庁・エージェンシーが「供給」するという<b>購入者・提供者モデル<\/b>を最も徹底した国で、「Make managers manage」の典型。1987年の財務省報告書 \"Government Management\" がその理論的基礎になった。<\/p>","<p>その後、OECD（2002）が指摘したように、短期志向、ペーパーワークの増大、省庁の細分化による調整不足が問題になり、2000年代以降は省庁間の連携を重視する方向に修正された。<\/p>"]},"3-11 日本におけるNPM":{"id":"3-11 日本におけるNPM","h":"3-11 日本におけるNPM","part":"講義ノート","sect":"第3章 NPMとは何か","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>3-11 日本におけるNPM<\/b>（p.24）<\/div><div class=\"ln\">日本においても、国・地方を通じて、NPMの考えは浸透し、行政評価、公会計、独立行政法人等、NPMに基づく改革が行われてきたが、行政はほんとうに変わったのか？<\/div><div class=\"ln\">⇓<\/div><div class=\"ln\"><ruby>公務<rt>こうむ<\/rt><\/ruby>員のカルチャーはそれほど変わったと言えないのではないか？現実には、行政の手続重視が更に強まっていると感じている（例：評価や補助金の処理等）<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">地方自治体はそれなりに変わった。<\/div><div class=\"ln\" style=\"--in:0\">中央は変わったのか？（講師は疑問視）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>講師自身の見解。制度としては NPM を導入したが、評価シートを埋めること自体が新しい「手続き」になってしまい、結果重視のつもりがかえって手続き重視を強めた、という皮肉。口頭では「地方自治体はそれなりに変わったが、中央は変わったのか」とも。<\/p>"]},"4-1 NPMのアプローチ":{"id":"4-1 NPMのアプローチ","h":"4-1 NPMのアプローチ","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-1 NPMのアプローチ<\/b>（p.25）<\/div><div class=\"ln\">図：縦軸 Bureaucracy（上）〜 Market-type mechanisms（下）、横軸 Administrator（左）〜 Manager（右）<\/div><div class=\"ln\">出発点 Traditional（左上）から各国へ矢印<\/div><div class=\"ln\">France（官僚制寄りのまま Manager 側へ）<\/div><div class=\"ln\">Canada, Australia, Sweden, Netherlands／USA／Denmark／Finland（中間）<\/div><div class=\"ln\">UK／New Zealand（市場メカニズム側の右下）<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>伝統型（官僚制・行政官）から、各国がどれだけ「市場」と「マネージャー」の方向へ動いたかの地図。NZ と<ruby>英国<rt>えいこく<\/rt><\/ruby>が最も遠くまで動き、フランスはあまり動いていない。日本はこの図に載っていないが、4-2 で「限定的」とされる。<\/p>"]},"4-2 異なるモデル":{"id":"4-2 異なるモデル","h":"4-2 異なるモデル","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-2 NPMの異なるモデル<\/b><\/div><div class=\"ln\">NZ, UK：市場原理重視<\/div><div class=\"ln\"><ruby>豪州<rt>ごうしゅう<\/rt><\/ruby>：アウトカム、プラグマチック<\/div><div class=\"ln\">カナダ, USA：業績志向<\/div><div class=\"ln\"><ruby>北欧<rt>ほくおう<\/rt><\/ruby>：市場原理はそれほど重視せず<\/div><div class=\"ln\">仏, 独, 日本：限定的<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">国レベルでは限定的 → なぜか？<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>同じ NPM でも国によって中身が違う。講義での問い「なぜ日本は国レベルで限定的なのか」の答えは 4-9 の<ruby>政官<rt>せいかん<\/rt><\/ruby>関係にある。<\/p>"]},"異なるモデル":{"id":"異なるモデル","h":"異なるモデル","part":"重要概念展开","sect":"NPMの評価","blocks":["<p>NPM は国によって濃淡が大きい。NZ・<ruby>英国<rt>えいこく<\/rt><\/ruby>は<b>市場原理重視<\/b>、<ruby>豪州<rt>ごうしゅう<\/rt><\/ruby>は<b>アウトカム重視でプラグマチック<\/b>、カナダ・<ruby>米国<rt>べいこく<\/rt><\/ruby>は<b>業績志向<\/b>、<ruby>北欧<rt>ほくおう<\/rt><\/ruby>は市場原理をそれほど重視しない。仏・独・日本は<b>限定的<\/b>。4-1 の図（Pollitt &amp; Bouckaert の比較）では、「伝統型」から出発して、NZ・<ruby>英国<rt>えいこく<\/rt><\/ruby>は市場メカニズムの方向へ大きく動き、フランスは官僚制を保ったままマネージャー型に少し動いた程度、と位置づけられている。<\/p>"]},"4-3 NPMへの批判":{"id":"4-3 NPMへの批判","h":"4-3 NPMへの批判","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-3 NPMへの批判<\/b>（p.27）<\/div><div class=\"ln\">民間企業の経営手法は政府部門へは適用できない<\/div><div class=\"ln\">アカウンタビリティや政治的統制の低下<\/div><div class=\"ln\"><ruby>公務<rt>こうむ<\/rt><\/ruby>員の倫理の低下、腐敗・汚職の増大<\/div><div class=\"ln\">国民は顧客だけではなく主人である<\/div><div class=\"ln\"><ruby>公務<rt>こうむ<\/rt><\/ruby>員の「政治化」<\/div><div class=\"ln\">効率性・有効性の明確な証拠がない（コストと質の問題）<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">OECD：NPMの反省（→ 4-5 の OECD 分析とつながる）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>「国民は顧客だけではなく主人である」は 3-5 の顧客志向への直接の反論で、2-5 のプリンシパル（主人）という言葉とつながっている。<\/p>"]},"NPM批判":{"id":"NPM批判","h":"NPM批判","part":"重要概念展开","sect":"NPMの評価","blocks":["<p>主な批判は6つ。①民間企業の経営手法は、公平性や権利保障を担う政府部門にはそのまま適用できない ②エージェンシー化や外部委託で<b>アカウンタビリティ<\/b>と政治的統制が低下する ③<ruby>公務<rt>こうむ<\/rt><\/ruby>員倫理が低下し、腐敗・汚職が増える ④<b>国民は顧客であるだけでなく主人（主権者）でもある<\/b> ⑤<ruby>公務<rt>こうむ<\/rt><\/ruby>員の「政治化」⑥効率性・有効性が向上したという明確な証拠がない（コストと質の問題）。<\/p>"]},"4-5 OECD諸国の実際の問題":{"id":"4-5 OECD諸国の実際の問題","h":"4-5 OECD諸国の実際の問題","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-5 OECD諸国における実際の問題<\/b>（p.29）<\/div><div class=\"ln\">OECD(2002)による分析（ただし、NPMに由来するとは限らない）<\/div><div class=\"ln\">NZ：短期志向、ペーパーワークの増大、有能な<ruby>公務<rt>こうむ<\/rt><\/ruby>員の減少<\/div><div class=\"ln\">英：多数のエージェンシーによる断片化<\/div><div class=\"ln\">米：アウトソーシングにより、有能な<ruby>公務<rt>こうむ<\/rt><\/ruby>員の喪失<\/div><div class=\"ln\"><ruby>豪州<rt>ごうしゅう<\/rt><\/ruby>：行き過ぎた<ruby>分権化<rt>ぶんけんか<\/rt><\/ruby><\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>改革を最も進めた国ほど副作用もはっきり出た。とくに<ruby>英国<rt>えいこく<\/rt><\/ruby>の「断片化」は、のちのブレア政権の省庁連携（6-4）の直接の動機になる。<\/p>"]},"OECDの実態分析":{"id":"OECDの実態分析","h":"OECDの実態分析","part":"重要概念展开","sect":"NPMの評価","blocks":["<p>OECD（2002）は各国の実際の問題を指摘した（ただし NPM に由来するとは限らない）。NZ は短期志向、ペーパーワークの増大、有能な<ruby>公務<rt>こうむ<\/rt><\/ruby>員の減少。<ruby>英国<rt>えいこく<\/rt><\/ruby>は多数のエージェンシーによる行政の<b>断片化<\/b>。<ruby>米国<rt>べいこく<\/rt><\/ruby>はアウトソーシングによる有能な<ruby>公務<rt>こうむ<\/rt><\/ruby>員の喪失。<ruby>豪州<rt>ごうしゅう<\/rt><\/ruby>は行き過ぎた<ruby>分権化<rt>ぶんけんか<\/rt><\/ruby>。<\/p>"]},"4-6 Purchaser/Providerの条件":{"id":"4-6 Purchaser/Providerの条件","h":"4-6 Purchaser/Providerの条件","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-6 Purchaser/Providerモデルの条件<\/b>（p.30）<\/div><div class=\"ln\">1．市場、競争環境<\/div><div class=\"ln\">2．情報（コスト・質）<\/div><div class=\"ln\">3．取引コスト<\/div><div class=\"ln\">⇓<\/div><div class=\"ln\">アウトソースの可否は、サービスの種類、地域の特性、時代の変化等によって決まる<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">条件を満たせば NPM は機能する。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>3-9 のモデルが機能するための3条件。講義の PFI の「2年かかる」話は、3つ目の<b>取引コスト<\/b>の具体例。条件がそろわない分野（例えば提供者が一社しかない地方）では、外部委託がかえって高くつく。<\/p>"]},"購入者・提供者の条件":{"id":"購入者・提供者の条件","h":"購入者・提供者の条件","part":"重要概念展开","sect":"NPMの評価","blocks":["<p>購入者・提供者モデルが機能する条件は、①市場と競争環境が存在すること ②コストと質についての情報が得られること ③取引コスト（契約・監視にかかる費用）が小さいこと。これらを満たせば NPM は機能するが、満たさない分野に無理に適用すると失敗する。アウトソースすべきかどうかは、サービスの種類、地域の特性、時代の変化で決まる。<\/p>"]},"4-7 NPMの本質は集権":{"id":"4-7 NPMの本質は集権","h":"4-7 NPMの本質は集権","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">NPM の本質は<ruby>集権<rt>しゅうけん<\/rt><\/ruby><\/div><div class=\"ln\" style=\"--in:0\">政治化、<ruby>集権<rt>しゅうけん<\/rt><\/ruby>化<\/div><div class=\"ln\" style=\"--in:0\"><ruby>分権<rt>ぶんけん<\/rt><\/ruby>化だけではない<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>写真なし。次の 4-8 のスライドと一体の話。NPM は<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化・規制緩和の改革と思われがちだが、政策決定と目標設定の権限は政治家のもとに集められる。<\/p>"]},"NPMは政治改革":{"id":"NPMは政治改革","h":"NPMは政治改革","part":"重要概念展开","sect":"NPMの評価","blocks":["<p>講義の重要な論点。NPM はしばしば「<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化・規制緩和」の改革と理解されるが、実際には二つの顔がある。政治家は「官僚は権限が強すぎる」「官僚機構は非効率」と強く意識しており、そこから、<\/p>","<p><b>マネジメント<\/b>の側面：Decentralization（<ruby>分権<rt>ぶんけん<\/rt><\/ruby>化）、Deregulation（規制緩和）、Delegation（<ruby>委任<rt>いにん<\/rt><\/ruby>）→ <b>効率性(Efficiency)<\/b><br><b>政治化<\/b>の側面：Centralization（<ruby>集権<rt>しゅうけん<\/rt><\/ruby>化）、Coordination（調整）、Control（統制）→ <b>応答性(Responsiveness)<\/b><\/p>","<p>という二つの方向が同時に進む。実施はエージェンシーに任せる一方で、政策の決定権と目標設定は政治家のもとに集める。つまり NPM の本質は<b>政治主導による<ruby>集権<rt>しゅうけん<\/rt><\/ruby>化<\/b>でもあり、官僚から政治家へ権力を移す政治改革である。<\/p>"]},"4-8 NPMは政治改革":{"id":"4-8 NPMは政治改革","h":"4-8 NPMは政治改革","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-8 NPMは政治改革<\/b>（p.32）<\/div><div class=\"ln\">政治家は以下を強く意識<\/div><div class=\"ln\">　(1)官僚は強すぎる権限を持つ<\/div><div class=\"ln\">　(2)官僚機構は非効率<\/div><div class=\"ln\">[マネジメント] Decentralization / Deregulation / Delegation → <b>Efficiency<\/b><\/div><div class=\"ln\">[政治化] Centralization / Coordination / Control → <b>Responsiveness<\/b><\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">法律で<ruby>枠組<rt>わくぐ<\/rt><\/ruby>みを作り、政治家が主導し、官僚が執行する。<\/div><div class=\"ln\" style=\"--in:0\">応答性（Responsiveness）。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>この講義で一番重要なスライドのひとつ。NPM には「任せて効率を上げる」面と、「政治家に権限を集めて官僚を言うことを聞かせる」面がある。後者が講義で言う「NPMの本質は<ruby>集権<rt>しゅうけん<\/rt><\/ruby>」（4-7）。2-4 の官僚優位論（官僚が強すぎる）を受けて、政治主導を実現する改革として読むとわかりやすい。<\/p>"]},"4-9 ウェストミンスター・モデル":{"id":"4-9 ウェストミンスター・モデル","h":"4-9 ウェストミンスター・モデル","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-9 ウェストミンスター・モデル<\/b>（p.33）<\/div><div class=\"ln\">1．議会の<ruby>優越<rt>ゆうえつ<\/rt><\/ruby><\/div><div class=\"ln\">2．内閣の連帯責任<\/div><div class=\"ln\">3．大臣の議会に対するアカウンタビリティ<\/div><div class=\"ln\">4．<ruby>公務<rt>こうむ<\/rt><\/ruby>員の政治的中立性<\/div><div class=\"ln\">Rhodes (2005)<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\"><ruby>米国<rt>べいこく<\/rt><\/ruby>：政治家が官僚を選べる（政治<ruby>任用<rt>にんよう<\/rt><\/ruby>）。<\/div><div class=\"ln\" style=\"--in:0\">独・仏・日：政治家と官僚が一体 → NPM は限定的。<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p><ruby>英国<rt>えいこく<\/rt><\/ruby>型の<ruby>議院<rt>ぎいん<\/rt><\/ruby>内閣制。大臣が官僚を統制し議会に責任を負う線がはっきりしているので、エージェンシー化しても「誰が責任者か」が曖昧になりにくい。口頭では、<ruby>米国<rt>べいこく<\/rt><\/ruby>（政治<ruby>任用<rt>にんよう<\/rt><\/ruby>で官僚を選べる）、独・仏・日（政治家と官僚が一体）との比較があった。<\/p>"]},"ウェストミンスター・モデル":{"id":"ウェストミンスター・モデル","h":"ウェストミンスター・モデル","part":"重要概念展开","sect":"NPMの評価","blocks":["<p>R・A・W・ローズ（2005）が整理した<ruby>英国<rt>えいこく<\/rt><\/ruby>型<ruby>議院<rt>ぎいん<\/rt><\/ruby>内閣制の特徴：①議会の<ruby>優越<rt>ゆうえつ<\/rt><\/ruby> ②内閣の連帯責任 ③大臣の議会に対するアカウンタビリティ ④<ruby>公務<rt>こうむ<\/rt><\/ruby>員の政治的中立性。この体制では、大臣が官僚を統制し、議会に責任を負う線がはっきりしているので、NPM のエージェンシー化と相性がよい。<\/p>","<p>講義では<ruby>政官<rt>せいかん<\/rt><\/ruby>関係の国際比較も出た。<ruby>米国<rt>べいこく<\/rt><\/ruby>は政権が幹部官僚を<b>政治<ruby>任用<rt>にんよう<\/rt><\/ruby><\/b>で入れ替えられる。これに対し独・仏・日は、政治家と官僚が人材面でも政策面でも一体化（融合）しており、NPM の効果は限定的だったとされる。<\/p>"]},"4-10 講師の見解":{"id":"4-10 講師の見解","h":"4-10 講師の見解","part":"講義ノート","sect":"第4章 NPMの評価","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>4-10 NPMについての個人的な見解<\/b>（p.34）<\/div><div class=\"ln\">1．全てに当てはまるモデルはない、魔法の杖はない<\/div><div class=\"ln\">2．ファッションでも、レトリックでもない<\/div><div class=\"ln\">3．仮定と前提条件を理解する必要<\/div><div class=\"ln\">4．改革プロセスの順序が重要<\/div><div class=\"ln\">5．官と民の根本的な相違を理解する（ただし、それは、時とともに変化する）<\/div><\/blockquote>","<h4 class=\"lab\">解説<\/h4>","<p>3-1 の問いへの答え。「魔法の杖」論も「レトリック」論も退けて、条件付きで有効な道具として理解せよ、という立場。<\/p>"]},"講師の見解":{"id":"講師の見解","h":"講師の見解","part":"重要概念展开","sect":"NPMの評価","blocks":["<p>①すべてに当てはまるモデルはない（魔法の杖はない）②NPM は一時の流行でもレトリックでもない ③仮定と前提条件を理解する必要がある ④改革プロセスの<b>順序<\/b>が重要 ⑤官と民の根本的な相違を理解する（ただしそれは時とともに変化する）。<\/p>","<p>3-11 の日本評価と合わせると、講師の立場は「NPM は正しく理解すれば有効だが、日本では形だけ導入され、<ruby>公務<rt>こうむ<\/rt><\/ruby>員のカルチャーは変わらず、むしろ評価や補助金処理などで手続重視が強まっている」というもの。<\/p>"]},"5-1 NPMに代わる仕組み":{"id":"5-1 NPMに代わる仕組み","h":"5-1 NPMに代わる仕組み","part":"講義ノート","sect":"第5章 ガバナンス論","blocks":["<blockquote class=\"slide\"><div class=\"ln\"><b>5-1 NPMに代わる仕組みとは<\/b>？（p.36）<\/div><div class=\"ln\">1．組織や公共サービスのパフォーマンスはどうすれば改善するか？<\/div><div class=\"ln\">2．公共サービスを提供するためには、どのような組織形態が最適か？<\/div><div class=\"ln\">3．生産性を向上させるためには、どのようなインセンティブが必要か？<\/div><div class=\"ln\">4．持続的な公サービスの提供システムは、どのようにすれば確保できるか？<\/div><div class=\"ln\">5．公的部門のマネージャーは、どうすれば結果について「アカウンタブル」になるか？<\/div><\/blockquote>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\">
