ass=\"ln\" style=\"--in:0\">コスト削減（cost reduction）：紙<\/div><div class=\"ln\" style=\"--in:0\">行政の効率化（efficiency in administration）<\/div><div class=\"ln\" style=\"--in:0\">公共サービス提供の改善（improved public service delivery）<\/div><div class=\"ln\" style=\"--in:0\">社会のデジタル・トランスフォーメーション（DX）：社会そのものを変え、より革新的にする<\/div><div class=\"ln\" style=\"--in:0\">民主的な参加の支援（supporting democratic engagement）：政府のプロセスを透明にする<\/div><div class=\"ln\" style=\"--in:0\">〔例〕日本：高齢化社会（労働力不足）<\/div><div class=\"ln\" style=\"--in:0\">〔例〕先進国：効率化が目的<\/div><div class=\"ln\" style=\"--in:0\">〔例〕途上国：電子投票（e-voting）。選挙を公正にするため<\/div><div class=\"ln\" style=\"--in:0\">日本：紙の文化（culture of paper）<\/div><div class=\"ln\" style=\"--in:0\">ワンストップ・サービス（one-stop services）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>電子政府の目的を5つ挙げ、国によって重点が違うことを示している。日本では高齢化による<b>労働力不足<\/b>（自治体職員も減る）が最大の動機で、少ない人手で行政を回すために効率化が必要になる。途上国では、<b>電子投票<\/b>などで選挙の不正を防ぎ、政府の透明性を高めることが重要な目的になる（メモの「e-boarding」は e-voting の聞き違いと思われる）。日本の課題として挙がった<b>紙の文化<\/b>と<b>ワンストップ・サービス<\/b>は、後半の出生届・死亡届の話で具体化される。<\/p>"]},"電子投票":{"id":"電子投票","h":"電子投票","part":"事例展开","sect":"","blocks":["<p>エストニアは2005年に、国政レベルの選挙で世界で初めてインターネット投票を導入し、近年は投票の半数前後がオンラインで行われている。インドやブラジルでは、紙の投票用紙の改ざんや集計の不正を防ぐため、電子投票機が全国で使われている。日本では2002年に地方選挙での電子投票機の利用が認められたが、機器トラブルや費用の問題で広がらず、現在は実施する自治体がほとんどない。<\/p>"]},"ワンストップ・サービス":{"id":"ワンストップ・サービス","h":"ワンストップ・サービス","part":"重要概念展开","sect":"電子政府","blocks":["<p>複数の行政機関にまたがる手続きを、一度の申請でまとめて完了できるようにすること。引っ越し、出生、死亡、相続などのライフイベントでは、住所変更、保険、年金、税、児童手当などの手続きが市区町村、国、民間事業者に分散しているので、住民の負担が大きい。実現するには、各機関のシステムと台帳をつなぎ、同じ情報を何度も出させない（ワンスオンリー）仕組みが必要になる。日本では引っ越しワンストップ（マイナポータルでの転出届）や死亡・相続ワンストップが進められている。<\/p>"]},"国家の三要素":{"id":"国家の三要素","h":"国家の三要素","part":"講義ノート","sect":"国家と住民登録","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">国家の要素の理論（elements of statehood theory）<\/div><div class=\"ln\" style=\"--in:0\">ゲオルク・イェリネック：（これらが）なければ国家ではない<\/div><div class=\"ln\" style=\"--in:0\"><b>領域<\/b>（territory）<\/div><div class=\"ln\" style=\"--in:1\">地理的な範囲<\/div><div class=\"ln\" style=\"--in:1\">天然資源、気候、戦略的な位置（農業、貿易、防衛、全体的な発展に影響する）<\/div><div class=\"ln\" style=\"--in:1\">〔例〕最近の<ruby>中国<rt>ちゅうごく<\/rt><\/ruby>の洪水 ← 温暖化 ← 経済発展<\/div><div class=\"ln\" style=\"--in:1\">国境をめぐるトラブル<\/div><div class=\"ln\" style=\"--in:0\"><b>国民<\/b>（people, population）<\/div><div class=\"ln\" style=\"--in:1\">国の住民<\/div><div class=\"ln\" style=\"--in:1\">〔例〕一人っ子政策：1人の子どもに親と祖父母の責任が集中しすぎる<\/div><div class=\"ln\" style=\"--in:1\">子どもの数から将来の人口を推計する<\/div><div class=\"ln\" style=\"--in:1\">〔例〕最も深刻なのは<ruby>韓国<rt>かんこく<\/rt><\/ruby>：100年で人口が半分に<\/div><div class=\"ln\" style=\"--in:1\">〔例〕タイも急速に減少<\/div><div class=\"ln\" style=\"--in:1\">〔例〕「日本人ファースト」、一方で産業は労働力を必要としている<\/div><div class=\"ln\" style=\"--in:0\"><b>主権・統治<\/b>（government, sovereignty）<\/div><div class=\"ln\" style=\"--in:1\">社会を組織するリーダーシップと法の体系<\/div><div class=\"ln\" style=\"--in:1\">構造、安全、サービスを提供し、資源の管理を決める<\/div><div class=\"ln\" style=\"--in:1\">新しい考え方：<b>ソブリン AI<\/b>（sovereign AI）<\/div><div class=\"ln\" style=\"--in:2\">AI の中核は国内に置くべき<\/div><div class=\"ln\" style=\"--in:2\">〔例〕習近平とトランプ：超高度な AI は政府が守るべき、規制を強める<\/div><div class=\"ln\" style=\"--in:3\">しかし競争は止められない<\/div><div class=\"ln\" style=\"--in:2\">〔例〕アメリカとイラン・イスラエルの戦争での AI 利用<\/div><div class=\"ln\" style=\"--in:3\">人間の判断なしに人を殺せる兵器をどう規制するか<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>ドイツの国法学者イェリネック（1851-1911）の<b>国家三要素説<\/b>（メモでは「2 elements」だが三要素）。<b>領域・国民・主権<\/b>の三つがそろって初めて国家と言える。講師は、住民登録が「国民」という要素を国家が具体的に把握するための仕組みであることを示すために、この古典的な理論から入ったと思われる。<\/p>","<p>各要素に現代の論点がついている。領域は気候変動や国境紛争、国民は少子化と人口減少、外国人労働者をめぐる政治、主権は<b>ソブリン AI<\/b>（AI の基盤やデータを国内で管理すべきだという考え方）と AI 兵器の規制。電子政府の授業らしく、主権の問題が「デジタル空間を誰が支配するか」にまで広がっている。<\/p>","<p>貼り付けた図は政治学導論のマップで、同じ三要素（国土・国権・国族/国民）に「国家：統治体系」を加えて整理している。<\/p>"]},"国家三要素説":{"id":"国家三要素説","h":"国家三要素説","part":"重要概念展开","sect":"国家と住民","blocks":["<p>イェリネックが『一般国家学』（1900）で示した、国家を<b>領域<\/b>（Staatsgebiet）・<b>国民<\/b>（Staatsvolk）・<b>主権／国家権力<\/b>（Staatsgewalt）の三要素で定義する理論。国際法で国家の要件を定めたモンテビデオ条約（1933）は、これに「他国と関係を取り結ぶ能力」を加えた四要件を挙げている。電子政府の文脈では、「国民」を把握する住民登録、「主権」をデジタル空間に及ぼすソブリン AI・データ主権などに応用して考えられる。<\/p>"]},"中国の洪水":{"id":"中国の洪水","h":"中国の洪水","part":"事例展开","sect":"","blocks":["<p><ruby>中国<rt>ちゅうごく<\/rt><\/ruby>では近年、<ruby>長江<rt>ちょうこう<\/rt><\/ruby>・<ruby>黄河<rt>こうが<\/rt><\/ruby>流域や<ruby>華北<rt>かほく<\/rt><\/ruby>などで記録的な豪雨と洪水が相次いでいる。講師は、経済発展に伴う温暖化が気候を変え、領域（国土）の条件そのものに影響している例として挙げた。<\/p>"]},"ソブリンAI":{"id":"ソブリンAI","h":"ソブリンAI","part":"重要概念展开","sect":"国家と住民","blocks":["<p>国家が、AI の基盤となる計算資源、データ、モデルを自国の管理下に置くべきだという考え方。他国の企業や政府が提供する AI に行政や安全保障を依存すると、データの流出、サービスの停止、価値観の押しつけといったリスクがあるため、各国が国産の大規模言語モデルやデータセンターの整備を進めている。一方で、AI 開発は国際競争でもあるので、規制を強めれば開発が遅れるというジレンマがある（講義の「競争は止められない」）。<\/p>"]},"一人っ子政策":{"id":"一人っ子政策","h":"一人っ子政策","part":"事例展开","sect":"","blocks":["<p><ruby>中国<rt>ちゅうごく<\/rt><\/ruby>は1979年ごろから2015年まで、原則として夫婦一組に子ども一人に制限する政策をとった。人口抑制には効果があったが、急速な少子高齢化を招き、一人の子どもが両親と両方の祖父母の計6人を支える「4-2-1問題」が生じた。2016年に二人っ子、2021年に三人っ子まで認めたが、出生数の減少は止まっていない。<\/p>"]},"自律型致死兵器システム":{"id":"自律型致死兵器システム","h":"自律型致死兵器システム","part":"重要概念展开","sect":"国家と住民","blocks":["<p>人間の判断を介さずに、標的を選んで攻撃できる兵器（LAWS: Lethal Autonomous Weapons Systems）。国連の特定通常兵器使用禁止制限条約（CCW）の枠組みで規制が議論されているが、法的拘束力のある国際ルールはまだない。講義の「人間の判断なしに人を殺せる兵器をどう規制するか」がこの問題で、AI の軍事利用は国家主権の問題でもある。<\/p>"]},"韓国とタイの少子化":{"id":"韓国とタイの少子化","h":"韓国とタイの少子化","part":"事例展开","sect":"","blocks":["<p><ruby>韓国<rt>かんこく<\/rt><\/ruby>の合計特殊出生率は2023年に0.72で世界最低となり、2024年は0.75とわずかに上がったが、極めて低い水準が続いている ⚠。このままでは今世紀中に人口が大きく減ると推計されている（講義では「100年で半分」）。タイも出生率が1.0前後まで下がり、東南アジアで最も早く少子高齢化が進む国の一つになっている ⚠。<\/p>"]},"日本人ファーストと外国人労働者":{"id":"日本人ファーストと外国人労働者","h":"日本人ファーストと外国人労働者","part":"事例展开","sect":"","blocks":["<p>2025年の参議院選挙で、参政党が「日本人ファースト」を掲げて議席を大きく伸ばし、外国人政策が争点になった。一方で、介護、建設、農業、製造業などは人手不足が深刻で、技能実習制度に代わる「育成就労制度」（2027年開始予定）などで外国人労働者の受け入れが続いている。講義では、国民という要素をめぐる政治と、労働力の必要との矛盾として挙げられた。<\/p>"]},"住民登録の国際比較":{"id":"住民登録の国際比較","h":"住民登録の国際比較","part":"講義ノート","sect":"国家と住民登録","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">住民登録のバリエーション（variation of resident registration）<\/div><div class=\"ln\" style=\"--in:0\"><b>日本<\/b><\/div><div class=\"ln\" style=\"--in:1\">戸籍（household registration system）＋住民基本台帳（basic resident register）の二本立て（dual）<\/div><div class=\"ln\" style=\"--in:1\">マイナンバーカードは国民 ID カード（national ID）ではない（なぜ？？）<\/div><div class=\"ln\" style=\"--in:2\">公共サービスのシステムをつなぐために使われる？？<\/div><div class=\"ln\" style=\"--in:2\">マイナンバーカードを携帯する義務はない<\/div><div class=\"ln\" style=\"--in:3\"><code>导致了问题：比如事故死亡，难以确认identity<\/code><\/div><div class=\"ln\" style=\"--in:1\">現在：（戸籍は）すべてスキャンして電子化され、コンビニで証明書を印刷できる<\/div><div class=\"ln\" style=\"--in:2\">利用者は電子版を求めることもできるが、役所の内部はほとんど紙ベース？（聞き違いかも）<\/div><div class=\"ln\" style=\"--in:1\">今年から読み仮名の記載が始まった<\/div><div class=\"ln\" style=\"--in:0\"><b><ruby>韓国<rt>かんこく<\/rt><\/ruby><\/b><\/div><div class=\"ln\" style=\"--in:1\">戸籍＋住民登録<\/div><div class=\"ln\" style=\"--in:1\">戸籍（戸主制）は廃止 → 家族関係登録へ<\/div><div class=\"ln\" style=\"--in:0\">機能：人口を記録し、住所を確認する<\/div><div class=\"ln\" style=\"--in:1\">① 国勢調査（national census）<\/div><div class=\"ln\" style=\"--in:1\">② 住民に住所を政府へ登録させる<\/div><div class=\"ln\" style=\"--in:0\"><b>アメリカ<\/b><\/div><div class=\"ln\" style=\"--in:1\">全国的な住民登録はない<\/div><div class=\"ln\" style=\"--in:1\">社会保障番号（Social Security Number）が使われる<\/div><div class=\"ln\" style=\"--in:0\"><b><ruby>中国<rt>ちゅうごく<\/rt><\/ruby>など<\/b><\/div><div class=\"ln\" style=\"--in:1\">国民 ID（national ID）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>国家が住民を把握する方法は国によってかなり違う。日本は、家族単位で親族関係（出生・婚姻・死亡）を記録する<b>戸籍<\/b>と、住所を記録する<b>住民基本台帳<\/b>の二本立て。<ruby>韓国<rt>かんこく<\/rt><\/ruby>も同じ仕組みだったが、戸主を中心とする戸籍制度が男女平等に反するとして2008年に廃止し、個人単位の<b>家族関係登録簿<\/b>に移行した。アメリカには全国的な住民登録がなく、もともと年金のための番号だった<b>社会保障番号(SSN)<\/b>が事実上の個人識別番号になっている。<ruby>中国<rt>ちゅうごく<\/rt><\/ruby>は戸籍（戸口）と、携帯義務のある<b>居民身分証<\/b>をもつ。<\/p>","<p>日本のマイナンバーカードは、取得も携帯も任意なので、法的な意味での国民 ID カードではない。講師が挙げた「事故で亡くなった人の身元確認が難しい」は、携帯義務がないことの裏返しの問題。「今年から読み仮名」は、2025年5月施行の改正戸籍法で、戸籍に氏名の振り仮名が記載されるようになったこと。<\/p>"]},"戸籍":{"id":"戸籍","h":"戸籍","part":"重要概念展开","sect":"住民登録制度","blocks":["<p>日本の戸籍は、夫婦と未婚の子を単位として、出生・婚姻・離婚・死亡などの身分関係を記録・公証する制度（戸籍法）。本籍地の市区町村が管理する。戸籍をもつのは日本国籍者だけで、国籍の証明にもなる。世界的には、家族単位の身分登録をもつ国は少なく、東アジア（日本、かつての<ruby>韓国<rt>かんこく<\/rt><\/ruby>、<ruby>台湾<rt>たいわん<\/rt><\/ruby>、<ruby>中国<rt>ちゅうごく<\/rt><\/ruby>の戸口）に特徴的な制度。1994年以降コンピュータ化が進み、2024年からは本籍地以外の市区町村でも戸籍証明書を取れるようになった（広域交付）。2025年からは氏名の振り仮名も記載されている。<\/p>"]},"韓国の家族関係登録":{"id":"韓国の家族関係登録","h":"韓国の家族関係登録","part":"事例展开","sect":"","blocks":["<p><ruby>韓国<rt>かんこく<\/rt><\/ruby>は日本統治期に導入された戸籍制度を戦後も維持していたが、戸主を中心に父系で家族を編成する<b>戸主制<\/b>が男女平等に反するとして、2005年に憲法裁判所が憲法不合致と判断し、2008年に戸籍制度を廃止した。代わりに、個人単位で親族関係を記録する<b>家族関係登録簿<\/b>が導入された。住所の把握は、別に住民登録制度で行い、全国民に住民登録番号（13桁）が付けられている。<\/p>"]},"住民基本台帳":{"id":"住民基本台帳","h":"住民基本台帳","part":"重要概念展开","sect":"住民登録制度","blocks":["<p>市区町村が、住民の居住関係（氏名、生年月日、性別、住所、世帯など）を記録する台帳（住民基本台帳法）。住民票の写しの交付、選挙人名簿、国民健康保険、児童手当、学齢簿など、住民向けの行政サービスの基礎になる。2012年からは外国人住民も対象になった。戸籍が「身分関係」を、住民基本台帳が「居住関係」を記録するという役割分担で、両者は戸籍の附票で結びついている。<\/p>"]},"アメリカの社会保障番号":{"id":"アメリカの社会保障番号","h":"アメリカの社会保障番号","part":"事例展开","sect":"","blocks":["<p>アメリカには全国的な住民登録制度がなく、1936年に年金（社会保障）のために作られた9桁の社会保障番号（SSN）が、税、銀行口座、信用情報、雇用などで事実上の国民番号として使われている。本来の目的外にまで広く使われた結果、SSN を盗まれると多くの手続きでなりすましができてしまい、個人情報の盗用（identity theft）が大きな社会問題になっている。<\/p>"]},"マイナンバー制度":{"id":"マイナンバー制度","h":"マイナンバー制度","part":"重要概念展开","sect":"住民登録制度","blocks":["<p>2013年のマイナンバー法に基づき、2015年に住民票をもつ全員に12桁の個人番号が付けられ、2016年から利用が始まった。利用範囲は、法律で<b>社会保障・税・災害対策<\/b>の3分野に限定されている（その後、拡大の改正が続いている）。<b>マイナンバー<\/b>（番号）と<b>マイナンバーカード<\/b>（ICカード）は別物で、番号は全員にあるが、カードの取得は任意。カードは本人確認書類、マイナポータルへのログイン、健康保険証（マイナ保険証）、コンビニ交付などに使える。<\/p>","<p>設計上の特徴は<b>分散管理<\/b>で、個人情報を一つのデータベースに集めず、各機関が自分のデータを持ったまま、情報提供ネットワークシステムを通じて必要なときだけやりとりする。機関間のやりとりにはマイナンバーそのものを使わず、機関ごとに異なる「符号」を使うので、一つの番号から全データを引き出せない仕組みになっている。<\/p>"]},"戸籍の振り仮名":{"id":"戸籍の振り仮名","h":"戸籍の振り仮名","part":"事例展开","sect":"","blocks":["<p>2023年の戸籍法改正で、戸籍に氏名の振り仮名を記載することになり、2025年5月26日に施行された。施行後1年間は本人が振り仮名を届け出ることができ、届け出がない場合は市区町村が住民票などの情報をもとに記載する。氏名の読み方を行政が把握していなかったことが、デジタル化（システムでの名寄せや検索）の障害になっていたため。いわゆる「キラキラネーム」の読み方の許容範囲も議論になった。<\/p>"]},"コンビニ交付":{"id":"コンビニ交付","h":"コンビニ交付","part":"事例展开","sect":"","blocks":["<p>マイナンバーカードを使って、全国のコンビニのマルチコピー機で住民票の写し、印鑑登録証明書、戸籍証明書などを取得できるサービス。2010年に始まり、現在は多くの市区町村が対応している。役所の開庁時間外や遠方からでも証明書を取れるので、窓口の負担軽減にもなる。講義の「コンビニは社会インフラ」はこのこと。<\/p>"]},"出生届と死亡届":{"id":"出生届と死亡届","h":"出生届と死亡届","part":"講義ノート","sect":"国家と住民登録","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">出生届<\/div><div class=\"ln\" style=\"--in:1\">2026年から電子化 ⚠<\/div><div class=\"ln\" style=\"--in:1\">なぜこんなに遅れたのか？<\/div><div class=\"ln\" style=\"--in:2\">病院がまったく違う記録を使っている。病院と自治体をつなぐのは簡単ではない（<code>也许是因为私立医院很多？中国是怎么样的？<\/code>）<\/div><div class=\"ln\" style=\"--in:0\">死亡届<\/div><div class=\"ln\" style=\"--in:1\">これも紙ベース<\/div><div class=\"ln\" style=\"--in:1\">死亡・相続手続のオンライン・デジタル化｜デジタル庁<\/div><div class=\"ln\" style=\"--in:1\">mhlw.go.jp/content/10808000/001583511.pdf<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>出生届と死亡届は、医師や助産師が書く<b>出生証明書・死亡診断書<\/b>と一体の様式になっているため、医療機関と自治体の両方をデジタルでつながないとオンライン化できない。日本の病院・診療所は民間の医療法人が多く、電子カルテの仕様もばらばらなので、つなぐのが難しい（ご推察のとおり）。デジタル庁は、死亡に伴う多数の手続き（年金、保険、相続など）をまとめてオンラインでできるようにする取り組みを進めている。<\/p>","<p><ruby>中国<rt>ちゅうごく<\/rt><\/ruby>では、出生医学証明の電子化と、出生届・戸口登録・医療保険加入などをまとめて行う「出生一件事」のワンストップ化が、2020年代に各地で進んだ。中央が標準を決めて一斉に進められる点が、日本との違い。<\/p>"]},"出生届・死亡届のオンライン化":{"id":"出生届・死亡届のオンライン化","h":"出生届・死亡届のオンライン化","part":"事例展开","sect":"","blocks":["<p>出生届・死亡届は、医師などが書く出生証明書・死亡診断書と一体の紙の様式で、窓口への提出が原則だった。政府は、医療機関から電子的に証明書を送る仕組みを含めてオンライン化を進めており、講義では出生届は2026年から電子化と紹介された ⚠。死亡に伴う手続きについては、デジタル庁が「死亡・相続ワンストップサービス」として、遺族が複数の機関に何度も届け出なくて済むようにする取り組みを進めている。<\/p>"]},"住基ネットとLG-WAN":{"id":"住基ネットとLG-WAN","h":"住基ネットとLG-WAN","part":"講義ノート","sect":"国家と住民登録","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">住民基本台帳ネットワーク（basic resident registration network）<\/div><div class=\"ln\" style=\"--in:1\">2002年<\/div><div class=\"ln\" style=\"--in:1\">住民であることを証明し（notarize residential relationships）、ネットワーク化<\/div><div class=\"ln\" style=\"--in:1\">全国的な本人確認（nation-wide identification）を可能にする<\/div><div class=\"ln\" style=\"--in:0\">LG-WAN<\/div><div class=\"ln\" style=\"--in:1\">高度な情報流通（advanced information distribution）<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p><b>住基ネット<\/b>は2002年に稼働した、全国の市区町村の住民基本台帳をつなぐネットワーク。氏名・生年月日・性別・住所の4情報と<b>住民票コード<\/b>を全国で共有し、住所地以外での住民票の取得や、国の機関による本人確認を可能にした。導入時は、プライバシー侵害を理由に接続を拒否する自治体や違憲訴訟が相次いだ（最高裁は2008年に合憲と判断）。<b>LG-WAN<\/b>（総合行政ネットワーク）は、自治体同士や国の府省をつなぐ、インターネットから分離された行政専用の閉域ネットワーク。<\/p>"]},"住基ネットとLG-WAN (2)":{"id":"住基ネットとLG-WAN (2)","h":"住基ネットとLG-WAN","part":"重要概念展开","sect":"住民登録制度","blocks":["<p><b>住基ネット<\/b>（住民基本台帳ネットワークシステム）は、2002年に稼働した全国の住民基本台帳をつなぐネットワークで、4情報（氏名・生年月日・性別・住所）と住民票コードを共有する。マイナンバーの付番や本人確認の基盤にもなっている。運営は地方公共団体情報システム機構（J-LIS）。<b>LG-WAN<\/b>（Local Government Wide Area Network）は、自治体と国の府省をつなぐ行政専用の閉域ネットワークで、インターネットから分離されていることでセキュリティを確保している。<\/p>"]},"番号の統合":{"id":"番号の統合","h":"番号の統合","part":"講義ノート","sect":"マイナンバー","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政府のシステムはすべて孤立していて、番号もすべて違い、協力しない。公式なつながりがない<\/div><div class=\"ln\" style=\"--in:0\">しかし古い番号を捨てるわけではない<\/div><div class=\"ln\" style=\"--in:1\">移行には費用がかかる<\/div><div class=\"ln\" style=\"--in:1\">個人のセキュリティ：マイナンバーがハッキングされれば、すべてのデータベースに入られる<\/div><div class=\"ln\" style=\"--in:0\">〔例〕先進国は紙での行政の歴史が長いので、転換が難しい<\/div><div class=\"ln\" style=\"--in:0\">〔例〕官僚制は変わりたがらない。変えるのは簡単ではない<\/div><div class=\"ln\" style=\"--in:0\">〔例〕途上国：最初からデジタル<\/div><div class=\"ln\" style=\"--in:0\">コンビニ＝社会インフラ<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>マイナンバー以前、日本の行政は、年金は基礎年金番号、税は各税務署の整理番号、医療は保険証の記号番号、というように、制度ごとに別の番号で人を管理していて、つなぐ公式な仕組みがなかった。マイナンバーはこれらを横断して結びつけるための番号だが、既存の番号を廃止したわけではなく、各制度は自分の番号を使い続け、マイナンバーで紐づけている。全部を一つの番号に置き換えないのは、移行コストと、一つの番号が漏れると全部が芋づる式に漏れるリスクのため。実際には、各機関は直接マイナンバーでデータを照会するのではなく、機関ごとに異なる<b>符号<\/b>を使って情報提供ネットワークシステム経由でやりとりする<b>分散管理<\/b>の設計になっている。<\/p>","<p>例として挙がったのは、紙の歴史が長い先進国ほど転換が難しく、途上国はいきなりデジタルから始められる（<b>リープフロッグ<\/b>）という対比。コンビニが<b>社会インフラ<\/b>というのは、住民票などの証明書をコンビニのマルチコピー機で取れる<b>コンビニ交付<\/b>が、役所の窓口の代わりになっていることを指す。<\/p>"]},"プル型からプッシュ型へ":{"id":"プル型からプッシュ型へ","h":"プル型からプッシュ型へ","part":"講義ノート","sect":"プッシュ型行政","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政府がシステムで行っていること：<\/div><div class=\"ln\" style=\"--in:0\">災害関連のサービス、支援<\/div><div class=\"ln\" style=\"--in:1\">プル（pull）ではなくプッシュ（push）<\/div><div class=\"ln\" style=\"--in:1\">その情報を必要としている人に<\/div><div class=\"ln\" style=\"--in:0\">〔例〕妊娠届<\/div><div class=\"ln\" style=\"--in:0\">〔例〕妊婦に役立つ情報（無料サービスなど）をプッシュで届ける<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>従来の行政サービスは、住民が自分で制度を調べて窓口に申請しないと受けられない<b>プル型<\/b>（申請主義）だった。<b>プッシュ型<\/b>は、行政が持っている情報から対象者を特定し、必要な情報や給付を行政の側から届ける方式。妊娠届を出した人に、妊婦健診の助成や出産・子育ての支援を案内するのが典型例。災害時の支援制度の案内も、被災者が自分で探さなくても届くようにすることが目指されている。先週の<ruby>韓国<rt>かんこく<\/rt><\/ruby>の例（子どもが生まれると受けられる手当がポータルで案内される）も同じ考え方。<\/p>"]},"プッシュ型行政":{"id":"プッシュ型行政","h":"プッシュ型行政","part":"講義ノート","sect":"","blocks":["<h5>プル型からプッシュ型へ<\/h5>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">政府がシステムで行っていること：<\/div><div class=\"ln\" style=\"--in:0\">災害関連のサービス、支援<\/div><div class=\"ln\" style=\"--in:1\">プル（pull）ではなくプッシュ（push）<\/div><div class=\"ln\" style=\"--in:1\">その情報を必要としている人に<\/div><div class=\"ln\" style=\"--in:0\">〔例〕妊娠届<\/div><div class=\"ln\" style=\"--in:0\">〔例〕妊婦に役立つ情報（無料サービスなど）をプッシュで届ける<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>従来の行政サービスは、住民が自分で制度を調べて窓口に申請しないと受けられない<b>プル型<\/b>（申請主義）だった。<b>プッシュ型<\/b>は、行政が持っている情報から対象者を特定し、必要な情報や給付を行政の側から届ける方式。妊娠届を出した人に、妊婦健診の助成や出産・子育ての支援を案内するのが典型例。災害時の支援制度の案内も、被災者が自分で探さなくても届くようにすることが目指されている。先週の<ruby>韓国<rt>かんこく<\/rt><\/ruby>の例（子どもが生まれると受けられる手当がポータルで案内される）も同じ考え方。<\/p>"]},"妊娠届とプッシュ型支援":{"id":"妊娠届とプッシュ型支援","h":"妊娠届とプッシュ型支援","part":"事例展开","sect":"","blocks":["<p>妊娠した人は市区町村に妊娠届を出し、母子健康手帳を受け取る。自治体はこれをきっかけに、妊婦健診の助成券、面談、出産・子育て応援給付（妊娠時・出生時の計10万円相当、2025年度から「妊婦のための支援給付」として制度化）などを案内する。マイナポータルや自治体アプリで、妊娠・出産・子育ての段階に応じた情報を本人に届ける取り組みも進んでいる。<\/p>"]},"ベース・レジストリ":{"id":"ベース・レジストリ","h":"ベース・レジストリ","part":"講義ノート","sect":"","blocks":["<h5>ベース・レジストリ<\/h5>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">今取り組んでいること：ベース・レジストリ（base registry）<\/div><div class=\"ln\" style=\"--in:0\">日本：たくさんの免許・資格がある。運転免許、弁護士、教員、会社……<\/div><div class=\"ln\" style=\"--in:0\">しかしつながっていない<\/div><div class=\"ln\" style=\"--in:0\">人、法人、土地とインフラ、その他（交通、気候）<\/div><div class=\"ln\" style=\"--in:0\">⇒ 統合する<\/div><div class=\"ln\" style=\"--in:0\">〔例〕最近の事件：<ruby>富山<rt>とやま<\/rt><\/ruby>市が国勢調査を改ざんして人口を増やした<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p><b>ベース・レジストリ<\/b>は、社会の基本となるデータ（人、法人、土地、住所など）を、正確で最新の状態で一元的に管理し、さまざまな行政サービスから参照できるようにした台帳のこと。デンマークやエストニアが先進例で、日本ではデジタル庁が整備を進めている。現在は、運転免許、弁護士・教員などの資格、会社の登記などが、それぞれ別の機関の台帳でばらばらに管理されていて、引っ越しや結婚のたびに住民が個別に届け出なければならない。これをつなげば、一度の届出で済むようになる。<\/p>","<p><ruby>富山<rt>とやま<\/rt><\/ruby>市の事件は、2025年の国勢調査で、市の職員が人口を水増しした疑いで総務省に告発されたもの（事例参照）。基本となるデータの正確さが行政全体の信頼を左右することを示す例として挙げられたと思われる。<\/p>"]},"ベース・レジストリ (2)":{"id":"ベース・レジストリ (2)","h":"ベース・レジストリ","part":"講義ノート","sect":"ベース・レジストリ","blocks":["<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">今取り組んでいること：ベース・レジストリ（base registry）<\/div><div class=\"ln\" style=\"--in:0\">日本：たくさんの免許・資格がある。運転免許、弁護士、教員、会社……<\/div><div class=\"ln\" style=\"--in:0\">しかしつながっていない<\/div><div class=\"ln\" style=\"--in:0\">人、法人、土地とインフラ、その他（交通、気候）<\/div><div class=\"ln\" style=\"--in:0\">⇒ 統合する<\/div><div class=\"ln\" style=\"--in:0\">〔例〕最近の事件：<ruby>富山<rt>とやま<\/rt><\/ruby>市が国勢調査を改ざんして人口を増やした<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p><b>ベース・レジストリ<\/b>は、社会の基本となるデータ（人、法人、土地、住所など）を、正確で最新の状態で一元的に管理し、さまざまな行政サービスから参照できるようにした台帳のこと。デンマークやエストニアが先進例で、日本ではデジタル庁が整備を進めている。現在は、運転免許、弁護士・教員などの資格、会社の登記などが、それぞれ別の機関の台帳でばらばらに管理されていて、引っ越しや結婚のたびに住民が個別に届け出なければならない。これをつなげば、一度の届出で済むようになる。<\/p>","<p><ruby>富山<rt>とやま<\/rt><\/ruby>市の事件は、2025年の国勢調査で、市の職員が人口を水増しした疑いで総務省に告発されたもの（事例参照）。基本となるデータの正確さが行政全体の信頼を左右することを示す例として挙げられたと思われる。<\/p>"]},"富山市の国勢調査水増し事件":{"id":"富山市の国勢調査水増し事件","h":"富山市の国勢調査水増し事件","part":"事例展开","sect":"","blocks":["<p>2025年の国勢調査で、<ruby>富山<rt>とやま<\/rt><\/ruby>市の職員が、調査員が「居住実態なし」とした世帯を戻したり、架空の調査票を作ったりして、人口を2,000人以上水増しした疑いが持たれている ⚠。総務省は2026年9月に統計法違反の疑いで<ruby>富山<rt>とやま<\/rt><\/ruby>県警に告発し、県警は市役所を家宅捜索した。修正後の確定値は40万人を割り込んだと報じられている。国勢調査の人口は、地方交付税の算定や自治体の格付けなどに使われるため、人口規模を維持したいという動機があったとみられている。住民基本台帳の人口と、実際に住んでいる人口とのずれも背景にある。<\/p>"]},"討論の問い":{"id":"討論の問い","h":"討論の問い","part":"講義ノート","sect":"","blocks":["<h5>討論の問い<\/h5>","<h4 class=\"lab\">笔记<\/h4>","<div class=\"notes\"><div class=\"ln\" style=\"--in:0\">住民登録制度は地方が管理すべきか、国が管理すべきか<\/div><div class=\"ln\" style=\"--in:0\">マイナンバーはプライバシーを侵害するか<\/div><div class=\"ln\" style=\"--in:0\">登録制度がすでに存在する場合、どう統合するか、あるいはどう連携させるか<\/div><div class=\"ln\" style=\"--in:0\">〔例〕犬の登録<\/div><div class=\"ln\" style=\"--in:1\">マイクロチップの装着が義務？<\/div><div class=\"ln\" style=\"--in:1\">データ連携との関係：（飼い主の）個人情報は更新したが、チップの中の情報は変わっていない<\/div><div class=\"ln\" style=\"--in:1\">費用がかかりすぎて、プロジェクトを断念した<\/div><div class=\"ln\" style=\"--in:0\">住民登録制度から統計情報を作ることは許されるか<\/div><\/div>","<h4 class=\"lab\">解説<\/h4>","<p>最後は授業での討論用の問い。いずれも今日の内容の応用で、①は地方自治と全国統一システムのバランス、②はマイナンバーの利便性と個人情報保護、③は既存の台帳の統合（ベース・レジストリ）、④は目的外利用の問題。犬の登録は③の具体例で、市町村の<b>犬の登録<\/b>（狂犬病予防法）と、環境省の<b>マイクロチップ<\/b>の登録（2022年から販売される犬猫に装着が義務化）という二つの台帳があり、連携させるのにコストがかかる、という話と思われる（事例参照）。<\/p>"]},"犬の登録とマイクロチップ":{"id":"犬の登録とマイクロチップ","h":"犬の登録とマイクロチップ","part":"事例展开","sect":"","blocks":["<p>犬の飼い主は、狂犬病予防法に基づいて市区町村に犬を登録する義務がある。一方、2022年6月から、ペットショップなどで販売される犬猫にはマイクロチップの装着と環境省のデータベースへの登録が義務づけられた。二つの登録は別々の台帳で、市区町村が希望すればマイクロチップの登録を犬の登録とみなす特例（ワンストップ）に参加できるが、システム対応の費用などから参加していない自治体も多い ⚠。飼い主の住所変更が片方にしか反映されないといった問題が生じる。講義で触れられた「費用がかかりすぎて断念したプロジェクト」がどの事業を指すかは要確認。<\/p>"]}}}]}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const CAT = {dig:'Ｑ', key:'＊'};
const ICON = {dig:'<svg class="ic dig" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="19" text-anchor="middle" class="qi">Ｑ</text></svg>', key:'<svg class="ic key" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M5.5 8.25l13 7.5M5.5 15.75l13-7.5" class="ast"/></svg>'};
const CHEV = '<svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5l5 5-5 5"/></svg>';
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('kc:'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('kc:'+k, JSON.stringify(v)); }catch(e){} }
};
const plainOf = h => { const t = document.createElement('div'); t.innerHTML = h; t.querySelectorAll('rt').forEach(x=>x.remove()); return t.textContent; };

/* ---------- state ---------- */
let lastTick = LS.get('lastTick', null);
let notes = LS.get('notes', {});   // {lecId: {cardId: text}}
const noteOf = (lid, cid) => (notes[lid] && notes[lid][cid]) || '';
let lecIdx = Math.max(0, D.lectures.findIndex(l => l.id === ((lastTick && lastTick.lec) || LS.get('lec', D.lectures[D.lectures.length-1].id))));
let restoring = false, userActed = false;
let marks = new Map(Object.entries(LS.get('marks', {})));
let readMap = new Map(Object.entries(LS.get('read', {})).map(([k, v]) => [k, new Set(v)]));
const readOf = lid => { if (!readMap.has(lid)) readMap.set(lid, new Set()); return readMap.get(lid); };
const isRead = (lid, cid) => readMap.has(lid) && readMap.get(lid).has(cid);
let db = null;
let tab = 'toc';
let curRow = 0;
let rows = [];        // [{el, o, cards:[cid], pager, chips, group}]
let cardEls = new Map();

/* ---------- render lecture ---------- */
function lec(){ return D.lectures[lecIdx]; }
function renderLecture(restore){
  const L = lec(), feed = $('#feed');
  feed.innerHTML = ''; rows = []; cardEls = new Map();
  let group = '', gi = 0;
  L.outline.forEach(o => {
    if (o.t === 'g'){
      const h = document.createElement('h2');
      h.className = 'grp d' + o.depth; h.innerHTML = o.label; h.id = 'g' + (gi++);
      feed.appendChild(h); group = h.textContent;
      return;
    }
    const ids = [o.main, ...o.sides];
    const sec = document.createElement('section');
    sec.className = 'row' + (o.sides.length ? ' has-side' : ' solo');
    const ri = rows.length; sec.dataset.row = ri;
    const guide = document.createElement('div'); guide.className = 'guide';
    guide.innerHTML = '<button class="gk" aria-label="Mark whole row as read"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.3l2.7 2.7 5.6-5.8"/></svg></button>';
    const chips = document.createElement('div'); chips.className = 'chips';
    ids.forEach((cid, k) => {
      const b = document.createElement('button');
      b.className = 'chip' + (k ? '' : ' main on');
      b.innerHTML = L.cards[cid].h; b.dataset.k = k;
      chips.appendChild(b);
    });
    const tgl = document.createElement('button'); tgl.className = 'tgl'; tgl.setAttribute('aria-label', 'Expand / collapse');
    tgl.innerHTML = '<svg viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>';
    guide.append(chips, tgl);
    sec.appendChild(guide);
    const pager = document.createElement('div'); pager.className = 'pager';
    ids.forEach((cid, k) => {
      const c = L.cards[cid];
      const a = document.createElement('article');
      a.className = 'card' + (k ? ' side' : ''); a.dataset.card = cid;
      const eb = `<span class="pt">${c.part}</span>${k && c.sect ? `<span>${c.sect}</span>` : ''}${ids.length > 1 ? `<span class="n">${k+1} / ${ids.length}</span>` : ''}`;
      a.innerHTML = `<div class="eb">${eb}</div><h3>${c.h}</h3><div class="cbody">${c.blocks.join('')}</div><div class="nw"><textarea class="note" rows="1" aria-label="Note"></textarea></div>`;
      const ta = a.querySelector('.note'); ta.value = noteOf(L.id, cid);
      if (isRead(L.id, cid)) a.classList.add('read');
      pager.appendChild(a); cardEls.set(cid, a);
    });
    sec.appendChild(pager);
    feed.appendChild(sec);
    const r = {el: sec, o, ids, pager, chips, group, k: 0, open: false};
    rows.push(r);
    guide.querySelector('.gk').addEventListener('click', () => toggleRowRead(r));
    tgl.addEventListener('click', () => { r.open = !r.open; updateRow(r); if (!r.open) keepInView(r.el); });
    chips.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      if (r.el.classList.contains('collapsed')){ r.open = true; updateRow(r); }
      goSide(r, +b.dataset.k, true);
    });
    if (o.sides.length){
      let t = null;
      pager.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => onPagerSettled(r), 90); }, {passive:true});
    }
  });
  applyAllMarks();
  rows.forEach(updateRow);
  requestAnimationFrame(() => document.querySelectorAll('.note').forEach(ta => { if (ta.value) fitNote(ta); }));
  buildLecs(); buildPane();
  observeRows();

function offsetIn(body, node, off){
  const r = document.createRange(); r.setStart(body, 0); r.setEnd(node, off);
  const f = r.cloneContents(); f.querySelectorAll('rt').forEach(x => x.remove());
  return f.textContent.length;
}
function bodyText(body){ const c = body.cloneNode(true); c.querySelectorAll('rt').forEach(x => x.remove()); return c.textContent; }
function textNodes(body){
  const out = [], w = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest('rt') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  let pos = 0, n; while ((n = w.nextNode())){ out.push([n, pos]); pos += n.data.length; }
  return out;
}
function wrap(body, s, e, cls, id){
  const hits = [];
  textNodes(body).forEach(([n, p]) => { const a = Math.max(s, p), b = Math.min(e, p + n.data.length); if (a < b) hits.push([n, a - p, b - p]); });
  hits.forEach(([n, a, b]) => {
    if (!n.data.slice(a, b).trim()) return;
    let mid = n; if (a > 0) mid = n.splitText(a); if (b - a < mid.data.length) mid.splitText(b - a);
    const mk = document.createElement('mark'); mk.className = 'm ' + cls; mk.dataset.id = id;
    mid.parentNode.insertBefore(mk, mid); mk.appendChild(mid);
  });
}
function applyMarks(cid){
  const a = cardEls.get(cid); if (!a) return;
  const body = a.querySelector('.cbody');
  body.querySelectorAll('mark.m').forEach(m => m.replaceWith(...m.childNodes));
  body.normalize();
  const L = lec();
  const mine = [...marks.entries()].filter(([, m]) => m.lec === L.id && m.card === cid).sort((x, y) => x[1].s - y[1].s);
  if (!mine.length) return;
  const txt = bodyText(body);
  mine.forEach(([id, m]) => {
    let s = m.s, e = m.e;
    if (txt.slice(s, e) !== m.text){ const i = txt.indexOf(m.text); if (i < 0) return; s = i; e = i + m.text.length; }
    wrap(body, s, e, m.cat, id);
  });
}

function act(kind){

  if (e2 <= s) return;

  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const m = {lec: lec().id, card: cid, s, e: e2, text: txt.slice(s, e2), cat: kind, ts: Date.now()};
  marks.set(id, m); persistSet(id, m);

class GhCol {
  constructor(name){ this.name = name; this.data = {}; this.sha = null; this.etag = null; this.pending = new Map(); this.subs = new Set(); this.timer = null; this.loaded = false; }
  url(){ return `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${this.name}.json`; }
  headers(extra){ return Object.assign({Authorization: 'Bearer ' + ghTok(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, extra || {}); }
  snap(){ return {docs: Object.entries(this.data).map(([id, v]) => ({id, exists: true, data: () => v}))}; }
  emit(){ if (!this.loaded) return; const s = this.snap(); this.subs.forEach(f => { try{ f.cb(s); }catch(e){} }); }
  applyPending(){ this.pending.forEach((v, id) => { if (v === null) delete this.data[id]; else this.data[id] = v; }); }
  async pull(force){
    const h = this.headers(!force && this.etag ? {'If-None-Match': this.etag} : {});
    const r = await fetch(this.url(), {headers: h, cache: 'no-store'});
    if (r.status === 304) return false;
    if (r.status === 404){ this.data = {}; this.sha = null; this.etag = null; this.applyPending(); this.loaded = true; this.emit(); return true; }
    if (!r.ok){ const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
    const j = await r.json();
    this.sha = j.sha; this.etag = r.headers.get('ETag');
    let remote = {};
    try{ remote = JSON.parse(b64dec(j.content) || '{}'); }catch(e){ remote = {}; }
    this.data = remote; this.applyPending(); this.loaded = true; this.emit();
    return true;
  }
  put(id, v){
    if (v === null) delete this.data[id]; else this.data[id] = v;
    this.pending.set(id, v); this.emit();
    clearTimeout(this.timer); this.timer = setTimeout(() => this.schedule(), 900);
    return Promise.resolve();
  }
  schedule(){ ghQueue = ghQueue.then(() => this.flush()).catch(() => {}); }
  async flush(){
    for (let attempt = 0; attempt < 4; attempt++){
      if (!this.pending.size) return;
      const sent = new Map(this.pending);
      if (attempt > 0) await this.pull(true);
      const body = {};
      Object.keys(this.data).sort().forEach(k => { body[k] = this.data[k]; });
      sent.forEach((v, id) => { if (v === null) delete body[id]; else body[id] = v; });
      const payload = {message: 'Update ' + this.name, content: b64enc(JSON.stringify(body, null, 1) + '\n')};
      if (this.sha) payload.sha = this.sha;
      const r = await fetch(this.url(), {method: 'PUT', headers: this.headers({'Content-Type': 'application/json'}), body: JSON.stringify(payload), cache: 'no-store'});
      if (r.ok){
        const j = await r.json();
        this.sha = j.content.sha; this.etag = null;
        sent.forEach((v, id) => { if (this.pending.get(id) === v) this.pending.delete(id); });
        setSync('Marks synced');
        return;
      }
      if (r.status === 409 || r.status === 422) continue;   // stale sha: pull and retry
      setSync('Sync failed (' + r.status + '). Kept on this device for now');
      if (r.status === 401 || r.status === 403) toast('Token rejected. Tap the status text to change it');
      return;
    }
    setSync('Sync conflict. Kept on this device for now');
  }
}

async function ghDb(){
  if (!ghTok()){ setSync('Sync is off. Tap here to add a token'); return null; }
  const cols = {};
  ['marks', 'notec', 'readc'].forEach(n => { cols[n] = new GhCol(n); });
  try{
    await Promise.all(Object.values(cols).map(c => c.pull(true)));
  }catch(e){
    setSync(e && (e.status === 401 || e.status === 403) ? 'Token rejected. Tap here to change it' : 'Could not reach GitHub. Marks are stored on this device only');
    return null;
  }
  const refresh = async () => {
    if (document.visibilityState !== 'visible') return;
    try{ await Promise.all(Object.values(cols).map(c => c.pending.size ? null : c.pull(false))); }
    catch(e){ setSync('Sync interrupted. Marks are kept on this device for now'); Object.values(cols).forEach(c => c.subs.forEach(f => { try{ f.err && f.err(e); }catch(_){} })); }
  };
  document.addEventListener('visibilitychange', refresh);
  setInterval(refresh, 45000);
  return {
    collection(name){
      const c = cols[name];
      return {
        doc: id => ({ set: v => c.put(id, v), delete: () => c.put(id, null) }),
        get: () => Promise.resolve(c.snap()),
        onSnapshot(cb, err){ const f = {cb, err}; c.subs.add(f); try{ cb(c.snap()); }catch(e){} return () => c.subs.delete(f); }
      };
    }
  };
}
document.getElementById('syncNote').addEventListener('click', askToken);
document.getElementById('syncNote').style.cursor = 'pointer';

/* ---------- boot ---------- */
renderLecture(true);
(async () => {
  try{ db = await ghDb(); }catch(e){ db = null; }
  if (!db) return;
  $('#syncNote').textContent = 'Marks synced';
  const applyRead = docs => {
    readMap = new Map(); let last = null;
    docs.forEach(d => { if (!d.exists) return; const x = d.data(); if (!x || !x.lec) return; readOf(x.lec).add(x.card); if (!last || (x.ts || 0) > (last.ts || 0)) last = x; });
    LS.set('read', Object.fromEntries([...readMap].map(([k, v]) => [k, [...v]])));
    cardEls.forEach((el, cid) => el.classList.toggle('read', isRead(lec().id, cid))); rows.forEach(updateRow);
    return last;
  };
  try{
    const rs = await db.collection('readc').get();
    const last = applyRead(rs.docs);
    if (last && !userActed){
      lastTick = {lec: last.lec, card: last.card}; LS.set('lastTick', lastTick);
      const li = D.lectures.findIndex(l => l.id === last.lec);
      if (li >= 0 && li !== lecIdx){ lecIdx = li; renderLecture(true); } else restorePos();
    }
  }catch(e){}
  db.collection('notec').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (!d.exists) return; const x = d.data(); if (!x || !x.lec) return; (next[x.lec] = next[x.lec] || {})[x.card] = x.text || ''; });
    Object.keys(pendingNotes).forEach(k => { const i = k.indexOf('|'), lid = k.slice(0, i), cid = k.slice(i + 1); (next[lid] = next[lid] || {})[cid] = noteOf(lid, cid); });
    const ae = document.activeElement;
    if (ae && ae.classList && ae.classList.contains('note')){ const lid = lec().id, cid = ae.closest('.card').dataset.card; (next[lid] = next[lid] || {})[cid] = ae.value; }
    notes = next; LS.set('notes', notes);
    document.querySelectorAll('.note').forEach(ta => { if (ta !== document.activeElement){ const v = noteOf(lec().id, ta.closest('.card').dataset.card); if (ta.value !== v){ ta.value = v; fitNote(ta); } } });
  }, () => {});
  db.collection('marks').onSnapshot(snap => {
    const next = new Map(); snap.docs.forEach(d => { if (d.exists) next.set(d.id, d.data()); });
    marks = new Map([...next].map(([k, v]) => [k, Object.assign({}, v)]));
    cacheLocal(); applyAllMarks(); refreshSide();
  }, () => { $('#syncNote').textContent = 'Sync interrupted. Marks are kept on this device for now'; });
  db.collection('readc').onSnapshot(snap => {
    applyRead(snap.docs);
    if (document.body.classList.contains('open') || matchMedia('(min-width:1100px)').matches) buildPane();
  }, () => {});
})();
})();
